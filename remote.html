<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black, not black-translucent: the page starts below the status bar,
     so iOS never lays its blur over the top buttons -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TabIt">
<meta name="theme-color" content="#1a1b26">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TabIt</title>
<!--
  tabit remote page, served by tabit itself (Settings > Remote) through
  Tailscale Serve: /api/status gives the snapshot, /api/events pushes it
  (SSE) when it changes. Same origin, read-only, no cloud.
-->
<style>
  :root {
    --bg: #1a1b26; --panel: #24283b; --line: #2f3549; --fg: #c0caf5; --dim: #7a82a8;
    --red: #f7768e; --orange: #ff9e64; --yellow: #e0af68; --green: #9ece6a;
    --teal: #73daca; --cyan: #7dcfff; --blue: #7aa2f7; --indigo: #8c8cff;
    --purple: #bb9af7; --pink: #ff79c6; --gray: #a9b1d6; --white: #e6e6e6; --brown: #c49a6c;
    color-scheme: dark;           /* dark scrollbars and form controls */
  }
  html { background: var(--bg); }
  /* a tab, a file or a sheet is open: the list behind it must not scroll */
  :root:has(#detail.on, #viewer.on, #sheet.on),
  :root:has(#detail.on, #viewer.on, #sheet.on) body { overflow: hidden; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px;
           position: sticky; top: 0; background: var(--bg); z-index: 1; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 12px; font: inherit; }
  #state { font-size: 13px; color: var(--dim); margin-bottom: 10px; }
  #state.err { color: var(--red); }
  .dot-live { color: var(--green); } .dot-wait { color: var(--yellow); } .dot-err { color: var(--red); }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .count { background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim);
       margin: 18px 0 6px; }
  details { background: var(--panel); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  summary { list-style: none; padding: 10px 12px; display: flex; gap: 8px; align-items: center;
            font-weight: 600; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  summary .n { color: var(--dim); font-weight: 400; margin-left: auto; font-size: 13px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .tab { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .tab .t { flex: 1; min-width: 0; }
  .tab .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .sub { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab.open { cursor: pointer; }
  .tab.open::after { content: "›"; color: var(--dim); font-size: 20px; }
  /* the open tab, seen in the list beside it on a wide screen */
  .tab.cur { background: rgba(122, 162, 247, .16); box-shadow: inset 3px 0 var(--blue); }
  #detail { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column;
            padding: env(safe-area-inset-top) 12px calc(10px + env(safe-area-inset-bottom)); z-index: 5; }
  #detail.on { display: flex; }
  #detail .bar { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  #detail .bar .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #screen { flex: 1; margin: 0; overflow: auto; background: #11121a; border: 1px solid var(--line);
            border-radius: 8px; padding: 8px; font: 11px/1.35 ui-monospace, Menlo, monospace;
            white-space: pre-wrap; word-break: break-all; color: var(--fg);
            display: flex; flex-direction: column;
            overscroll-behavior: contain;   /* its top or end does not pass the swipe on */ }
  /* a short screen sits at the bottom, by the keys, like a terminal */
  #screen .term { margin-top: auto; white-space: inherit; }
  #screen.ansi { white-space: pre; word-break: normal; background: #16161e; }
  #screen.ansi.fit { overflow-x: hidden; }
  .hist { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--dim); }
  .hist button { padding: 4px 10px; font-size: 13px; }
  .keys { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin: 8px 0; }
  .keys button { min-width: 0; padding: 9px 0; font-size: 13px; }
  @media (min-width: 800px) {
    .keys { grid-template-columns: repeat(8, 56px); }
  }
  .send { display: flex; gap: 6px; }
  .send textarea { flex: 1; min-height: 44px; max-height: 30vh; background: var(--panel); color: var(--fg);
                   border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; resize: vertical; }
  .send button { background: var(--blue); color: #111; border: 0; font-weight: 600; }
  #attach { padding: 0 10px; font-size: 18px; background: var(--panel); color: var(--fg);
            border: 1px solid var(--line); font-weight: 400; }
  #kbdbtn.on, #notify.on { background: var(--blue); color: #111; }
  /* the terminal cursor, shown in keyboard mode */
  #detail:has(#kbdbtn.on) #screen .cur { background: var(--fg); color: var(--bg); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { background: transparent; color: inherit; } }
  /* at the top, so iOS has no reason to scroll the view to show it */
  #kbd { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
  #detail.dropping #screen { outline: 2px dashed var(--blue); outline-offset: -4px; }
  #dmsg { font-size: 13px; color: var(--dim); min-height: 18px; margin-top: 6px; }
  #dmsg.err { color: var(--red); }
  button:disabled { opacity: .4; }
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end;
           justify-content: center; z-index: 9; }
  #sheet.on { display: flex; }
  #sheet .card { background: var(--panel); border-radius: 14px 14px 0 0; width: min(100%, 520px);
                 padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto;
                 overscroll-behavior: contain; }
  #sheet h3 { margin: 0 0 10px; font-size: 16px; }
  #sheet [hidden] { display: none !important; }
  #sheet label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  #sheet input, #sheet select { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
                                border-radius: 8px; padding: 9px; font: inherit; }
  #sheet .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #sheet .row button { flex: 1; padding: 10px; }
  #sheet .seg button.sel { background: var(--blue); color: #111; }
  #sheet .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #sheet .chip.pill { width: auto; height: auto; border-radius: 17px; padding: 6px 12px 6px 8px;
                      display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
                      border-color: var(--line); font-size: 13px; }
  #sheet .chip.pill.sel { border-color: var(--fg); }
  #sheet .chip.pill .dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); }
  #sheet .newg { flex-basis: 100%; font-size: 12px; color: var(--dim); margin-top: 6px; }
  #sheet .chip { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
  #sheet .chip.sel { border-color: var(--fg); }
  #sheet .danger { background: var(--red); color: #111; border: 0; font-weight: 600; }
  #sheet .go { background: var(--blue); color: #111; border: 0; font-weight: 600; }
  summary .gmenu { margin-left: 6px; padding: 2px 10px; }
  #screen a.path { color: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
  #viewer { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column;
            padding: env(safe-area-inset-top) 12px calc(10px + env(safe-area-inset-bottom)); z-index: 6; }
  #viewer.on { display: flex; }
  #viewer .bar { display: flex; align-items: center; gap: 8px; padding: 10px 0; }
  #viewer .bar .name { flex: 1; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #viewer iframe { flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .kind { width: 22px; text-align: center; color: var(--dim); flex: none; }
  .badge { font-size: 12px; border-radius: 6px; padding: 2px 7px; flex: none; }
  .s-blocked { background: var(--red); color: #111; }
  .s-ready { background: var(--green); color: #111; }
  .s-working { background: var(--blue); color: #111; }
  .s-idle, .s-unknown { background: var(--line); color: var(--dim); }
  .s-exited { background: transparent; color: var(--dim); border: 1px solid var(--line); }
  .exited { opacity: .45; }
  .attn .tab:first-child { border-top: 0; }
  /* iOS zooms the page into any text field under 16px when it gets focus */
  .send textarea, #kbd, #sheet input, #sheet select { font-size: 16px; }
  /* typing: the keyboard covers the home bar, so drop the space kept for
     it, and an empty status line, to keep the text box right on the keyboard */
  #detail:has(#text:focus, #kbd:focus) { padding-bottom: 2px; }
  #detail:has(#text:focus, #kbd:focus) #dmsg:empty { display: none; }
  /* a laptop or desktop: tabs on the left, the open tab on the right, like
     tabit itself. pointer: fine keeps a phone out, even in landscape. */
  @media (min-width: 900px) and (pointer: fine) {
    body { display: grid; grid-template-columns: 340px 1fr; grid-template-rows: auto auto 1fr;
           column-gap: 16px; height: 100vh; overflow: hidden; padding-bottom: 12px; }
    #out { min-height: 0; overflow: auto; }
    /* relative, not static: #kbd is placed inside it */
    #detail { position: relative; inset: auto; display: flex; grid-column: 2; grid-row: 1 / -1;
              min-height: 0; padding: 0 0 4px; z-index: auto; }
    #detail:not(.on) > * { display: none; }
    #detail:not(.on)::before { content: "Pick a tab"; margin: auto; color: var(--dim); }
    #back { display: none; }
    /* a file opens over the right side only: the list stays */
    #viewer { left: 372px; right: 16px; bottom: 12px; padding: 0 0 4px; }
    /* the ⌨ glyph is a thin dash in Mac text fonts: take the emoji one */
    #kbdbtn { font: 18px/18px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
  }
</style>
</head>
<body>
<header>
  <h1>TabIt</h1>
  <button id="newbtn" type="button" title="new tab" hidden>＋</button>
  <button id="notify" type="button" title="tell me when an AI tab is done" hidden>🔔</button>
  <button id="refresh" type="button">Refresh</button>
</header>
<div id="state">Loading…</div>
<div id="out"></div>

<div id="detail">
  <div class="bar">
    <button id="back" type="button">‹ Back</button>
    <span class="name" id="dname"></span>
    <span id="dbadge"></span>
    <button id="fitbtn" type="button" title="fit the width / original size">⇔</button>
    <button id="tabmenubtn" type="button" title="group, move, close">⋯</button>
  </div>
  <div class="hist">
    <button id="earlier" type="button">⇡ Earlier</button>
    <button id="latest" type="button">⇣ Latest</button>
    <span id="histinfo"></span>
  </div>
  <pre id="screen"></pre>
  <div id="controls">
    <div class="keys">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="enter">Enter</button><button data-key="esc">Esc</button>
      <button data-key="up">↑</button><button data-key="down">↓</button>
      <button id="kbdbtn" type="button" title="keyboard: every key goes straight in">⌨</button>
      <button data-key="tab">Tab</button><button data-key="left">←</button><button data-key="right">→</button>
      <button data-key="backspace">⌫</button><button data-key="ctrl-c">^C</button>
      <button data-key="ctrl-d">^D</button><button data-key="ctrl-l">^L</button>
    </div>
    <!-- keyboard mode: an input that is focused but not seen, so the phone's
         keyboard opens; what is typed goes to the terminal at once -->
    <input id="kbd" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="keyboard">
    <div class="send">
      <button id="attach" type="button" title="add a photo or a file">📎</button>
      <input id="filein" type="file" multiple hidden>
      <textarea id="text" placeholder="Message" rows="1"></textarea>
      <button id="sendbtn" type="button">Send</button>
    </div>
  </div>
  <div id="dmsg"></div>
</div>

<!-- one sheet for new tab / tab menu / group menu, filled by JS -->
<div id="sheet"><div class="card" id="sheetcard"></div></div>

<div id="viewer">
  <div class="bar">
    <button id="vback" type="button">‹ Back</button>
    <span class="name" id="vname"></span>
    <button id="vraw" type="button" title="as plain text">txt</button>
  </div>
  <!-- no allow-scripts: the file shows, it never runs (the server says so too) -->
  <iframe id="vframe" sandbox title="file"></iframe>
</div>

<script>
const KIND = { ai: "AI", shell: ">_", serial: "⌁", note: "≡", command: "▶", tmux: "▦", connect: "⇄", other: "·" };
const ORDER = { blocked: 0, ready: 1, working: 2, idle: 3, unknown: 4, exited: 5 };
const $ = (id) => document.getElementById(id);

let openGroups = null, lastOk = 0, live = false, es = null, lastSnap = null;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// A path an agent printed: ~/... or /home|/tmp/..., ending in a file name
// with an extension. Runs on already escaped text (paths hold no & < >).
const PCH = `[^\\s"'\`<>()\\[\\]{}，。、；：（）「」\\u0000]`;     // a character a path may hold
const PATH_RE = new RegExp(`(?:~\\/|\\/(?:home|tmp)\\/)${PCH}+\\.[A-Za-z0-9]{1,8}\\b`, "g");
const PATH_AT = new RegExp(`^(?:~\\/|\\/(?:home|tmp)\\/)${PCH}+\\.[A-Za-z0-9]{1,8}\\b`);
const PATH_TAIL = new RegExp(`(?:~\\/|\\/(?:home|tmp)\\/)${PCH}*$`);
const PATH_HEAD = new RegExp(`^\\s*(${PCH}+)`);
let wraps = [];                 // pieces of paths the agent broke across lines

// An agent lays text out to the pane width, so a long path can end one
// line half done and go on at the start of the next (often indented).
// Join such pieces; each piece then links to the whole path.
function findWraps(lines) {
  wraps = [];
  for (let i = 0; i < lines.length - 1; i++) {
    const tail = lines[i].match(PATH_TAIL);
    if (!tail || PATH_AT.test(tail[0])) continue;      // none, or already whole
    let joined = tail[0], parts = [tail[0]];
    for (let j = i + 1; j < Math.min(lines.length, i + 4); j++) {
      const head = lines[j].match(PATH_HEAD);
      if (!head) break;
      joined += head[1];
      parts.push(head[1]);
      const whole = joined.match(PATH_AT);
      if (whole) {
        for (const frag of parts) wraps.push({ frag, path: whole[0] });
        break;
      }
      if (head[0].length < lines[j].length) break;       // the line goes on: no more pieces
    }
  }
}

function linkify(escaped) {
  if (!lastSnap || !lastSnap.files) return escaped;
  const held = [], a = (path, text) => `<a class="path" href="#" data-path="${esc(path)}">${text}</a>`;
  for (const w of wraps) {
    const f = esc(w.frag);
    if (f.length > 2 && escaped.includes(f)) escaped = escaped.split(f).join(`\u0000${held.push([w.path, f]) - 1}\u0000`);
  }
  escaped = escaped.replace(PATH_RE, (p) => a(p.replace(/&amp;/g, "&"), p));
  return escaped.replace(/\u0000(\d+)\u0000/g, (_m, i) => a(held[i][0], held[i][1]));
}

function tabRow(t, showGroup) {
  const st = t.type === "ai" ? (t.ai_status || "unknown") : "";
  const sub = [showGroup && t.groupName, t.sub].filter(Boolean).join(" · ");
  const open = t.type !== "note" || t.path ? " open" : "";
  return `<div class="tab${t.exited ? " exited" : ""}${open}" data-id="${esc(t.id)}">
    <span class="kind">${KIND[t.type] || "·"}</span>
    <div class="t"><div class="title">${esc(t.title || "(untitled)")}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>
    ${st ? `<span class="badge s-${esc(st)}">${esc(st)}</span>` : ""}</div>`;
}

function render(snap) {
  const byId = Object.fromEntries(snap.tabs.map((t) => [t.id, t]));
  for (const g of snap.groups) for (const id of g.tabs) if (byId[id]) byId[id].groupName = g.name;
  const ai = snap.tabs.filter((t) => t.type === "ai");
  const counts = {};
  for (const t of ai) counts[t.ai_status || "unknown"] = (counts[t.ai_status || "unknown"] || 0) + 1;
  // Agents that want you go first, worst news first: the reason to open this.
  const attn = ai.filter((t) => t.ai_status === "blocked" || t.ai_status === "ready")
                 .sort((a, b) => ORDER[a.ai_status] - ORDER[b.ai_status]);
  if (openGroups === null) openGroups = new Set(snap.groups.filter((g) => !g.collapsed).map((g) => g.color));

  let html = `<div class="counts">${Object.keys(counts).sort((a, b) => (ORDER[a] ?? 9) - (ORDER[b] ?? 9))
    .map((s) => `<span class="count"><span class="badge s-${esc(s)}">${esc(s)}</span> ${counts[s]}</span>`).join("")
    || '<span class="count">No AI tabs</span>'}</div>`;
  if (attn.length) html += `<h2>Needs you</h2><details open class="attn"><summary style="display:none"></summary>${attn.map((t) => tabRow(t, true)).join("")}</details>`;
  html += "<h2>Tabs</h2>";
  for (const g of snap.groups) {
    const rows = g.tabs.map((id) => byId[id]).filter(Boolean);
    html += `<details data-color="${esc(g.color)}"${openGroups.has(g.color) ? " open" : ""}>
      <summary><span class="dot" style="background:var(--${esc(g.color)}, var(--gray))"></span>${esc(g.name)}<span class="n">${rows.length}</span>${snap.send ? `<button class="gmenu" data-color="${esc(g.color)}">⋯</button>` : ""}</summary>
      ${rows.map((t) => tabRow(t, false)).join("")}</details>`;
  }
  const loose = snap.tabs.filter((t) => !t.group);
  if (loose.length) html += `<details data-color="" open><summary>No group<span class="n">${loose.length}</span>${snap.send ? `<button class="gmenu" data-color="">⋯</button>` : ""}</summary>${loose.map((t) => tabRow(t, false)).join("")}</details>`;
  $("out").innerHTML = html;
  $("newbtn").hidden = !snap.send;
  for (const b of $("out").querySelectorAll(".gmenu")) b.onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();      // not a fold of the group here
    if (!b.dataset.color) looseMenu();
    else groupMenu(snap.groups.find((g) => g.color === b.dataset.color));
  };
  for (const el of $("out").querySelectorAll(".tab.open")) {
    const t = byId[el.dataset.id];
    el.onclick = () => (t && t.type === "note" ? openFile(t.path) : openTab(el.dataset.id));
  }
  markCur();
  if (current) updateDetail();
  for (const d of $("out").querySelectorAll("details[data-color]")) {
    d.addEventListener("toggle", () => { d.open ? openGroups.add(d.dataset.color) : openGroups.delete(d.dataset.color); });
  }
}

function show(snap, how) {
  if (!snap || !Array.isArray(snap.tabs)) { failed((snap && snap.error) || "bad answer from tabit"); return; }
  if (how === "polled" && live) return;     // a late poll must not undo a newer push
  lastSnap = snap;                // render (and the open tab's view) read it
  notifyChanges(snap);
  render(snap);
  checked(how);
}

// Laptop only: a browser notice when an AI tab goes from working to ready
// or blocked. While it is on, the page keeps listening when hidden.
const NOTE_OK = "Notification" in window && matchMedia("(pointer: fine)").matches;
let noteOn = false, lastStatus = null;
try { noteOn = NOTE_OK && Notification.permission === "granted" && localStorage.getItem("tabit-notify") === "1"; } catch (e) {}
function notifyChanges(snap) {
  if (noteOn && lastStatus) for (const t of snap.tabs) {
    if (lastStatus[t.id] === "working" && (t.ai_status === "ready" || t.ai_status === "blocked")) {
      const n = new Notification(`${t.title || "AI tab"}: ${t.ai_status}`, { body: t.sub || "", tag: `tabit-${t.id}` });
      n.onclick = () => { window.focus(); openTab(t.id); n.close(); };
    }
  }
  lastStatus = Object.fromEntries(snap.tabs.map((t) => [t.id, t.ai_status]));
}
$("notify").hidden = !NOTE_OK;
$("notify").classList.toggle("on", noteOn);
$("notify").onclick = async () => {
  if (!noteOn && Notification.permission !== "granted" && await Notification.requestPermission() !== "granted") {
    alert("The browser blocks notifications for this page.");
    return;
  }
  noteOn = !noteOn;
  try { localStorage.setItem("tabit-notify", noteOn ? "1" : "0"); } catch (e) {}
  $("notify").classList.toggle("on", noteOn);
};

// The time is when tabit was last heard from (a push, an "alive" every
// 10 s, or a poll), not when something last changed.
function checked(how) {
  lastOk = Date.now();
  if (!lastSnap) return;
  setState(how === "live" ? "live" : "polled", how === "live" ? "dot-live" : "dot-wait",
    `${lastSnap.tabs.length} tabs · tabit ${lastSnap.version} · ${new Date().toLocaleTimeString()}`);
}

function setState(label, dot, rest) {
  const el = $("state");
  el.className = dot === "dot-err" ? "err" : "";
  el.innerHTML = `<span class="${dot}">●</span> ${esc(label)}${rest ? " · " + esc(rest) : ""}`;
}

function failed(e) {
  const age = lastOk ? `last good ${Math.round((Date.now() - lastOk) / 1000)} s ago` : "";
  setState(String(e), "dot-err", age);
}

async function refresh(force) {
  try {
    const res = await fetch("api/status", { cache: "no-store" });
    if (!res.ok) throw new Error(`tabit answered HTTP ${res.status}`);
    // force: right after a change made here, take it even while live
    show(await res.json(), force && live ? "live" : "polled");
  } catch (e) {
    failed(e.message === "Failed to fetch" ? "tabit is not reachable (Tailscale on? tabit running?)" : e.message || e);
  }
}

// Live: tabit pushes the state when it changes (checked every 10 s).
// EventSource reconnects by itself; while it is down, poll instead.
function startEvents() {
  if (es || (document.visibilityState !== "visible" && !noteOn)) return;
  es = new EventSource("api/events");
  es.addEventListener("status", (ev) => { live = true; show(JSON.parse(ev.data), "live"); });
  es.addEventListener("alive", () => { if (live) checked("live"); });
  es.onerror = () => { if (live) { live = false; failed("live update lost, retrying"); } };
}
function stopEvents() { if (es) es.close(); es = null; live = false; }

// --- one AI tab: its screen, keys and a text box ---------------------

let back = 0;                    // lines of tmux scrollback above the pane
const BACK_STEP = 200, BACK_MAX = 3000;

// --- tmux colours: `capture-pane -e` gives text and SGR codes only ---
const ANSI16 = ["#15161e", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6",
                "#414868", "#ff899d", "#9fe044", "#faba4a", "#8db0ff", "#c7a9ff", "#a4daff", "#c0caf5"];
function color256(n) {
  if (n < 16) return ANSI16[n];
  if (n >= 232) { const v = 8 + 10 * (n - 232); return `rgb(${v},${v},${v})`; }
  n -= 16;
  const lv = [0, 95, 135, 175, 215, 255];
  return `rgb(${lv[Math.floor(n / 36)]},${lv[Math.floor(n / 6) % 6]},${lv[n % 6]})`;
}

// cells a character takes in a terminal: 2 for CJK and emoji, else 1
const WIDE = /[\u1100-\u115F\u2E80-\uA4CF\uAC00-\uD7A3\uF900-\uFAFF\uFE30-\uFE4F\uFF00-\uFF60\uFFE0-\uFFE6\u{1F300}-\u{1FAFF}\u{20000}-\u{3FFFD}]/u;
// Mark the cursor cell with \uE000 ... \uE001 (ansiToHtml turns them into
// a span). cx, cy: cell and row among the last `rows` lines: for tmux the
// visible pane, for a plain tab the cursor's line and those under it (cy 0).
// Trailing empty lines go, but never the cursor's own line.
function withCursor(ansi, rows, cur) {
  // the marks are ours alone: the same characters in real output are blanked
  const lines = ansi.replace(/[\uE000\uE001]/g, " ").replace(/\n$/, "").split("\n");
  let last = lines.length - 1;
  while (last >= 0 && !lines[last]) last--;
  if (!cur) return lines.slice(0, last + 1).join("\n");
  const [cx, cy] = cur, at = lines.length - rows + cy;
  if (at < 0 || at >= lines.length) return lines.slice(0, last + 1).join("\n");
  let out = "", cell = 0, done = false;
  for (const part of lines[at].split(/(\x1b\[[0-9;:]*[A-Za-z])/)) {
    if (done || part.startsWith("\x1b[")) { out += part; continue; }
    for (const ch of part) {
      const w = /\p{M}/u.test(ch) ? 0 : WIDE.test(ch) ? 2 : 1;
      if (!done && w && cx < cell + w) { out += `\uE000${ch}\uE001`; done = true; }
      else out += ch;
      cell += w;
    }
  }
  if (!done) out += " ".repeat(Math.max(0, cx - cell)) + "\uE000 \uE001";
  lines[at] = out;
  return lines.slice(0, Math.max(last, at) + 1).join("\n");
}

function ansiToHtml(text) {
  let st = {}, html = "";
  const style = () => {
    let fg = st.fg, bg = st.bg;
    if (st.inv) [fg, bg] = [bg || "var(--bg)", fg || "var(--fg)"];
    const css = [fg && `color:${fg}`, bg && `background:${bg}`, st.bold && "font-weight:700",
                 st.dim && "opacity:.6", st.it && "font-style:italic", st.ul && "text-decoration:underline"]
                .filter(Boolean).join(";");
    return css;
  };
  // split into text runs and ESC[...m codes; anything else is dropped
  for (const part of text.split(/(\x1b\[[0-9;:]*[A-Za-z])/)) {
    if (part.startsWith("\x1b[")) {
      if (!part.endsWith("m")) continue;
      const p = part.slice(2, -1).split(/[;:]/).map((x) => (x === "" ? 0 : +x));
      for (let i = 0; i < p.length; i++) {
        const c = p[i];
        if (c === 0) st = {};
        else if (c === 1) st.bold = 1; else if (c === 2) st.dim = 1; else if (c === 3) st.it = 1;
        else if (c === 4) st.ul = 1; else if (c === 7) st.inv = 1;
        else if (c === 22) st.bold = st.dim = 0; else if (c === 23) st.it = 0;
        else if (c === 24) st.ul = 0; else if (c === 27) st.inv = 0;
        else if (c >= 30 && c <= 37) st.fg = ANSI16[c - 30]; else if (c >= 90 && c <= 97) st.fg = ANSI16[c - 82];
        else if (c >= 40 && c <= 47) st.bg = ANSI16[c - 40]; else if (c >= 100 && c <= 107) st.bg = ANSI16[c - 92];
        else if (c === 39) delete st.fg; else if (c === 49) delete st.bg;
        else if ((c === 38 || c === 48) && p[i + 1] === 5) { st[c === 38 ? "fg" : "bg"] = color256(p[i + 2] | 0); i += 2; }
        else if ((c === 38 || c === 48) && p[i + 1] === 2) {
          st[c === 38 ? "fg" : "bg"] = `rgb(${p[i + 2] | 0},${p[i + 3] | 0},${p[i + 4] | 0})`; i += 4;
        }
      }
    } else if (part) {
      const css = style();
      // the cursor cell (marked by withCursor) is its own span, outside any link
      const run = part.split(/\uE000([^]*?)\uE001/)
        .map((x, i) => (i % 2 ? `<span class="cur">${esc(x)}</span>` : linkify(esc(x)))).join("");
      html += css ? `<span style="${css}">${run}</span>` : run;
    }
  }
  return html;
}

let fit = true;
try { fit = localStorage.getItem("tabit.fit") !== "0"; } catch {}

function sizeScreen(cols) {
  const pre = $("screen");
  pre.classList.toggle("fit", fit);
  // a monospace cell is about 0.6 em wide: pick the size that fits the pane
  pre.style.fontSize = fit && cols ? `${Math.max(5, Math.min(14, (pre.clientWidth - 18) / (cols * 0.6)))}px` : "";
}

let screenGen = 0;
async function loadScreen() {
  if (!current) return;
  // only the newest request for the open tab may paint: a slow answer for
  // the tab you just left must not show under this one's title
  const id = current, gen = ++screenGen;
  try {
    const res = await fetch(`api/tabs/${encodeURIComponent(id)}/screen?color=1&back=${back}`, { cache: "no-store" });
    const body = await res.json();
    if (id !== current || gen !== screenGen) return;
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    const pre = $("screen"), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30;
    const fromBottom = pre.scrollHeight - pre.scrollTop;     // to stay put on a refresh
    // unchanged: leave the DOM alone (battery, and a selection survives)
    const sig = (body.ansi !== undefined ? "a" + body.cols + body.cursor + body.rows + body.ansi
                                         : "l" + body.cursor + body.rows + body.lines.join("\n")) + fit;
    if (sig === lastScreen) return;
    lastScreen = sig;
    findWraps(body.ansi !== undefined
      ? body.ansi.replace(/\x1b\[[0-9;:]*[A-Za-z]/g, "").split("\n") : body.lines);
    if (body.ansi !== undefined) {
      pre.classList.add("ansi");
      pre.innerHTML = `<div class="term">${ansiToHtml(withCursor(body.ansi, body.rows, body.cursor))}</div>`;   // escaped run by run
      sizeScreen(body.cols);
    } else {
      pre.classList.remove("ansi", "fit");
      pre.style.fontSize = "";
      pre.innerHTML = `<div class="term">${ansiToHtml(withCursor(body.lines.join("\n") + "\n", body.rows, body.cursor))}</div>`;
    }
    // follow the output at the bottom; reading history, stay where you were
    if (atEnd && !back) pre.scrollTop = pre.scrollHeight;
    else pre.scrollTop = pre.scrollHeight - fromBottom;
    $("histinfo").textContent = back ? `+${back} lines above` : "";
    $("latest").disabled = !back;
    $("earlier").disabled = body.ansi === undefined || back >= BACK_MAX;
  } catch (e) { dmsg(`screen: ${e.message || e}`, true); }
}

function screenEvery() { return back ? 10000 : 3000; }   // history is bigger: refresh less
function restartScreenTimer() {
  clearInterval(screenTimer);
  screenTimer = setInterval(() => { if (document.visibilityState === "visible") loadScreen(); }, screenEvery());
}

const markCur = () => {
  for (const el of $("out").querySelectorAll(".tab")) el.classList.toggle("cur", el.dataset.id === current);
};

function openTab(id) {
  if ($("viewer").classList.contains("on")) $("vback").click();   // a laptop: the list opened another tab
  current = id;
  lastScreen = null;
  back = 0;
  $("screen").textContent = "";
  dmsg("");
  updateDetail();
  $("detail").classList.add("on");
  markCur();
  // opening the tab: tabit counts its "ready" as read
  if (lastSnap && lastSnap.send) inOrder(() => fetch(`api/tabs/${encodeURIComponent(id)}/ack`, {
    method: "POST", headers: { "Content-Type": "application/json", "X-Tabit": "1" }, body: "{}" }).catch(() => {}));
  loadScreen().then(() => { $("screen").scrollTop = $("screen").scrollHeight; });
  restartScreenTimer();
}

function closeTab() {
  setKbd(false);
  current = null;
  clearInterval(screenTimer);
  $("detail").classList.remove("on");
  markCur();
}

// Everything typed into a tab goes out one request at a time, in order:
// an Enter must never overtake the letters typed before it.
let queue = Promise.resolve();
const inOrder = (fn) => (queue = queue.then(fn, fn));

function act(kind, payload) {
  flushTyped();
  const id = current;
  return inOrder(() => actNow(id, kind, payload));
}
async function actNow(id, kind, payload) {
  try {
    // the custom header makes a cross-site page's request fail its CORS check
    const res = await fetch(`api/tabs/${encodeURIComponent(id)}/${kind}`, {
      method: "POST", headers: { "Content-Type": "application/json", "X-Tabit": "1" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    dmsg(kind === "send" ? "sent" : `pressed ${payload.key}`);
    setTimeout(loadScreen, 600);
    return true;
  } catch (e) { dmsg(e.message || String(e), true); return false; }
}

const sheet = (html) => { $("sheetcard").innerHTML = html; $("sheet").classList.add("on"); };

async function manage(path, body) {
  try {
    const res = await fetch(path, {
      method: "POST", headers: { "Content-Type": "application/json", "X-Tabit": "1" },
      body: JSON.stringify(body || {}),
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || `HTTP ${res.status}`);
    await refresh(true);
    return out;
  } catch (e) { alert(e.message || String(e)); return null; }
}
// groups in use by name (their colour as a dot), then the free colours

    style="background:${dot}"></span>${esc(name)}</button>`;
  const free = lastSnap.colors.filter((c) => !used.has(c));
  return pill("", "transparent", "No group")
    + lastSnap.colors.filter((c) => used.has(c)).map((c) => pill(c, `var(--${esc(c)})`, used.get(c))).join("")
    + (free.length ? `<div class="newg">New group</div>` : "")
    + free.map((c) => `<button class="chip${sel(c)}" data-c="${esc(c)}" title="${esc(c)}" style="background:var(--${esc(c)})"></button>`).join("");
};

// --- keyboard mode: each key straight into the terminal ---------------
let kbdOn = false, typed = "", typeTimer = null, screenSoon = null;
function setKbd(on) {
  kbdOn = on;
  $("kbdbtn").classList.toggle("on", on);
  if (on) { $("kbd").value = ""; $("kbd").focus(); dmsg("keyboard: typing goes straight in"); }
  else { $("kbd").blur(); flushTyped(); }
  fitKbd();
}
// Keyboard mode on iOS: the keyboard covers the bottom of the page and iOS
// may slide the page up. Pad the open view so its content fills just the
// part the keyboard leaves. The view itself stays full size, so the list
// behind it never shows (fitting its height to the keyboard did show it).
const vv = window.visualViewport;
function fitKbd() {
  const s = $("detail").style;
  const kb = vv && kbdOn && Math.abs(vv.scale - 1) < 0.01
    ? window.innerHeight - vv.height - vv.offsetTop : 0;
  if (kb < 50) { s.paddingTop = s.paddingBottom = ""; return; }   // no keyboard up
  s.paddingTop = `calc(${vv.offsetTop}px + env(safe-area-inset-top))`;
  s.paddingBottom = `${kb + 2}px`;
}
if (vv) { vv.addEventListener("resize", fitKbd); vv.addEventListener("scroll", fitKbd); }
function refreshSoon() { clearTimeout(screenSoon); screenSoon = setTimeout(loadScreen, 350); }
function post(kind, payload) {
  const id = current;
  return inOrder(() => postNow(id, kind, payload));
}
async function postNow(id, kind, payload) {
  try {
    const res = await fetch(`api/tabs/${encodeURIComponent(id)}/${kind}`, {
      method: "POST", headers: { "Content-Type": "application/json", "X-Tabit": "1" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) { const b = await res.json(); dmsg(b.error || `HTTP ${res.status}`, true); }
  } catch (e) { dmsg(e.message || String(e), true); }
  refreshSoon();
}
// letters are batched for a moment (one request per burst, in order)
function flushTyped() {
  clearTimeout(typeTimer);
  if (!typed || !current) { typed = ""; return; }
  const t = typed; typed = "";
  post("type", { text: t });
}
function queueTyped(text) { typed += text; clearTimeout(typeTimer); typeTimer = setTimeout(flushTyped, 60); }
async function keyNow(key) { flushTyped(); await post("key", { key }); }

$("kbdbtn").onclick = () => setKbd(!kbdOn);
const KEYMAP = { Enter: "enter", Escape: "esc", Tab: "tab", Backspace: "backspace",
                 ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" };
$("kbd").addEventListener("keydown", (ev) => {
  if (ev.isComposing) return;                     // an input method is choosing a word
  let key = KEYMAP[ev.key];
  if (ev.ctrlKey && /^[cdzl]$/i.test(ev.key)) key = "ctrl-" + ev.key.toLowerCase();
  if (!key) return;
  ev.preventDefault();
  keyNow(key);
});
$("kbd").addEventListener("input", (ev) => {
  if (ev.isComposing) return;                     // wait for the chosen word
  if (ev.inputType === "deleteContentBackward") keyNow("backspace");
  else if (ev.inputType === "insertLineBreak") keyNow("enter");
  // a chosen word comes from compositionend; some browsers (Firefox,
  // Safari) also send it here once composing is over: not twice
  else if (ev.inputType === "insertCompositionText" || ev.inputType === "insertFromComposition") { /* sent */ }
  else if (ev.data) queueTyped(ev.data);
  $("kbd").value = "";
});
$("kbd").addEventListener("compositionend", (ev) => {
  if (ev.data) queueTyped(ev.data);               // the word an input method chose
  $("kbd").value = "";
});
// focus went to the text box (or the keyboard was put away): mode off.
// A key button takes focus for a moment and gives it back, so wait a beat.
$("kbd").addEventListener("blur", () => {
  setTimeout(() => { if (kbdOn && document.activeElement !== $("kbd")) setKbd(false); }, 250);
});

// --- attach: 📎 (phone: photos, camera, files), drop, or paste a screenshot.
// The file goes to tabit's uploads folder; its path lands in the text box
// for the agent to read.
async function upload(file, name) {
  if (!current || $("attach").disabled) return;
  dmsg(`uploading ${name} (${Math.round(file.size / 1024)} KB)…`);
  try {
    const res = await fetch(`api/upload?name=${encodeURIComponent(name)}`, {
      method: "POST", body: file,
      headers: { "Content-Type": "application/octet-stream", "X-Tabit": "1" },
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    const t = $("text");
    t.value = (t.value && !/\s$/.test(t.value) ? t.value + " " : t.value) + body.path + " ";
    t.focus();
    dmsg(`attached ${body.path.split("/").pop()}`);
  } catch (e) { dmsg(`upload: ${e.message || e}`, true); }
}

function stamp() {                       // local time, like the phone's clock: 20261006-214850
  const d = new Date(), p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

async function uploadAll(files) {
  for (const f of files) {
    // a pasted screenshot has a generic name ("image.png"): give it a time
    const ext = (f.type.split("/")[1] || "bin").replace("jpeg", "jpg").replace(/[^a-z0-9]/g, "");
    const name = f.name && f.name !== "image.png" ? f.name : `paste-${stamp()}.${ext}`;
    await upload(f, name);
  }
}

$("attach").onclick = () => $("filein").click();
$("filein").onchange = () => { uploadAll([...$("filein").files]); $("filein").value = ""; };
$("text").addEventListener("paste", (ev) => {
  const files = [...(ev.clipboardData ? ev.clipboardData.files : [])];
  if (!files.length) return;                    // plain text: paste as usual
  ev.preventDefault();
  uploadAll(files);
});
const dz = $("detail");
dz.addEventListener("dragover", (ev) => {
  if (!ev.dataTransfer || ![...ev.dataTransfer.types].includes("Files")) return;
  ev.preventDefault();
  dz.classList.add("dropping");
});
dz.addEventListener("dragleave", (ev) => { if (ev.target === dz || !dz.contains(ev.relatedTarget)) dz.classList.remove("dropping"); });
dz.addEventListener("drop", (ev) => {
  dz.classList.remove("dropping");
  if (!ev.dataTransfer || !ev.dataTransfer.files.length) return;
  ev.preventDefault();
  uploadAll([...ev.dataTransfer.files]);
});
// a file dropped anywhere else must not make the browser navigate away
window.addEventListener("dragover", (ev) => ev.preventDefault());
window.addEventListener("drop", (ev) => ev.preventDefault());
$("earlier").onclick = async () => {
  const pre = $("screen"), fromBottom = pre.scrollHeight - pre.scrollTop;
  back = Math.min(BACK_MAX, back + BACK_STEP);
  lastScreen = null;
  await loadScreen();
  pre.scrollTop = Math.max(0, pre.scrollHeight - fromBottom - pre.clientHeight * 0.8);  // show the new lines
  restartScreenTimer();
};
$("latest").onclick = async () => {
  back = 0;
  lastScreen = null;
  await loadScreen();
  $("screen").scrollTop = $("screen").scrollHeight;
  restartScreenTimer();
};

// --- a file: Markdown laid out, HTML without scripts, images, text ---
let viewing = null, rawView = false;
function openFile(path, raw) {
  viewing = path;
  rawView = !!raw;
  $("vraw").textContent = rawView ? "doc" : "txt";       // what the next tap shows
  $("vname").textContent = path.split("/").pop();
  $("vname").title = path;
  $("vframe").src = `api/file?path=${encodeURIComponent(path)}${raw ? "" : "&render=1"}`;
  $("viewer").classList.add("on");
}
$("vback").onclick = () => { $("viewer").classList.remove("on"); $("vframe").src = "about:blank"; viewing = null; };
$("vraw").onclick = () => viewing && openFile(viewing, !rawView);
$("screen").addEventListener("click", (ev) => {
  const a = ev.target.closest("a.path");
  if (!a) return;
  ev.preventDefault();
  openFile(a.dataset.path);
});
$("fitbtn").onclick = () => {
  fit = !fit;
  try { localStorage.setItem("tabit.fit", fit ? "1" : "0"); } catch {}
  loadScreen();
};
for (const b of document.querySelectorAll(".keys button[data-key]")) b.onclick = () => {
  flushTyped();
  act("key", { key: b.dataset.key });
  if (kbdOn) $("kbd").focus();                    // keep the phone keyboard up
};
// Computer: Enter sends, Shift+Enter is a new line. Phone (a touch screen,
// no Shift+Enter on its keyboard): Enter is a new line, the Send button
// sends. Never while an input method is still choosing a word.
const TOUCH = matchMedia("(pointer: coarse)").matches;
$("text").title = TOUCH
  ? "Send sends; Enter is a new line; 📎 attaches a file"
  : "Enter sends, Shift+Enter is a new line; drop or paste a file to attach";
$("text").addEventListener("keydown", (ev) => {
  if (TOUCH || ev.key !== "Enter" || ev.shiftKey || ev.isComposing || ev.keyCode === 229) return;
  ev.preventDefault();
  $("sendbtn").click();
});
$("sendbtn").onclick = async () => {
  const text = $("text").value;
  if (!text.trim()) return;
  if (await act("send", { text })) $("text").value = "";
};

$("refresh").onclick = refresh;
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  if (!live) refresh();
  // live but silent for 25 s: say so (yellow) instead of a frozen green
  else if (Date.now() - lastOk > 25000)
    setState("waiting", "dot-wait", `no word from tabit for ${Math.round((Date.now() - lastOk) / 1000)} s`);
}, 10000);
// Nothing runs while the page is hidden: a locked phone costs nothing.
// Notices on (a laptop only) keep the events coming.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { startEvents(); refresh(); } else if (!noteOn) stopEvents();
});
startEvents();
refresh();

// With the keyboard up, iOS slides the page and a swipe slides it more:
// while a view is open, a swipe moves only what can scroll.
// And pin the list page itself while a view covers it: with the keyboard
// up iOS treats the covering view as part of the page, so a page with
// anything to scroll lets it slide off and shows the list. A pinned page
// has nothing to scroll; on the way back it returns to where it was.
let pinnedAt = null;
function pinList() {
  const open = !!document.querySelector("#detail.on, #viewer.on, #sheet.on");
  if (open && pinnedAt === null) {
    pinnedAt = window.scrollY;
    Object.assign(document.body.style, { position: "fixed", top: `-${pinnedAt}px`, left: "0", right: "0" });
  } else if (!open && pinnedAt !== null) {
    Object.assign(document.body.style, { position: "", top: "", left: "", right: "" });
    window.scrollTo(0, pinnedAt);
    pinnedAt = null;
  }
}
const pinWatch = new MutationObserver(pinList);
for (const id of ["detail", "viewer", "sheet"]) pinWatch.observe($(id), { attributes: true, attributeFilter: ["class"] });
document.addEventListener("touchmove", (ev) => {
  if (!document.querySelector("#detail.on, #viewer.on, #sheet.on") || ev.touches.length > 1) return;
  const box = ev.target.closest && ev.target.closest("#screen, #sheet .card, textarea");
  if (!box || (box.scrollHeight <= box.clientHeight && box.scrollWidth <= box.clientWidth)) ev.preventDefault();
}, { passive: false });
</script>
</body>
