<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="chat">
<meta name="theme-color" content="#0f111a">
<base href="/">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="chat.webmanifest">
<title>tabit chat</title>
<!--
  Tabit Chat, served by tabit itself (Settings > Remote) through Tailscale
  Serve. Each chat is one headless Claude on this computer: /api/chats.
  Chats can be joined in a group: /api/chat-groups. Same origin, no cloud.
-->
<style>
  :root {
    --bg: #0f111a; --panel: #1a1d2b; --line: #262a3d; --fg: #e3e7fb; --dim: #8088aa; --glass: #0f111acc;
    --red: #f7768e; --orange: #ff9e64; --yellow: #e0af68; --green: #9ece6a;
    --teal: #73daca; --cyan: #7dcfff; --blue: #7aa2f7; --purple: #bb9af7; --pink: #ff79c6;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  body { color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 8px 14px; cursor: pointer; transition: transform .12s, filter .12s; }
  button:active { filter: brightness(1.25); transform: scale(.96); }
  button.primary { background: linear-gradient(135deg, #7aa2f7, #9d7cf7); color: #0b0d17; border: 0; font-weight: 600; }
  button.danger { background: var(--red); color: #111; border: 0; font-weight: 600; }
  button:disabled { opacity: .45; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line);
                            border-radius: 12px; padding: 10px 13px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #7aa2f7aa; box-shadow: 0 0 0 3px #7aa2f722; }
  a { color: var(--cyan); }
  header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
           background: var(--bg);
           position: sticky; top: 0; isolation: isolate; transform: translateZ(0);   /* iOS home-screen apps draw a plain header's title blurry */
           border-bottom: 1px solid var(--line); flex: none; z-index: 2; }
  header h1 { text-rendering: geometricPrecision; -webkit-font-smoothing: subpixel-antialiased; }
  header button { border-radius: 99px; min-width: 38px; height: 38px; padding: 0 12px; }
  header #add { background: #7aa2f7; }                 /* one plain colour: no gradient up here */
  #hav[hidden] { display: none; }                      /* .av sets display, which would show it on the list */
  #ttl { flex: 1; min-width: 0; }
  #ttl h1 { flex: none; }
  #ttl .pill { background: none; padding: 0; font-size: 12.5px; margin-top: -1px; overflow: hidden; text-overflow: ellipsis; }
  .av.sm { width: 40px; height: 40px; font-size: 32px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--panel); color: var(--dim); white-space: nowrap; }
  .pill.waiting { color: var(--orange); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.working { background: var(--purple); } .dot.waiting { background: var(--orange); }
  .dot.ready { background: var(--green); } .dot.background { background: var(--purple); }
  .dot.exited { background: transparent; box-shadow: inset 0 0 0 2px var(--dim); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }

  /* the list */
  #tabs { display: flex; gap: 4px; margin: 12px 14px 2px; padding: 4px; background: var(--panel); border-radius: 14px; flex: none; }
  #tabs button { flex: 1; border: 0; background: none; color: var(--dim); border-radius: 10px; font-weight: 600; }
  #tabs button.on { background: #2a2f47; color: var(--fg); box-shadow: 0 1px 4px #0006; }
  #cards { flex: 1; overflow-y: auto; padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  /* a phone: the owl and Chats/Groups scroll with the list, getting smaller
     and fainter until they are gone (--fold, 0 to 1, set while scrolling) */
  #scroller { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #scroller #cards { flex: none; overflow: visible; }
  #top { display: flex; flex-direction: column; flex: none; transform-origin: 50% 100%;
         opacity: calc(1 - var(--fold, 0)); transform: scale(calc(1 - .45 * var(--fold, 0))); }
  .card { display: flex; gap: 14px; align-items: center; border-radius: 16px; padding: 11px 8px; cursor: pointer; transition: background .12s; }
  .card:active { background: #ffffff0f; }
  .av { position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
        font-size: 40px; line-height: 1; }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; margin: 0; border: 2px solid var(--bg); background: var(--dim); }
  .av .dot.working { background: var(--purple); } .av .dot.waiting { background: var(--orange); }
  .av .dot.ready { background: var(--green); } .av .dot.background { background: var(--purple); }
  .av .dot.exited { background: var(--bg); box-shadow: inset 0 0 0 2px var(--dim); }
  .card .body { flex: 1; min-width: 0; }
  .card .top { display: flex; align-items: baseline; gap: 6px; }
  .card .t { font-weight: 650; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ago { color: var(--dim); font-size: 12px; flex: none; }
  .card .more { flex: none; width: 30px; height: 30px; margin: -4px -4px -4px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 20px; line-height: 1; }
  .card .more:active { background: #ffffff1a; color: #fff; }
  .card .meta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .card .sub { color: var(--dim); font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub.last { color: #aab1d6; margin-top: 1px; }
  .card .sub.last.st-work { color: var(--purple); }
  .card .sub.last.st-wait { color: var(--orange); font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #ffffff0d; color: var(--dim); }
  .badge .gdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .badge.m-bypass { color: var(--red); background: #f7768e1f; } .badge.m-ask, .badge.need { color: var(--orange); background: #ff9e641f; }
  .empty { color: var(--dim); text-align: center; padding: 56px 28px; line-height: 1.6; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  /* the conversation */
  #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px;
          overscroll-behavior: contain; }
  .b { max-width: 88%; padding: 10px 14px; border-radius: 20px; overflow-wrap: anywhere; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .b.me { align-self: flex-end; background: linear-gradient(135deg, #6f97f2, #8f78f0); color: #fff; border-bottom-right-radius: 6px;
          white-space: pre-wrap; box-shadow: 0 2px 10px #6f97f233; }
  .b.ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 6px; max-width: 94%; }
  .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  #grip { display: none; }
  .b .ts { margin-top: 4px; font-size: 11px; opacity: .55; text-align: right; }
  .b .rp { display: none; margin-top: 6px; padding: 3px 12px; font-size: 12px; border-radius: 12px; border: 0; background: #ffffff22; color: inherit; }
  .b.sel .rp { display: block; } .b:hover .rp { display: block; }
  .quote { border-left: 3px solid #ffffffb0; background: #00000026; border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; font-size: 13px;
           overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; opacity: .92; }
  .quote[data-go] { cursor: pointer; }
  .quote b { margin-right: 4px; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px #7aa2f7cc; } 100% { box-shadow: 0 0 0 3px transparent; } }
  #replybar { display: none; align-items: center; gap: 8px; margin-bottom: 6px; padding: 6px 6px 6px 10px; border-left: 3px solid #7aa2f7; background: var(--panel); border-radius: 10px; font-size: 13px; }
  #replybar .rq { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  #replybar .rq b { color: #cfd6f6; margin-right: 4px; }
  #replybar button { padding: 2px 10px; border-radius: 99px; }
  .to { font-size: 11px; opacity: .65; margin-top: 3px; }
  .b p { margin: 0 0 .55em; } .b p:last-child { margin-bottom: 0; }
  .b ul, .b ol { margin: 0 0 .55em; padding-left: 1.3em; }
  .b h1, .b h2, .b h3 { font-size: 1.05em; margin: .5em 0 .3em; }
  .b blockquote { margin: 0 0 .55em; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .b code { font: 13.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace; background: #ffffff12; padding: 1px 6px; border-radius: 6px; }
  .b pre { margin: 0 0 .55em; background: #0a0c14; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
           overflow-x: auto; font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  .b pre code { background: none; padding: 0; }
  .b a.path code { color: var(--cyan); }
  .tool { align-self: flex-start; max-width: 94%; font-size: 13.5px; color: var(--dim); }
  .tool summary { cursor: pointer; list-style: none; padding: 5px 12px; background: #ffffff0a; border: 1px solid var(--line); border-radius: 99px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool[open] summary { white-space: normal; border-radius: 12px; }
  .tool pre { margin: 6px 0 0; padding: 8px 10px; background: #101420; border: 1px solid var(--line); border-radius: 10px;
              font: 12.5px/1.4 ui-monospace, Menlo, monospace; overflow-x: auto; max-height: 40vh; white-space: pre-wrap; color: var(--fg); }
  .tool pre.err { border-color: var(--red); }
  .ask { align-self: stretch; border: 1px solid #ff9e6466; border-radius: 18px; padding: 13px 14px; background: linear-gradient(160deg, #ff9e6419, #ff9e6406); }
  .ask h3 { margin: 0 0 4px; font-size: 15px; color: var(--orange); }
  .ask .what { font: 13px/1.4 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; margin-bottom: 8px; }
  .ask details { margin-bottom: 8px; color: var(--dim); font-size: 13px; }
  .ask details pre { margin: 4px 0 0; max-height: 30vh; overflow: auto; white-space: pre-wrap; font: 12.5px/1.4 ui-monospace, Menlo, monospace; }
  .ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask .row button { flex: 1; min-width: 90px; }
  .ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .ask .opts button.on { background: var(--blue); color: #111; border: 0; }
  .ask .q { font-weight: 600; margin-top: 6px; white-space: pre-line; }
  .ask.closed { border-color: var(--line); background: none; opacity: .7; }
  .ask.closed h3 { color: var(--dim); }
  .ask .verdict { color: var(--dim); font-size: 13px; }
  .note { align-self: center; font-size: 12.5px; color: var(--dim); text-align: center; max-width: 90%; }
  .note.err { color: var(--red); }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--dim); animation: bl 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bl { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  #older { align-self: center; }
  #jump { position: absolute; right: 18px; bottom: 90px; width: 40px; height: 40px; padding: 0; border-radius: 50%; display: none; box-shadow: 0 4px 14px #0008; }
  #conn { font-size: 12px; text-align: center; color: var(--yellow); padding: 2px; display: none; flex: none; }

  /* typing */
  #composer { flex: none; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, #0f111a00); }
  #chips { display: none; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  #chips button.on { background: #7aa2f733; border-color: #7aa2f7; }
  #chips button { padding: 3px 10px; font-size: 13px; border-radius: 99px; }
  #atlist { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; max-height: 40vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  #atlist[hidden] { display: none; }
  #atlist button { display: flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 10px; padding: 6px 10px; text-align: left; min-width: 0; }
  #atlist button.on { background: #7aa2f733; }
  #atlist .hint { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #row { display: flex; gap: 6px; align-items: flex-end; }
  #text { scrollbar-width: none; flex: 1; min-height: 44px; max-height: 40vh; resize: none; font-size: 16px; border-radius: 22px; padding: 11px 16px; }
  #text::-webkit-scrollbar { display: none; }
  #row button { height: 44px; flex: none; border-radius: 22px; }
  #attach { width: 44px; padding: 0; font-size: 18px; }
  #send { width: 44px; padding: 0; font-size: 20px; }
  #status { font-size: 12px; color: var(--dim); min-height: 16px; padding: 0 4px 3px; }
  #status.err { color: var(--red); }

  /* sheets */
  /* a file opens over the chat, not in a new window; Esc, ✕ or a tap outside closes it */
  #viewer { width: min(96vw, 1100px); height: 90dvh; max-width: none; max-height: none; padding: 0;
            border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); overflow: hidden; }
  #viewer[open] { display: flex; flex-direction: column; }
  #viewer::backdrop { background: #000a; backdrop-filter: blur(4px); }
  #viewer .vbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); }
  #vname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px ui-monospace, Menlo, monospace; color: var(--dim); }
  #viewer .vbar a, #viewer .vbar button { font-size: 18px; line-height: 1; padding: 6px 10px; color: var(--fg); text-decoration: none; background: none; border: 0; cursor: pointer; }
  #vframe { flex: 1; width: 100%; border: 0; background: #1a1b26; }
  #vimg { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #0a0c14; }
  #viewer [hidden] { display: none; }
  #sheet { position: fixed; inset: 0; background: #0009; backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 5; }
  #sheet.on, #sheet2.on { display: flex; }
  #sheet2 { position: fixed; inset: 0; background: #000a; display: none; align-items: flex-end; justify-content: center; z-index: 6; }
  #sheet .in, #sheet2 .in { background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px;
               max-height: 92vh; overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet .in { background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px;
               max-height: 92vh; overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet h2, #sheet2 h2 { margin: 0 0 10px; font-size: 18px; }
  #sheet label, #sheet2 label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 13px; }
  #sheet .acts, #sheet2 .acts { display: flex; gap: 8px; margin-top: 14px; }
  #sheet .acts button, #sheet2 .acts button { flex: 1; }
  /* the Settings sheet (settings.js, shared with the terminal view) */
  #sheet h3 { margin: 0 0 10px; font-size: 18px; }
  #sheet label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; }
  #sheet label.check input { width: auto; margin: 0; }
  #sheet .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #sheet .row button { flex: 1; padding: 10px; }
  #sheet .go { background: var(--blue); color: #111; border: 0; font-weight: 600; }
  #sheet .pathline { display: flex; gap: 8px; align-items: center; }
  #sheet .pathline input { flex: 1; min-width: 0; }
  #sheet .pathline button { flex: none; padding: 9px 12px; }
  #sheet .acct { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  #sheet .acct span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #sheet .acct button { flex: none; padding: 7px 12px; }
  #sheet .box { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; }
  #sheet .btnlink { display: block; text-align: center; padding: 10px; border-radius: 12px; margin: 8px 0;
                    background: var(--blue); color: #111; text-decoration: none; font-weight: 600; }
  #sheet .dim, #sheet .smsg { color: var(--dim); font-size: 13px; margin: 6px 0; }
  #sheet .err { color: var(--red); font-size: 13px; margin: 6px 0; }
  #sheet .slog { font: 11px/1.3 ui-monospace, Menlo, monospace; white-space: pre-wrap; max-height: 9em;
                 overflow: auto; background: #0a0c14; padding: 6px; border-radius: 6px; margin: 6px 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .chips button { padding: 4px 12px; font-size: 13px; border-radius: 14px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
  .dirs { max-height: 44vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
  .dirs div { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .dirs div:last-child { border: 0; }
  .pick { display: flex; align-items: center; gap: 10px; padding: 8px 4px; }
  .pick input { width: auto; }
  #hav, #ttl { cursor: pointer; }
  /* a group: its members' pictures overlap, the later one in front, like Grok */
  .av.gav { display: block; }
  .av.gav i { position: absolute; width: 60%; height: 60%; border-radius: 50%; font-style: normal; display: grid; place-items: center;
              font-size: .62em; line-height: 1; background: #1c2030; box-shadow: 0 0 0 2px var(--bg); }
  .av.gav .em { line-height: 1; }
  .av.gav i.more { background: #2a2f47; color: var(--dim); font-size: .32em; font-weight: 700; }
  .av.gav.n1 i { width: 100%; height: 100%; font-size: 1em; left: 0; top: 0; }
  .av.gav.n2 i:nth-child(1) { left: 0; top: 0; } .av.gav.n2 i:nth-child(2) { left: 40%; top: 40%; }
  .av.gav.n3 i:nth-child(1) { left: 0; top: 0; } .av.gav.n3 i:nth-child(2) { left: 40%; top: 0; } .av.gav.n3 i:nth-child(3) { left: 20%; top: 40%; }
  .av.gav.n4 i { width: 56%; height: 56%; }
  .av.gav.n4 i:nth-child(1) { left: 0; top: 0; } .av.gav.n4 i:nth-child(2) { left: 44%; top: 0; }
  .av.gav.n4 i:nth-child(3) { left: 0; top: 44%; } .av.gav.n4 i:nth-child(4) { left: 44%; top: 44%; }
  .pk { text-align: center; margin-bottom: 4px; }
  .pk .av.big { margin: 0 auto 10px; }
  .pk-animals, .pk-hues { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .pk-tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .pk-tabs button { padding: 5px 13px; font-size: 13px; border-radius: 99px; }
  .pk-tabs button.on { border-color: #7aa2f7; background: #7aa2f733; }
  .pk-animals button { width: 42px; height: 42px; padding: 0; font-size: 22px; border-radius: 12px; }
  .pk-hues button { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid transparent; }
  .pk-animals button.on { border-color: #7aa2f7; background: #7aa2f733; } .pk-hues button.on { border-color: #fff; }
  .av.big { width: 80px; height: 80px; font-size: 56px; margin: 4px auto 8px; }
  .prof { text-align: center; } .prof h2 { margin: 0 0 2px; }
  .prof .meta { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .stats { display: flex; gap: 8px; margin: 14px 0 4px; }
  .stats div { flex: 1; text-align: center; background: var(--panel); border-radius: 14px; padding: 8px 4px; font-size: 12px; color: var(--dim); }
  .stats b { display: block; font-size: 18px; color: var(--fg); }
  .lib h3 { margin: 12px 0 0; font-size: 15px; } .lh { margin: 12px 0 4px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["--cyan", "--green", "--purple", "--pink", "--yellow", "--teal", "--orange", "--blue"];
const colorOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `var(${COLORS[h % COLORS.length]})`; };

// every chat gets an animal and a colour from its id; the main chat is the owl
const ANIMALS = ["🦊", "🐼", "🐯", "🐸", "🐙", "🦄", "🐧", "🦁", "🐨", "🐰", "🐻", "🐵", "🐳", "🦋", "🐢", "🦔", "🐝", "🦦", "🐶", "🐱", "🐮", "🐷", "🦖"];
const WORK = ["📷", "🎥", "📡", "📶", "🌐", "🔌", "🔧", "🛠️", "💻", "🖥️", "🤖", "🧠", "✨", "🔒", "🔑", "🧱", "☁️", "💾", "🗄️", "📦", "🧪", "🔬", "🛰️", "💡", "📊", "🐛", "⚙️", "🕹️"];
const RIDES = ["🚗", "🚕", "🚌", "🚓", "🚑", "🚒", "🚚", "🚜", "🏎️", "🏍️", "🚲", "🛴", "✈️", "🚁", "🚀", "🛸", "🚂", "🚄", "🚇", "⛵", "🚤", "🚢", "🛶", "🚡", "🛺", "🛻", "🚐", "🛵"];
const SPORT = ["🏃", "🏃‍♀️", "🏃‍♂️", "👟", "🎽", "🥾", "⏱️", "🏅", "🥇", "🏆", "🚴", "🏊", "⛰️", "🧗"];
// the animals also choose a chat's own picture (by its id) and are what the dice rolls: keep that list as it is
const PICK = [["Animals", ANIMALS], ["Work", WORK], ["Rides", RIDES], ["Sport", SPORT]];
const HUES = [0, 40, 90, 150, 200, 250, 300];     // how far the emoji's own colour is turned
const emo = (f) => `<span class="em" style="filter:${f.f}">${esc(f.e)}</span>`;
function face(r) {
  let h = 0; for (const c of String(r.id || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const own = r.default ? { e: "🦉", hue: 0 } : { e: ANIMALS[(h >>> 8) % ANIMALS.length], hue: h % 360 };
  return { e: r.emoji || own.e, f: `hue-rotate(${Number.isInteger(r.hue) ? r.hue : own.hue}deg)` };
}
// the picture of a chat or a group: a group shows its members together, like Grok
function avOf(r) {
  if (!r.members) { const f = face(r); return { cls: "", style: "", html: emo(f) }; }
  const shown = r.members.length > 4 ? 3 : r.members.length;
  const dots = r.members.slice(0, shown).map((m) => { const f = face(m); return `<i>${emo(f)}</i>`; });
  if (r.members.length > 4) dots.push(`<i class="more">+${r.members.length - 3}</i>`);
  return { cls: "gav n" + dots.length, style: "", html: dots.join("") };
}
// the animal and colour chooser; get() says what is shown on top. The dice rolls a
// new animal and colour: a new chat starts with one rolled, and Start keeps it.
function picker(host, r) {
  const pick = { emoji: r.emoji || "", hue: Number.isInteger(r.hue) ? r.hue : null };
  const roll = () => { pick.emoji = ANIMALS[Math.floor(Math.random() * ANIMALS.length)]; pick.hue = HUES[Math.floor(Math.random() * HUES.length)]; };
  if (r.roll) roll();
  host.innerHTML = `<div class="pk"><div class="av big" id="pk-prev"></div>
    <div class="pk-tabs">${PICK.map(([name]) => `<button type="button" data-c="${name}">${name}</button>`).join("")}</div>
    <div class="pk-animals"></div>
    <div class="pk-hues"></div></div>`;
  let cat = (PICK.find(([, list]) => list.includes(pick.emoji)) || PICK[0])[0];      // the shelf of the picture it has now
  const paint = () => {
    host.querySelectorAll("[data-c]").forEach((b) => b.classList.toggle("on", b.dataset.c === cat));
    host.querySelector(".pk-animals").innerHTML = PICK.find(([name]) => name === cat)[1].map((a) => `<button type="button" data-e="${a}">${a}</button>`).join("");
    const f = face(Object.assign({}, r, pick));
    const prev = host.querySelector("#pk-prev"); prev.innerHTML = emo(f);
    host.querySelector(".pk-hues").innerHTML = `<button type="button" data-roll title="roll a new one">🎲</button>` +
      HUES.map((h) => `<button type="button" data-h="${h}">${emo({ e: f.e, f: `hue-rotate(${h}deg)` })}</button>`).join("");
    host.querySelectorAll("[data-e]").forEach((b) => b.classList.toggle("on", b.dataset.e === pick.emoji));
    host.querySelectorAll("[data-h]").forEach((b) => b.classList.toggle("on", +b.dataset.h === pick.hue));
  };
  host.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.roll !== undefined) roll();
    if (b.dataset.c !== undefined) cat = b.dataset.c;
    if (b.dataset.e !== undefined) pick.emoji = b.dataset.e;
    if (b.dataset.h !== undefined) pick.hue = +b.dataset.h;
    paint();
  };
  paint();
  return { get: () => ({ emoji: pick.emoji, hue: pick.hue }) };
}
// "Mirror a tab" chooser: the Claude tabs open in tabit; get() is null or {id, title}
// opus, sonnet, haiku or fable for a model id such as claude-opus-4-5; "" (default) otherwise
const aliasOf = (id) => (cfg?.models || []).find((a) => a && String(id || "").includes(a)) || "";
// the colours tabit gives its tab groups
const GROUP_CSS = { red: "#f7768e", orange: "#ff9e64", yellow: "#e0af68", green: "#9ece6a", teal: "#73daca", cyan: "#7dcfff", blue: "#7aa2f7",
  indigo: "#8c8cff", purple: "#bb9af7", pink: "#ff79c6", gray: "#a9b1d6", white: "#e6e6e6", brown: "#c49a6c" };
// which tabit group a mirrored chat's tab sits in; "" when it sits in none
// "claude-sonnet-5-5" -> "sonnet 5.5"; an alias or an unknown id stays as it is
const modelShort = (id) => { const m = /^claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(id || ""); return m ? `${m[1]} ${m[2]}${m[3] ? "." + m[3] : ""}` : (id || ""); };
// the login and the model a chat uses, as one small badge
const usingBadge = (r) => {
  const model = r.tab ? modelShort(r.tab.model) : (r.model || "default");
  return `<span class="badge">${esc([r.account || "Default", model].filter(Boolean).join(" · "))}</span>`;
};
const groupBadge = (tab) => tab && tab.group ? `<span class="badge"><i class="gdot" style="background:${GROUP_CSS[tab.color] || "var(--dim)"}"></i>${esc(tab.group)}</span>` : "";
const base = (k) => (k === "groups" ? "api/chat-groups" : "api/chats");
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Tabit": "1" }, body: JSON.stringify(body) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(out.error || `HTTP ${res.status}`), { status: res.status });
  return out;
}

// --- a little Markdown: what Claude writes, never raw HTML ------------------
const pathLink = (c) => `<a class="path" target="_blank" rel="noopener" href="api/file?path=${encodeURIComponent(c)}&amp;render=1"><code>${c}</code></a>`;
function inline(raw) {
  // `code` first; a path in plain text opens the file too (home and /tmp:
  // what the file view shows), without a full stop that ends the sentence
  return String(raw).split(/(`[^`]+`)/).map((seg, i) => {
    if (i % 2) {
      const c = esc(seg.slice(1, -1));
      return /^(\/|~\/)[\w.\-\/~@+]+$/.test(c) ? pathLink(c) : `<code>${c}</code>`;
    }
    let t = esc(seg);
    t = t.replace(/(^|[\s(*:：，、「（])((?:\/home\/|\/tmp\/|~\/)[\w.\-\/~@+]*[\w\/~@+-])/g, (_m, pre, c) => pre + pathLink(c));
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }).join("");
}
function md(text) {
  const out = [];
  const parts = String(text).split(/^```[^\n]*\n([\s\S]*?)^```[ \t]*$/m);
  parts.forEach((part, i) => {
    if (i % 2) { out.push(`<pre><code>${esc(part.replace(/\n$/, ""))}</code></pre>`); return; }
    let list = null, para = [];
    const endPara = () => { if (para.length) out.push(`<p>${para.join("<br>")}</p>`); para = []; };
    const endList = () => { if (list) out.push(`</${list}>`); list = null; };
    const lines = part.split("\n");
    for (let n = 0; n < lines.length; n++) {
      const line = lines[n];
      let m;
      if (!line.trim()) { endPara(); endList(); }
      else if (line.trim().startsWith("|")) {              // a table: keep its columns
        endPara(); endList();
        const rows = [line];
        while (n + 1 < lines.length && lines[n + 1].trim().startsWith("|")) rows.push(lines[++n]);
        out.push(`<pre>${esc(rows.join("\n"))}</pre>`);
      }
      else if ((m = line.match(/^(#{1,6})\s+(.*)/))) { endPara(); endList(); out.push(`<h3>${inline(m[2])}</h3>`); }
      else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
        endPara();
        const kind = /\d/.test(m[1]) ? "ol" : "ul";
        // a numbered list cut by bullets goes on from its own number, not from 1
        if (list !== kind) { endList(); out.push(kind === "ol" ? `<ol start="${parseInt(m[1], 10)}">` : "<ul>"); list = kind; }
        out.push(`<li>${inline(m[2])}</li>`);
      }
      else if ((m = line.match(/^>\s?(.*)/))) { endPara(); endList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
      else { endList(); para.push(inline(line)); }
    }
    endPara(); endList();
  });
  return out.join("");
}

// --- a file, over the chat ---------------------------------------------------
// A tapped path shows here instead of in a new window. Ctrl, Cmd, Shift or
// the middle button still open one, and so does ↗.
document.addEventListener("click", (e) => {
  const a = e.target.closest("a.path, a.file");
  if (!a || e.button || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  const path = new URL(a.href).searchParams.get("path") || "";
  const pic = /\.(png|jpe?g|gif|webp|svg)$/i.test(path);     // a picture fits the box; the rest is a page
  $("vname").textContent = tilde(path);
  $("vnew").href = a.href;
  $("vframe").hidden = pic; $("vimg").hidden = !pic;
  if (pic) $("vimg").src = a.href; else $("vframe").src = a.href;
  $("viewer").showModal();
});
$("vclose").onclick = () => $("viewer").close();
$("viewer").onclick = (e) => { if (e.target === $("viewer")) $("viewer").close(); };   // the dim around it
$("viewer").onclose = () => { $("vframe").src = "about:blank"; $("vimg").removeAttribute("src"); };

// --- state ------------------------------------------------------------------
let cfg = null;                 // {accounts, modes, models}
let kind = "chats";             // list tab
let cur = null;                 // {kind: "chats"|"groups", id, es, lastSeq, pending:Set, tools:Map, members, first}
let listTimer = null;
const timeAgo = (t) => { const s = Date.now() / 1000 - t; return s < 60 ? "now" : s < 3600 ? Math.floor(s / 60) + "m" : s < 86400 ? Math.floor(s / 3600) + "h" : Math.floor(s / 86400) + "d"; };
const wide = matchMedia("(min-width: 900px)");
const tilde = (p) => p.replace(/^\/home\/[^/]+/, "~");
const MODE_NAME = { ask: "Ask each time", edits: "Accept edits", plan: "Plan first", bypass: "Bypass (no questions)" };
const status = (msg, bad) => { const s = $("status"); s.textContent = msg || ""; s.className = bad ? "err" : ""; };

// --- the list ---------------------------------------------------------------
// the state as a bubble on the picture: "" when idle
function bub(r) {
  const st = r.asks ? "waiting" : r.state;
  const glyph = { working: "<i></i><i></i><i></i>", waiting: "?", ready: "✓", background: "<span class=\"spin\">↻</span>", exited: "×" }[st];

function connect() {

  me.es = es;

    fetch(`${base(me.kind)}/${me.id}`, { cache: "no-store" }).then(async (res) => {

function take(me, d) {

  const tabDone = d.meta.tab && me.lastSeq && me.state !== "ready" && d.state === "ready";
  me.state = d.state;

  if (d.state === "ready" && d.meta.tab && !document.hidden)
    api(`api/tabs/${encodeURIComponent(d.meta.tab.id)}/ack`, {}).catch(() => {});
  if (me.kind === "groups") d.meta.members.forEach((m) => { me.members[m.id] = m.alias; });
  me.pending = new Set(d.pending.map((p) => p.rid));

$("msgs").addEventListener("scroll", () => {
  const box = $("msgs");
  $("jump").style.display = box.scrollHeight - box.scrollTop - box.clientHeight < 90 ? "none" : "block";
});
$("jump").onclick = () => { const b = $("msgs"); b.scrollTop = b.scrollHeight; };

// --- typing -----------------------------------------------------------------
function grow() { const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, window.innerHeight * 0.4) + "px"; }
$("text").addEventListener("input", () => { grow(); if (cur) localStorage.setItem("draft:" + cur.id, $("text").value); });
$("text").addEventListener("keydown", (e) => {
  if (atHit && !e.isComposing) {
    const n = Math.min(atHit.list.length, AT_MAX);
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); atPick = (atPick + (e.key === "ArrowDown" ? 1 : n - 1)) % n; atShow(); return; }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); atPut(atPick); return; }
    if (e.key === "Escape") { e.preventDefault(); atHit = null; $("atlist").hidden = true; return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
});
$("send").onclick = send;

// --- @name: typing @ lists whom you can call; a tap, Enter or Tab puts the name in
const AT_MAX = 8;
let atHit = null, atPick = 0;     // atHit: {s, f, q, list}, the @word at the cursor
function atNames() {
  if (cur.kind === "groups") {
    const g = (cfg?.groups || []).find((x) => x.id === cur.id);
    return g ? g.members.map((x) => ({ name: x.alias, title: x.title, r: x }))
      : Object.values(cur.members).map((a) => ({ name: a, title: "", r: {} }));
  }
  // in a chat: the other tabs, by the names tabs call each other by
  return (cfg?.chats || []).filter((c) => c.at && c.id !== cur.id).map((c) => ({ name: c.at, title: c.title, r: c }));
}
function atShow() {
  const t = $("text"), box = $("atlist");
  const m = cur && t.selectionStart === t.selectionEnd && t.value.slice(0, t.selectionStart).match(/(?:^|\s)@([\p{L}\p{N}_-]*)$/u);     // a name may be 台中火車站
  const q = m ? m[1].toLowerCase() : "";
  const list = m ? atNames().filter((x) => x.name.toLowerCase().includes(q))
    .sort((a, b) => b.name.toLowerCase().startsWith(q) - a.name.toLowerCase().startsWith(q)) : [];
  if (!list.length) { atHit = null; box.hidden = true; return; }
  if (!atHit || atHit.q !== q) atPick = 0;
  atHit = { s: t.selectionStart - m[1].length - 1, f: t.selectionStart, q, list };
  box.innerHTML = list.slice(0, AT_MAX).map((x, i) => `<button type="button" data-i="${i}" class="${i === atPick ? "on" : ""}">${emo(face(x.r))}<b style="color:${colorOf(x.name)}">@${esc(x.name)}</b><span class="hint">${esc(x.title)}</span></button>`).join("");
  box.hidden = false;
  box.querySelector(".on")?.scrollIntoView({ block: "nearest" });
}
function atPut(i) {
  const t = $("text"), after = t.value.slice(atHit.f);
  const ins = "@" + atHit.list[i].name + (/^\s/.test(after) ? "" : " ");
  t.value = t.value.slice(0, atHit.s) + ins + after;
  const at = atHit.s + ins.length; t.setSelectionRange(at, at);
  t.dispatchEvent(new Event("input")); t.focus();
}
$("text").addEventListener("input", atShow);
$("text").addEventListener("click", atShow);
// a tap on the list may blur the box first (iPhone): hide it only if the focus stays away
$("text").addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== $("text")) { atHit = null; $("atlist").hidden = true; } }, 250));
$("atlist").addEventListener("mousedown", (e) => e.preventDefault());       // keep the keyboard up
$("atlist").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b && atHit) atPut(+b.dataset.i); });
async function send() {
  if (!cur) return;
  const t = $("text"), text = t.value.trim();
  if (!text) return;
  $("send").disabled = true; status("");
  try {
    await api(`${base(cur.kind)}/${cur.id}/send`, { text, reply: replyTo ? replyTo.seq : undefined });
    setReply(null);
    t.value = ""; localStorage.removeItem("draft:" + cur.id); grow(); markChips();
    const b = $("msgs"); b.scrollTop = b.scrollHeight;
  } catch (e) { status(e.message, true); }
  $("send").disabled = false; t.focus();
}
$("stop").onclick = async () => { try { await api(`${base(cur.kind)}/${cur.id}/stop`, {}); } catch (e) { status(e.message, true); } };

// a file or a photo goes to tabit's uploads folder; its path goes into the message
async function upload(file) {
  const name = file.name || "paste." + (file.type.split("/")[1] || "bin");
  status(`uploading ${name}…`);
  try {
    const res = await fetch(`api/upload?name=${encodeURIComponent(name)}`, { method: "POST", body: file,
      headers: { "Content-Type": "application/octet-stream", "X-Tabit": "1" } });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    const t = $("text");
    t.value = (t.value && !/\s$/.test(t.value) ? t.value + " " : t.value) + body.path + " ";
    t.dispatchEvent(new Event("input")); t.focus(); status("");
  } catch (e) { status("upload: " + e.message, true); }
}
$("attach").onclick = () => $("file").click();
$("file").onchange = () => { const f = $("file").files[0]; $("file").value = ""; if (f) upload(f); };
$("text").addEventListener("paste", (e) => {
  const f = [...(e.clipboardData?.files || [])][0];
  if (f) { e.preventDefault(); upload(f); }
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { const f = e.dataTransfer?.files[0]; if (f && cur) { e.preventDefault(); upload(f); } });

$("notify").onclick = async () => {
  if (localStorage.getItem("notify") === "1") { localStorage.removeItem("notify"); status("Notifications off."); return; }
  const p = await Notification.requestPermission();
  if (p === "granted") { localStorage.setItem("notify", "1"); status("You will be told when Claude is done and this page is hidden."); }
  else status("Notifications are blocked in this browser.", true);
};

// --- sheets -----------------------------------------------------------------
function sheet(html) { $("sheetin").innerHTML = html; $("sheet").classList.add("on"); }
function closeSheet() { $("sheet").classList.remove("on"); $("sheetin").innerHTML = ""; }
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
const opts = (list, pick, label) => list.map((v) => `<option value="${esc(v)}"${v === pick ? " selected" : ""}>${esc(label ? label(v) : v)}</option>`).join("");

$("add").onclick = () => (kind === "chats" ? newChat() : newGroup());
async function newChat() {
  cfg = await api("api/chats").catch(() => cfg) || cfg;          // fresh: the groups in tabit change
  if (!cfg) await loadList();
  const recent = [...new Set((cfg?.chats || []).map((c) => c.cwd))].slice(0, 6);
  const last = localStorage.getItem("lastcwd") || "~";
  const tg = cfg?.tabgroups || {};
  const others = tg.groups || [];
  const accts = cfg?.accounts || [];          // more than one: the form asks which; the last pick comes first
  const kept = localStorage.getItem("lastacct");
  const lastAcct = accts.some((a) => a.name === kept) ? kept : cfg?.account || "";
  sheet(`<h2>New chat</h2>
    <div id="n-look"></div>
    <label>Name (optional)</label><input id="n-title" maxlength="80">
    <label>Group</label>
    <select id="n-group"><option value="">No group</option>${others.map((g) => `<option value="${esc(g.color)}">${esc(g.name)}</option>`).join("")}</select>
    ${accts.length > 1 ? `<label>Account</label><select id="n-account">${accts.map((a) => `<option value="${esc(a.name)}"${a.name === lastAcct ? " selected" : ""}>${esc(a.label)}</option>`).join("")}</select>` : ""}
    <label>Folder on this computer</label>
    <input id="n-cwd" value="${esc(last)}" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="chips"><button id="n-browse" type="button">Browse…</button>${recent.map((c) => `<button type="button" data-cwd="${esc(c)}">${esc(tilde(c))}</button>`).join("")}</div>
    <div class="hint">This opens a Claude tab in tabit, in that group. The chat is that tab.</div>
    <div class="hint" id="n-err" style="color:var(--red)"></div>
    <div class="acts"><button type="button" id="n-cancel">Cancel</button><button type="button" class="primary" id="n-go">Start</button></div>`);
  const look = picker($("n-look"), { id: String(Math.random()), roll: true });
  $("n-cancel").onclick = closeSheet;
  $("n-browse").onclick = () => browse($("n-cwd").value, (p) => { $("n-cwd").value = p; });
  $("sheetin").querySelectorAll("[data-cwd]").forEach((b) => { b.onclick = () => { $("n-cwd").value = b.dataset.cwd; }; });
  $("n-go").onclick = async () => {
    try {
      const cwd = $("n-cwd").value.trim() || "~";
      const account = $("n-account") ? { account: $("n-account").value } : {};
      const { chat } = await api("api/chats", { kind: "tab", cwd, group: $("n-group").value, title: $("n-title").value, ...account, ...look.get() });
      localStorage.setItem("lastcwd", cwd);
      if (account.account !== undefined) localStorage.setItem("lastacct", account.account);
      closeSheet(); location.hash = "#c/" + chat.id;
    } catch (e) { $("n-err").textContent = e.message; }
  };
}
// the folder picker is a second sheet on top, so the form under it keeps what was typed
async function browse(start, done) {
  const top = $("sheet2"), box = $("sheet2in");
  const close = () => { top.classList.remove("on"); box.innerHTML = ""; };
  top.classList.add("on");
  async function show(path) {
    try {
      const d = await api("api/dirs?path=" + encodeURIComponent(path || "~"));
      box.innerHTML = `<h2>Pick a folder</h2><div class="hint">${esc(d.show)}</div>
        <div class="chips"><button type="button" id="d-new">＋ New folder</button></div>
        <div class="chips" id="d-form" hidden><input id="d-name" placeholder="Folder name" maxlength="200" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1"><button type="button" class="primary" id="d-make">Create</button></div>
        <div class="hint" id="d-err" style="color:var(--red)"></div>
        <div class="dirs">${d.parent ? '<div data-p="' + esc(d.parent) + '">‹ ..</div>' : ""}${d.dirs.map((x) => `<div data-p="${esc(x.path)}">📁 ${esc(x.name)}</div>`).join("")}${d.more ? '<div class="hint">more folders than shown</div>' : ""}</div>
        <div class="acts"><button type="button" id="d-cancel">Back</button><button type="button" class="primary" id="d-use">Use this folder</button></div>`;
      box.querySelectorAll(".dirs [data-p]").forEach((el) => { el.onclick = () => show(el.dataset.p); });
      $("d-use").onclick = () => { close(); done(d.path); };
      $("d-new").onclick = () => { $("d-form").hidden = false; $("d-new").hidden = true; $("d-name").focus(); };
      $("d-make").onclick = async () => {
        try { const out = await api("api/dirs/new", { parent: d.path, name: $("d-name").value }); show(out.path); }
        catch (e) { $("d-err").textContent = e.message; }
      };
    } catch (e) {
      box.innerHTML = `<h2>Pick a folder</h2><div class="hint warn">${esc(e.message)}</div><div class="acts"><button id="d-cancel" type="button">Back</button></div>`;
    }
    $("d-cancel").onclick = close;
  }
  show(start);
}

async function newGroup() {
  if (!cfg) await loadList();
  const chats = cfg?.chats || [];
  if (chats.length < 2) { sheet(`<h2>New group</h2><div class="hint">A group needs two chats or more. Start the chats first.</div><div class="acts"><button type="button" id="g-cancel">OK</button></div>`); $("g-cancel").onclick = closeSheet; return; }
  sheet(`<h2>New group</h2>
    <div class="hint">You talk to everyone at once, or to one with @name. A chat can pass a message on by starting a line with @name. After ${8} passes it stops and waits for you.</div>
    <label>Name</label><input id="g-title" maxlength="80" placeholder="Team">
    <label>Chats in it</label>
    ${chats.map((c) => `<label class="pick"><input type="checkbox" value="${esc(c.id)}"><span>${esc(c.title)} <span class="badge">${esc(tilde(c.cwd))}</span></span></label>`).join("")}
    <div class="hint" id="g-err" style="color:var(--red)"></div>
    <div class="acts"><button type="button" id="g-cancel">Cancel</button><button type="button" class="primary" id="g-go">Create</button></div>`);
  $("g-cancel").onclick = closeSheet;
  $("g-go").onclick = async () => {
    const members = [...$("sheetin").querySelectorAll("input[type=checkbox]:checked")].map((x) => x.value);
    try {
      const { group } = await api("api/chat-groups", { title: $("g-title").value, members });
      closeSheet(); kind = "groups"; location.hash = "#g/" + group.id;
    } catch (e) { $("g-err").textContent = e.message; }
  };
}

// the profile: who this is, what it made (the library), and the way to settings
const ago = (t) => { const d = Math.floor((Date.now() / 1000 - t) / 86400); return d < 1 ? "Today" : d < 7 ? "This week" : "Older"; };
async function profile() {
  if (!cur || !cur.meta) return;
  const m = cur.meta;
  const hv = avOf(m), av = `<div class="av big ${hv.cls}" style="${hv.style}">${hv.html}</div>`;
  if (cur.kind === "groups") {
    sheet(`<div class="prof">${av}<h2>${esc(m.title)}</h2><div class="hint">${m.members.length} chats in this room</div></div>
      <div class="plist">${m.members.map((x) => `<div class="prow" data-go="${esc(x.id)}"><span class="dot ${esc(x.state)}"></span><b style="color:${colorOf(x.alias)}">@${esc(x.alias)}</b><span class="hint">${esc(x.title)}</span></div>`).join("")}</div>
      <div class="acts"><button type="button" id="p-set">Settings</button><button type="button" class="primary" id="p-close">Close</button></div>`);
    document.querySelectorAll(".prow").forEach((r) => { r.onclick = () => { closeSheet(); kind = "chats"; location.hash = "#c/" + r.dataset.go; }; });
  } else {
    sheet(`<div class="prof">${av}<h2>${esc(m.title)}</h2><div class="hint">${esc(tilde(m.cwd))}</div>
      <div class="meta">${m.tab ? groupBadge(m.tab) : `<span class="badge m-${esc(m.mode)}">${esc(MODE_NAME[m.mode] || m.mode)}</span><span class="badge">${esc(m.model || "default model")}</span>`}</div></div>
      <div id="p-lib" class="hint">Loading…</div>
      <div class="acts"><button type="button" id="p-set">Settings</button><button type="button" class="primary" id="p-close">Close</button></div>`);
    try {
      const lib = await (await fetch(`api/chats/${cur.id}/library`)).json();
      const groups = {};
      for (const f of lib.files || []) (groups[ago(f.ts)] ||= []).push(f);
      const rows = ["Today", "This week", "Older"].filter((k) => groups[k]).map((k) => `<div class="lh">${k}</div>` +
        groups[k].map((f) => `<a class="file" target="_blank" rel="noopener" href="api/file?path=${encodeURIComponent(f.path)}&amp;render=1"><span>${f.action === "Write" ? "📝" : "✏️"}</span><div><b>${esc(f.name)}</b><div class="hint">${esc(tilde(f.path))}</div></div></a>`).join("")).join("");
      const el = $("p-lib");
      if (el) el.outerHTML = `<div class="stats"><div><b>${lib.turns}</b>replies</div><div><b>${(lib.files || []).length}</b>files</div></div>
        <div class="lib"><h3>Library</h3>${rows || '<div class="hint">Nothing made yet. Files Claude writes show up here.</div>'}</div>`;
    } catch (_e) { const el = $("p-lib"); if (el) el.textContent = "Could not load the library."; }
  }
  $("p-close").onclick = closeSheet;
  $("p-set").onclick = () => { closeSheet(); settings(); };
}
$("hav").onclick = $("ttl").onclick = profile;

// t is the open conversation, or a row of the list ({kind, id}); its meta is fetched when missing
const settings = async (t = cur) => {
  if (!t) return;
  if (!t.meta) {
    try { t = { kind: t.kind, id: t.id, meta: (await api(`${base(t.kind)}/${t.id}`)).meta }; } catch (e) { return; }
  }
  const m = t.meta;
  const done = () => { closeSheet(); if (!cur || cur.id !== t.id) loadList(); };
  const gone = () => { closeSheet(); if (cur && cur.id === t.id) location.hash = ""; else loadList(); };
  if (t.kind === "groups") {
    sheet(`<h2>Group</h2><label>Name</label><input id="e-title" value="${esc(m.title)}" maxlength="80">
      <label>Members</label><div id="e-members"></div>
      <div class="hint" id="e-err" style="color:var(--red)"></div>
      <div class="acts"><button type="button" class="danger" id="e-del">Delete group</button><button type="button" id="e-cancel">Cancel</button><button type="button" class="primary" id="e-save">Save</button></div>
      <div class="hint">Deleting a group keeps its chats.</div>`);
    const members = (g) => {
      const inside = new Set(g.members.map((x) => x.id));
      const others = (cfg.chats || []).filter((c) => !inside.has(c.id));
      $("e-members").innerHTML = g.members.map((x) => `<div class="prow"><b style="color:${colorOf(x.alias)}">@${esc(x.alias)}</b><span class="hint" style="flex:1">${esc(x.title)}</span><button type="button" data-rm="${esc(x.id)}" title="take out">✕</button></div>`).join("") +
        (others.length ? `<div class="hint">Add a chat</div><div class="chips">${others.map((c) => `<button type="button" data-add="${esc(c.id)}">＋ ${esc(c.title)}</button>`).join("")}</div>` : "");
    };
    const change = async (body) => {
      try { const out = await api(`api/chat-groups/${t.id}/members`, body); t.meta = out.group; members(out.group); $("e-err").textContent = ""; }
      catch (e) { $("e-err").textContent = e.message; }
    };
    cfg = await api("api/chats");                       // the chats a group can take in
    members(m);
    $("e-members").onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.rm) change({ remove: [b.dataset.rm] });
      if (b.dataset.add) change({ add: [b.dataset.add] });
    };
    $("e-save").onclick = async () => { try { await api(`api/chat-groups/${t.id}/edit`, { title: $("e-title").value }); done(); } catch (e) { $("e-err").textContent = e.message; } };
    $("e-del").onclick = async () => { if (!confirm("Delete this group? Its chats stay.")) return; await api(`api/chat-groups/${t.id}/delete`, {}); gone(); };
  } else {
    sheet(`<h2>Chat</h2><div id="e-look"></div><div class="hint">${m.tab ? "Its tab in tabit: the name is the tab’s name" : esc(tilde(m.cwd))}</div>
      <label>Name</label><input id="e-title" value="${esc(m.title)}" maxlength="80">
      <label>Account</label><select id="e-account">${(cfg.accounts || []).map((a) => `<option value="${esc(a.name)}"${a.name === (m.account || "") ? " selected" : ""}>${esc(a.label)}</option>`).join("")}</select>
      <div ${m.tab ? "hidden" : ""}><label>When Claude wants to do something</label><select id="e-mode">${opts(cfg.modes, m.mode, (x) => MODE_NAME[x])}</select>
      <div class="hint warn" id="e-warn" ${m.mode === "bypass" ? "" : "hidden"}>Bypass: no questions asked.</div></div>
      <label>Model</label><select id="e-model">${opts(cfg.models, m.tab ? aliasOf(m.tab.model) : m.model, (x) => x || "default")}</select>
      <div class="hint" ${m.tab && m.tab.model ? "" : "hidden"}>${m.tab ? "Answering as " + esc(m.tab.model) + ". A new model starts with the next message, and only when the tab is not busy." : ""}</div>
      <div ${m.tab ? "hidden" : ""}><label>Connectors</label><button type="button" id="e-reload">↻ Reload Claude</button>
      <div class="hint" id="e-reloaded">Changed a connector (Gmail, Strava…)? Tap this. The chat keeps its history.</div></div>
      <div class="hint" id="e-err" style="color:var(--red)"></div>
      <div class="acts">${m.default ? "" : '<button type="button" class="danger" id="e-del">Delete</button>'}<button type="button" id="e-cancel">Cancel</button><button type="button" class="primary" id="e-save">Save</button></div>`);
    $("e-reload").onclick = async () => {
      try { await api(`api/chats/${t.id}/reload`, {}); $("e-err").textContent = ""; $("e-reloaded").textContent = "Done. Your next message starts a fresh Claude."; }
      catch (e) { $("e-err").textContent = e.message; }
    };
    const look = picker($("e-look"), m);
    $("e-mode").onchange = () => { $("e-warn").hidden = $("e-mode").value !== "bypass"; };
    $("e-save").onclick = async () => { try { await api(`api/chats/${t.id}/edit`, { title: $("e-title").value, mode: $("e-mode").value, model: $("e-model").value, ...($("e-account").value !== (m.account || "") ? { account: $("e-account").value } : {}), ...look.get() }); done(); } catch (e) { $("e-err").textContent = e.message; } };
    if ($("e-del")) $("e-del").onclick = async () => { if (!confirm(m.tab ? "Delete this chat? Its tab in tabit closes too." : "Delete this chat and its history?")) return; try { await api(`api/chats/${t.id}/delete`, {}); gone(); } catch (e) { $("e-err").textContent = e.message; } };
  }
  $("e-cancel").onclick = closeSheet;
};
$("more").onclick = () => settings();

document.addEventListener("visibilitychange", () => { if (!document.hidden && !cur) loadList(); });
route();
</script>
<script>
/* a wide screen: drag the line between the list and the chat; the width is kept */
(() => {
  const grip = document.getElementById("grip"), root = document.documentElement, KEY = "chatListW", MIN = 240;
  const set = (w) => root.style.setProperty("--listw", Math.round(Math.min(Math.max(w, MIN), Math.max(MIN, innerWidth - 360))) + "px");
  const saved = +localStorage.getItem(KEY); if (saved) set(saved);
  grip.onpointerdown = (e) => {
    grip.setPointerCapture(e.pointerId); grip.classList.add("on");
    grip.onpointermove = (m) => set(m.clientX);
    grip.onpointerup = () => { grip.classList.remove("on"); grip.onpointermove = grip.onpointerup = null;
      localStorage.setItem(KEY, parseInt(root.style.getPropertyValue("--listw")) || ""); };
  };
  grip.ondblclick = () => { root.style.removeProperty("--listw"); localStorage.removeItem(KEY); };
  addEventListener("resize", () => { const w = parseInt(root.style.getPropertyValue("--listw")); if (w) set(w); });
})();
</script>
</body>
</html>
