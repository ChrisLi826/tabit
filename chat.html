<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="chat">
<meta name="theme-color" content="#0f111a">
<base href="/">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="chat.webmanifest">
<title>tabit chat</title>
<!--
  Tabit Chat, served by tabit itself (Settings > Remote) through Tailscale
  Serve. Each chat is one headless Claude on this computer: /api/chats.
  Chats can be joined in a group: /api/chat-groups. Same origin, no cloud.
-->
<style>
  :root {
    --bg: #0f111a; --panel: #1a1d2b; --line: #262a3d; --fg: #e3e7fb; --dim: #8088aa; --glass: #0f111acc;
    --red: #f7768e; --orange: #ff9e64; --yellow: #e0af68; --green: #9ece6a;
    --teal: #73daca; --cyan: #7dcfff; --blue: #7aa2f7; --purple: #bb9af7; --pink: #ff79c6;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  body { color: var(--fg); font: calc(16px * var(--fs, 1))/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 8px 14px; cursor: pointer; transition: transform .12s, filter .12s; }
  button:active { filter: brightness(1.25); transform: scale(.96); }
  button.primary { background: linear-gradient(135deg, #7aa2f7, #9d7cf7); color: #0b0d17; border: 0; font-weight: 600; }
  button.danger { background: var(--red); color: #111; border: 0; font-weight: 600; }
  button:disabled { opacity: .45; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line);
                            border-radius: 12px; padding: 10px 13px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #7aa2f7aa; box-shadow: 0 0 0 3px #7aa2f722; }
  a { color: var(--cyan); }
  header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
           background: var(--bg);
           position: sticky; top: 0; isolation: isolate; transform: translateZ(0);   /* iOS home-screen apps draw a plain header's title blurry */
           border-bottom: 1px solid var(--line); flex: none; z-index: 2; }
  header h1 { text-rendering: geometricPrecision; -webkit-font-smoothing: subpixel-antialiased; }
  header button { border-radius: 99px; min-width: 38px; height: 38px; padding: 0 12px; }
  header #add { background: #7aa2f7; }                 /* one plain colour: no gradient up here */
  #hav[hidden] { display: none; }                      /* .av sets display, which would show it on the list */
  #ttl { flex: 1; min-width: 0; }
  #ttl h1 { flex: none; }
  #ttl .pill { background: none; padding: 0; font-size: calc(12.5px * var(--fs, 1)); margin-top: -1px; overflow: hidden; text-overflow: ellipsis; }
  .av.sm { width: 40px; height: 40px; font-size: 32px; }
  header h1 { font-size: calc(20px * var(--fs, 1)); font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: calc(12px * var(--fs, 1)); padding: 2px 9px; border-radius: 99px; background: var(--panel); color: var(--dim); white-space: nowrap; }
  .pill.waiting { color: var(--orange); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.working { background: var(--purple); } .dot.waiting { background: var(--orange); }
  .dot.ready { background: var(--green); } .dot.background { background: var(--purple); }
  .dot.exited { background: transparent; box-shadow: inset 0 0 0 2px var(--dim); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }

  /* the list */
  #tabs { display: flex; gap: 4px; margin: 12px 14px 2px; padding: 4px; background: var(--panel); border-radius: 14px; flex: none; }
  #tabs button { flex: 1; border: 0; background: none; color: var(--dim); border-radius: 10px; font-weight: 600; }
  #tabs button.on { background: #2a2f47; color: var(--fg); box-shadow: 0 1px 4px #0006; }
  #cards { flex: 1; overflow-y: auto; padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  /* a phone: the owl and Chats/Groups scroll with the list, getting smaller
     and fainter until they are gone (--fold, 0 to 1, set while scrolling) */
  #scroller { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #scroller #cards { flex: none; overflow: visible; }
  #top { display: flex; flex-direction: column; flex: none; transform-origin: 50% 100%;
         opacity: calc(1 - var(--fold, 0)); transform: scale(calc(1 - .45 * var(--fold, 0))); }
  .card { display: flex; gap: 14px; align-items: center; border-radius: 16px; padding: 11px 8px; cursor: pointer; transition: background .12s; }
  .card:active { background: #ffffff0f; }
  .av { position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
        font-size: 40px; line-height: 1; }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; margin: 0; border: 2px solid var(--bg); background: var(--dim); }
  .av .dot.working { background: var(--purple); } .av .dot.waiting { background: var(--orange); }
  .av .dot.ready { background: var(--green); } .av .dot.background { background: var(--purple); }
  .av .dot.exited { background: var(--bg); box-shadow: inset 0 0 0 2px var(--dim); }
  .card .body { flex: 1; min-width: 0; }
  .card .top { display: flex; align-items: baseline; gap: 6px; }
  .card .t { font-weight: 650; font-size: calc(17px * var(--fs, 1)); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ago { color: var(--dim); font-size: calc(12px * var(--fs, 1)); flex: none; }
  .card .more { flex: none; width: 30px; height: 30px; margin: -4px -4px -4px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 20px; line-height: 1; }
  .card .more:active { background: #ffffff1a; color: #fff; }
  .card .meta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .card .sub { color: var(--dim); font-size: calc(14.5px * var(--fs, 1)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub.last { color: #aab1d6; margin-top: 1px; }
  .card .sub.last.st-work { color: var(--purple); }
  .card .sub.last.st-wait { color: var(--orange); font-weight: 600; }
  .badge { font-size: calc(11px * var(--fs, 1)); padding: 1px 8px; border-radius: 99px; background: #ffffff0d; color: var(--dim); }
  .badge .gdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .badge.m-bypass { color: var(--red); background: #f7768e1f; } .badge.m-ask, .badge.need { color: var(--orange); background: #ff9e641f; }
  .empty { color: var(--dim); text-align: center; padding: 56px 28px; line-height: 1.6; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  /* the planner (#p): your own to-dos and dates, kept by a chat you pick */
  /* the Planner's line above the tabs: what is due today, what is late, what is next */
  #pltoday { flex: none; display: flex; align-items: center; gap: 8px; margin: 8px 14px 0; padding: 9px 12px; border-radius: 12px;
             background: var(--panel); border: 1px solid #ffffff0a; cursor: pointer; font-size: calc(13px * var(--fs, 1)); min-width: 0; }
  #pltoday:hover, #pltoday.here { border-color: var(--plbox); }
  #pltoday.late { border-color: #f7768e88; }
  #pltoday b { flex: none; }
  #pltoday .pt-av { margin-left: auto; width: 26px; height: 26px; font-size: 20px; }      /* the Planner chat, and its state */
  #pltoday .pt-av .bub { right: -9px; top: -8px; width: 20px; height: 17px; } #pltoday .pt-av .bub b { font-size: 9px; gap: 1px; }
  #pltoday .pt-av .bub i { width: 2px; height: 2px; }
  #pltoday .n { flex: none; padding: 1px 8px; border-radius: 99px; background: #ffffff0d; color: var(--dim); }
  #pltoday .n.late { color: var(--red); background: #f7768e1f; font-weight: 600; }
  #pltoday { flex-wrap: wrap; row-gap: 4px; }
  #pltoday .next { flex: 1 0 100%; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #plset { font-size: 20px; line-height: 1; padding: 0 10px; }
  #pl-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 14px 14px; overscroll-behavior: contain; }
  #pl-list h3, #pl-list summary { margin: 16px 0 4px; font-size: calc(13px * var(--fs, 1)); color: var(--dim); font-weight: 600; letter-spacing: .04em; }
  #pl-list summary { cursor: pointer; }
  .pl-item { display: flex; align-items: flex-start; gap: 4px; margin: 0 0 8px; padding: 6px 12px 8px 2px; border-radius: 14px;
             background: var(--panel); border: 1px solid #ffffff0a; cursor: pointer; }
  .pl-item:active { background: #262b45; }
  .pl-tick { flex: none; width: 40px; height: 32px; padding: 0; border: 0; background: none; font-size: 22px; color: var(--blue); }
  .pl-body { flex: 1; min-width: 0; padding-top: 4px; }
  .pl-t { overflow-wrap: anywhere; font-size: calc(16px * var(--fs, 1)); line-height: 1.35; }
  .pl-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pl-meta:empty { display: none; }
  .pl-when { display: inline-block; max-width: 100%; padding: 1px 8px; border-radius: 99px; background: #ffffff0d; color: var(--dim);
             font-size: calc(12px * var(--fs, 1)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-when.late { color: var(--red); background: #f7768e1f; }
  .pl-when.pri-urgent { color: #fff; background: var(--red); font-weight: 600; }
  .pl-when.pri-important { color: #111; background: var(--orange); font-weight: 600; }
  .pl-when.pri-low { color: var(--dim); background: #ffffff0d; }
  /* an open card: the item, outlined, with its fields under its words */
  .pl-item.editing { cursor: default; border: 1.5px solid var(--plbox); background: #1a1e30; box-shadow: 0 8px 30px #0008; }
  .pl-item.editing .pl-meta { display: none; }
  .pl-item.editing .pl-t { cursor: pointer; padding-right: 40px; font-weight: 600; }
  .pl-item { position: relative; }
  .pl-edit .pl-close { position: absolute; top: 8px; right: 8px; }
  .pl-edit { cursor: default; margin-top: 2px; }
  .pl-item.done .pl-t { color: var(--dim); text-decoration: line-through; }
  .pl-item.hold .pl-t, .pl-item.hold .pl-tick { color: var(--dim); }
  #sheet .pl-row > div, #plnew .pl-row > div, .pl-edit .pl-row > div { flex: 1; min-width: 0; }
  #plnew .plx, .pl-edit .plx { width: 34px; height: 34px; padding: 0; border-radius: 50%; }
  #plnew .pl-notes, .pl-edit .pl-notes { margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; max-height: 30vh; overflow-y: auto; }
  #plnew .pl-note, .pl-edit .pl-note { background: var(--panel); border-radius: 12px; padding: 6px 10px; overflow-wrap: anywhere; white-space: pre-wrap; }
  #plnew .pl-note .hint, .pl-edit .pl-note .hint { margin: 0 0 2px; }
  .pl-edit textarea#pe-desc { min-height: 5.5em; resize: vertical; }
  .pl-who { border: 0; cursor: pointer; color: var(--blue); background: #7aa2f71f; font: inherit; font-size: calc(12px * var(--fs, 1)); }
  .pl-who.gone { color: var(--dim); background: #ffffff0d; text-decoration: line-through; cursor: default; }
  #sheet .pl-tabs, #plnew .pl-tabs, .pl-edit .pl-tabs { display: flex; flex-wrap: wrap; gap: 6px; max-height: 132px; overflow-y: auto; }
  #sheet .pl-tabs button, #plnew .pl-tabs button, .pl-edit .pl-tabs button { padding: 5px 10px; border-radius: 99px; font-size: calc(13px * var(--fs, 1)); }
  #sheet .pl-tabs button.on, #plnew .pl-tabs button.on, .pl-edit .pl-tabs button.on { background: var(--blue); color: #111; border: 0; }
  #pl-list h4.h-urgent { color: var(--red); } #pl-list h4.h-important { color: var(--orange); } #pl-list h4.h-low { color: var(--dim); }
  #pl-list h4 { margin: 14px 0 6px 4px; font-size: calc(13px * var(--fs, 1)); color: var(--fg); font-weight: 600; }
  .pl-row select { flex: 0 1 30%; min-width: 0; }
  .pl-row { display: flex; gap: 8px; }
  .pl-row input { flex: 1; min-width: 0; }
  #pl-msg { flex: none; padding: 8px 14px 0; font-size: calc(13px * var(--fs, 1)); color: var(--dim); } #pl-msg:empty { display: none; } #pl-msg.err { color: var(--red); }
  #pl-list { padding-bottom: calc(96px + env(safe-area-inset-bottom)) !important; }   /* the last card clears the round button */

  /* #p/c: the manager's conversation floats over the Planner, a box at the
     lower right on a wide screen and a sheet from the bottom on a phone */
  :root { --plbox: #7aa2f78c; --plshadow: 0 0 0 4px #00000066, 0 22px 60px #000e; }
  #dlgbar { display: none; }
  .plrs { display: none; position: absolute; z-index: 2; touch-action: none; }
  @media (min-width: 900px) {            /* its left edge, top edge and top-left corner resize it */
    body.planchat .plrs { display: block; }
    .plrs[data-d="x"] { left: 0; top: 16px; bottom: 0; width: 7px; cursor: ew-resize; }
    .plrs[data-d="y"] { top: 0; left: 16px; right: 0; height: 7px; cursor: ns-resize; }
    .plrs[data-d="xy"] { left: 0; top: 0; width: 18px; height: 18px; cursor: nwse-resize; }
    .plrs:hover, .plrs.on { background: #7aa2f744; }
  }
  body.planchat #talk { display: flex; position: fixed; z-index: 4; right: 24px; bottom: 96px; width: var(--plw, min(420px, calc(100vw - 48px)));
                        height: var(--plh, min(640px, calc(100vh - 150px))); background: var(--bg); border: 1.5px solid var(--plbox);
                        border-radius: 18px; box-shadow: var(--plshadow); overflow: hidden;
                        transform-origin: 100% 100%; animation: plpop .16s ease-out; }
  @keyframes plpop { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: none; } }
  #plfab { position: fixed; z-index: 4; right: 24px; bottom: 24px; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 50%;
           background: linear-gradient(135deg, #6f97f2, #8f78f0); color: #fff; font-size: 26px; line-height: 1; box-shadow: 0 6px 20px #0009; }
  #pladd { position: fixed; z-index: 4; right: 92px; bottom: 28px; width: 48px; height: 48px; padding: 0; border-radius: 50%;
           background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-size: 26px; line-height: 1; box-shadow: 0 6px 20px #0009; }
  #plnew { display: none; position: fixed; z-index: 4; right: 24px; bottom: 96px; width: min(420px, calc(100vw - 48px));
           max-height: calc(100vh - 150px); overflow-y: auto; background: var(--bg); border: 1.5px solid var(--plbox);
           border-radius: 18px; box-shadow: var(--plshadow); padding: 0 16px 14px; transform-origin: 100% 100%; animation: plpop .16s ease-out; }
  #plnew.on { display: block; }
  #plnew .bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 8px; margin: 0 -16px 4px;
                padding: 10px 10px 10px 16px; background: #232842; border-bottom: 1px solid var(--plbox); }
  #plnew .bar b { flex: 1; }
  #plnew .acts button, .pl-edit .acts button { flex: 1; }
  #pladd.open { transform: rotate(45deg); }              /* ＋ turns into ✕ while the box is open */
  #plfab.open .ic { display: none; }
  #plfab.open::after { content: "⌄"; font-size: 30px; display: block; margin-top: -10px; }
  #plfab .bub { position: absolute; right: -8px; top: -9px; width: 28px; height: 24px; }   /* the manager's state, as on its picture */
  #dlg-av { width: 32px; height: 32px; font-size: 24px; }
  #dlg-av .bub { right: -9px; top: -8px; width: 20px; height: 17px; } #dlg-av .bub b { font-size: 9px; gap: 1px; } #dlg-av .bub i { width: 2px; height: 2px; }
  body.planchat #dlgbar { display: flex; flex: none; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; background: #232842; border-bottom: 1px solid var(--plbox); }
  #dlgbar b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dlg-st:empty { display: none; }
  #dlg-x { width: 34px; height: 34px; padding: 0; border-radius: 50%; }
  @media (max-width: 899px) {
    body.planchat #talk { left: 0; right: 0; bottom: 0; top: 10vh; width: auto; height: auto; border-radius: 20px 20px 0 0; }
    body.planchat #plfab { display: none; }            /* the sheet has its own ✕ */
    #plfab { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); }
    #pladd { right: 84px; bottom: calc(22px + env(safe-area-inset-bottom)); }
    body.planchat #pladd { display: none; }
    #plnew { left: 0; right: 0; bottom: 0; width: auto; max-height: 90vh; border-radius: 20px 20px 0 0; }
    body:has(#plnew.on) #plfab, body:has(#plnew.on) #pladd { display: none; }
  }

  /* the conversation */
  #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px;
          overscroll-behavior: contain; }
  .b { max-width: 88%; padding: 10px 14px; border-radius: 20px; overflow-wrap: anywhere; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .b.me { align-self: flex-end; background: linear-gradient(135deg, #6f97f2, #8f78f0); color: #fff; border-bottom-right-radius: 6px;
          white-space: pre-wrap; box-shadow: 0 2px 10px #6f97f233; }
  .b.ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 6px; max-width: 94%; }
  .who { font-size: calc(12px * var(--fs, 1)); font-weight: 600; margin-bottom: 2px; }
  #grip { display: none; }
  .b .ts { margin-top: 4px; font-size: calc(11px * var(--fs, 1)); opacity: .55; text-align: right; }
  .b .rp { display: none; margin-top: 6px; padding: 3px 12px; font-size: calc(12px * var(--fs, 1)); border-radius: 12px; border: 0; background: #ffffff22; color: inherit; }
  .b.queued { opacity: .6; border: 1px dashed #ffffff88; }
  .b.queued .qn { margin-top: 6px; font-size: calc(12px * var(--fs, 1)); opacity: .9; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; white-space: normal; }
  .b.queued .unq { padding: 3px 12px; font-size: calc(12px * var(--fs, 1)); border-radius: 12px; border: 0; background: #ffffff33; color: inherit; }
  .b.sel .rp { display: block; } .b:hover .rp { display: block; }
  .quote { border-left: 3px solid #ffffffb0; background: #00000026; border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; font-size: calc(13px * var(--fs, 1));
           overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; opacity: .92; }
  .quote[data-go] { cursor: pointer; }
  .quote b { margin-right: 4px; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px #7aa2f7cc; } 100% { box-shadow: 0 0 0 3px transparent; } }
  #scr { margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  #scr[hidden] { display: none; }
  #scr .sh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: calc(13px * var(--fs, 1)); }
  #scr .sh b { font-family: ui-monospace, Menlo, monospace; color: var(--cyan); }
  #scr .keys { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  #scr .sz { display: flex; gap: 4px; }
  #scr button { padding: 3px 9px; font-size: calc(12px * var(--fs, 1)); border-radius: 8px; }
  #scr pre:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  #scr-grip { height: 14px; margin: -6px -10px 2px; cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center; }
  #scr-grip::before { content: ""; width: 44px; height: 4px; border-radius: 2px; background: #ffffff40; }
  #scr-grip:hover::before, #scr-grip.on::before { background: var(--blue); }
  #scr pre { margin: 6px 0 0; height: 45vh; min-height: 80px; max-height: 85vh; overflow: auto; font: calc(12px * var(--fs, 1))/1.35 ui-monospace, Menlo, monospace; background: #0a0c14; border-radius: 8px; padding: 8px; }
  #replybar { display: none; align-items: center; gap: 8px; margin-bottom: 6px; padding: 6px 6px 6px 10px; border-left: 3px solid #7aa2f7; background: var(--panel); border-radius: 10px; font-size: calc(13px * var(--fs, 1)); }
  #replybar .rq { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  #replybar .rq b { color: #cfd6f6; margin-right: 4px; }
  #replybar button { padding: 2px 10px; border-radius: 99px; }
  .to { font-size: calc(11px * var(--fs, 1)); opacity: .65; margin-top: 3px; }
  .b p { margin: 0 0 .55em; } .b p:last-child { margin-bottom: 0; }
  .b ul, .b ol { margin: 0 0 .55em; padding-left: 1.3em; }
  .b h1, .b h2, .b h3 { font-size: 1.05em; margin: .5em 0 .3em; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["--cyan", "--green", "--purple", "--pink", "--yellow", "--teal", "--orange", "--blue"];
const colorOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `var(${COLORS[h % COLORS.length]})`; };

// every chat gets an animal and a colour from its id; the main chat is the owl
const ANIMALS = ["🦊", "🐼", "🐯", "🐸", "🐙", "🦄", "🐧", "🦁", "🐨", "🐰", "🐻", "🐵", "🐳", "🦋", "🐢", "🦔", "🐝", "🦦", "🐶", "🐱", "🐮", "🐷", "🦖"];
const WORK = ["📷", "🎥", "📡", "📶", "🌐", "🔌", "🔧", "🛠️", "💻", "🖥️", "🤖", "🧠", "✨", "🔒", "🔑", "🧱", "☁️", "💾", "🗄️", "📦", "🧪", "🔬", "🛰️", "💡", "📊", "🐛", "⚙️", "🕹️"];
const RIDES = ["🚗", "🚕", "🚌", "🚓", "🚑", "🚒", "🚚", "🚜", "🏎️", "🏍️", "🚲", "🛴", "✈️", "🚁", "🚀", "🛸", "🚂", "🚄", "🚇", "⛵", "🚤", "🚢", "🛶", "🚡", "🛺", "🛻", "🚐", "🛵"];
const SPORT = ["🏃", "🏃‍♀️", "🏃‍♂️", "👟", "🎽", "🥾", "⏱️", "🏅", "🥇", "🏆", "🚴", "🏊", "⛰️", "🧗"];
// the animals also choose a chat's own picture (by its id): keep that list as it is
const PEOPLE = ["🧐", "🤓", "🤵", "🤵‍♂️", "🤵‍♀️", "💁", "💁‍♂️", "💁‍♀️", "🧑‍💼", "👨‍💼", "👩‍💼", "🛎️"];      // a butler, a desk, an assistant
const PICK = [["Animals", ANIMALS], ["Work", WORK], ["People", PEOPLE], ["Rides", RIDES], ["Sport", SPORT]];
// people take a human skin tone, light to dark, not a turned colour; the faces and the bell take neither
const TONES = ["\u{1F3FB}", "\u{1F3FC}", "\u{1F3FD}", "\u{1F3FE}", "\u{1F3FF}"];
const untone = (e) => e.replace(/[\u{1F3FB}-\u{1F3FF}]/gu, "");
const toneOf = (e) => (e.match(/[\u{1F3FB}-\u{1F3FF}]/u) || [""])[0];
const canTone = (e) => PEOPLE.slice(2, -1).includes(untone(e));
const toned = (e, t) => { const [first, ...rest] = [...untone(e)]; return first + t + rest.join(""); };
const HUES = [0, 40, 90, 150, 200, 250, 300];     // how far the emoji's own colour is turned
const emo = (f) => `<span class="em" style="filter:${f.f}">${esc(f.e)}</span>`;
function face(r) {
  let h = 0; for (const c of String(r.id || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const own = r.default ? { e: "🦉", hue: 0 } : { e: ANIMALS[(h >>> 8) % ANIMALS.length], hue: h % 360 };
  return { e: r.emoji || own.e, f: `hue-rotate(${Number.isInteger(r.hue) ? r.hue : own.hue}deg)` };
}
// the picture of a chat or a group: a group shows its members together, like Grok
function avOf(r) {
  if (!r.members) { const f = face(r); return { cls: "", style: "", html: emo(f) }; }
  const shown = r.members.length > 4 ? 3 : r.members.length;
  const dots = r.members.slice(0, shown).map((m) => { const f = face(m); return `<i>${emo(f)}</i>`; });
  if (r.members.length > 4) dots.push(`<i class="more">+${r.members.length - 3}</i>`);
  return { cls: "gav n" + dots.length, style: "", html: dots.join("") };
}
// the picture and colour chooser; get() says what is shown on top. A new chat starts
// with one rolled from every shelf, and Start keeps it; the dice rolls from the shelf shown.
function picker(host, r) {
  const pick = { emoji: r.emoji || "", hue: Number.isInteger(r.hue) ? r.hue : null };
  const any = (list) => list[Math.floor(Math.random() * list.length)];
  const roll = (list) => {
    pick.emoji = any(list); pick.hue = PEOPLE.includes(pick.emoji) ? 0 : any(HUES);
    if (canTone(pick.emoji)) pick.emoji = toned(pick.emoji, any(TONES));
  };
  if (r.roll) roll(PICK.flatMap(([, list]) => list));
  host.innerHTML = `<div class="pk"><div class="av big" id="pk-prev"></div>
    <div class="pk-tabs">${PICK.map(([name]) => `<button type="button" data-c="${name}">${name}</button>`).join("")}</div>
    <div class="pk-animals"></div>
    <div class="pk-hues"></div></div>`;
  let cat = (PICK.find(([, list]) => list.includes(untone(pick.emoji))) || PICK[0])[0];      // the shelf of the picture it has now
  let tone = toneOf(pick.emoji) || TONES[0];
  const paint = () => {
    host.querySelectorAll("[data-c]").forEach((b) => b.classList.toggle("on", b.dataset.c === cat));
    host.querySelector(".pk-animals").innerHTML = PICK.find(([name]) => name === cat)[1].map((a) =>
      `<button type="button" data-e="${a}">${canTone(a) ? toned(a, tone) : a}</button>`).join("");
    const f = face(Object.assign({}, r, pick));
    const prev = host.querySelector("#pk-prev"); prev.innerHTML = emo(f);
    const person = PEOPLE.includes(untone(f.e));
    host.querySelector(".pk-hues").innerHTML = `<button type="button" data-roll title="roll a new one">🎲</button>` + (person
      ? (canTone(f.e) ? TONES.map((t) => `<button type="button" data-t="${t}" title="skin tone">${toned(f.e, t)}</button>`).join("") : "")
      : HUES.map((h) => `<button type="button" data-h="${h}">${emo({ e: f.e, f: `hue-rotate(${h}deg)` })}</button>`).join(""));
    host.querySelectorAll("[data-e]").forEach((b) => b.classList.toggle("on", b.dataset.e === untone(pick.emoji)));
    host.querySelectorAll("[data-t]").forEach((b) => b.classList.toggle("on", b.dataset.t === toneOf(pick.emoji)));
    host.querySelectorAll("[data-h]").forEach((b) => b.classList.toggle("on", +b.dataset.h === pick.hue));
  };
  host.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.roll !== undefined) roll(PICK.find(([name]) => name === cat)[1]);
    if (b.dataset.c !== undefined) cat = b.dataset.c;
    if (b.dataset.e !== undefined) {
      pick.emoji = canTone(b.dataset.e) ? toned(b.dataset.e, tone) : b.dataset.e;
      if (PEOPLE.includes(b.dataset.e)) pick.hue = 0;                   // a person keeps its own colours
    }
    if (b.dataset.t !== undefined) { tone = b.dataset.t; pick.emoji = toned(pick.emoji, tone); }
    if (b.dataset.h !== undefined) pick.hue = +b.dataset.h;
    paint();
  };
  paint();
  return { get: () => ({ emoji: pick.emoji, hue: pick.hue }) };
}
// "Mirror a tab" chooser: the Claude tabs open in tabit; get() is null or {id, title}
// opus, sonnet, haiku or fable for a model id such as claude-opus-4-5; "" (default) otherwise
// who answers in a chat: a Codex, Grok or Antigravity tab's chat is that AI, every other chat is Claude
const AI_NAMES = { codex: "Codex", grok: "Grok", agy: "Antigravity" };
const aiName = (meta) => (meta && meta.tab && AI_NAMES[meta.tab.cli]) || "Claude";
const aliasOf = (id) => (cfg?.models || []).find((a) => a && String(id || "").includes(a)) || "";
// the colours tabit gives its tab groups
const GROUP_CSS = { red: "#f7768e", orange: "#ff9e64", yellow: "#e0af68", green: "#9ece6a", teal: "#73daca", cyan: "#7dcfff", blue: "#7aa2f7",
  indigo: "#8c8cff", purple: "#bb9af7", pink: "#ff79c6", gray: "#a9b1d6", white: "#e6e6e6", brown: "#c49a6c" };
// which tabit group a mirrored chat's tab sits in; "" when it sits in none
// "claude-sonnet-5-5" -> "sonnet 5.5"; an alias or an unknown id stays as it is
const modelShort = (id) => { const m = /^claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(id || ""); return m ? `${m[1]} ${m[2]}${m[3] ? "." + m[3] : ""}` : (id || ""); };
// the login and the model a chat uses, as one small badge
const usingBadge = (r) => {
  const model = (r.tab ? modelShort(r.tab.model) : (r.model || "default")) + ((r.tab ? r.tab.effort : r.effort) ? " " + (r.tab ? r.tab.effort : r.effort) : "");
  const who = r.tab && AI_NAMES[r.tab.cli] ? [AI_NAMES[r.tab.cli], r.account].filter(Boolean).join(" · ") : r.account || "Default";
  return `<span class="badge">${esc([who, model].filter(Boolean).join(" · "))}</span>`;
};
const groupBadge = (tab) => tab && tab.group ? `<span class="badge"><i class="gdot" style="background:${GROUP_CSS[tab.color] || "var(--dim)"}"></i>${esc(tab.group)}</span>` : "";
const base = (k) => (k === "groups" ? "api/chat-groups" : "api/chats");
async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json", "X-Tabit": "1" }, body: JSON.stringify(body) });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(out.error || `HTTP ${res.status}`), { status: res.status });
  return out;
}

// --- a little Markdown: what Claude writes, never raw HTML ------------------
const pathLink = (c) => `<a class="path" target="_blank" rel="noopener" href="api/file?path=${encodeURIComponent(c)}&amp;render=1"><code>${c}</code></a>`;
function inline(raw) {
  // `code` is set aside first, so **bold** may hold it; a path in plain text
  // opens the file too (home and /tmp: what the file view shows), without a
  // full stop that ends the sentence; a name may hold any letters (Chinese too)
  const codes = [];
  let t = esc(String(raw).replace(/\0/g, "").replace(/`([^`]+)`/g, (_m, c) => `\0${codes.push(c) - 1}\0`));
  t = t.replace(/(^|[\s(*:：，、「（])((?:\/home\/|\/tmp\/|~\/)[\p{L}\p{M}\p{N}_.\-\/~@+]*[\p{L}\p{M}\p{N}_\/~@+\-])/gu, (_m, pre, c) => pre + pathLink(c));
  t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  t = t.replace(/(^|[^\w*])\*([^*\s](?:[^*]*[^*\s])?)\*(?![\w*])/g, "$1<i>$2</i>");
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return t.replace(/\0(\d+)\0/g, (_m, i) => {
    const c = esc(codes[i]);
    return /^(\/|~\/)[\p{L}\p{M}\p{N}_.\-\/~@+]+$/u.test(c) ? pathLink(c) : `<code>${c}</code>`;
  });
}
// colors in a code block, like the terminal shows them: keys, strings,
// numbers, words of the language, comments
const HL_WORDS = new Set(("if else elif for while do return function const let var def class import from export as " +
  "try catch except finally raise throw new await async break continue switch case default struct static void int char " +
  "unsigned long bool true false null None True False nil fn pub use mut local then fi esac done in echo sizeof typedef enum").split(" "));
const HL_HASH = /^(sh|bash|zsh|shell|console|py|python|yaml|yml|toml|ini|conf|cfg|make|makefile|dockerfile|perl|ruby|rb)$/i;
function hl(code, lang) {
  const note = HL_HASH.test(lang) ? "#[^\\n]*" : "(?<!:)\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/";
  const re = new RegExp(`(${note})|("(?:\\\\.|[^"\\\\\\n])*"|'(?:\\\\.|[^'\\\\\\n])*')(\\s*:)?|\\b(0x[\\da-fA-F]+|\\d+(?:\\.\\d+)?)\\b|\\b([A-Za-z_]\\w*)\\b`, "g");
  let out = "", at = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(at, m.index)); at = re.lastIndex;
    if (m[1]) out += `<span class="hc">${esc(m[1])}</span>`;
    else if (m[2]) out += m[3] ? `<span class="hk">${esc(m[2])}</span>${esc(m[3])}` : `<span class="hs">${esc(m[2])}</span>`;
    else if (m[4]) out += `<span class="hn">${m[4]}</span>`;
    else out += HL_WORDS.has(m[5]) ? `<span class="hw">${m[5]}</span>` : m[5];
  }
  return out + esc(code.slice(at));
}
// a change to a file: added lines green, taken out red, like the terminal
function diffHtml(text) {
  if (!/^@@ /m.test(text || "")) return esc(text);
  return String(text).split("\n").map((l) => {
    const cls = /^(\+\+\+|---) /.test(l) ? "" : l[0] === "+" ? "da" : l[0] === "-" ? "dd" : l.startsWith("@@") ? "dh" : "";
    return cls ? `<span class="${cls}">${esc(l)}</span>` : esc(l);
  }).join("\n");
}
function md(text) {
  const out = [];
  // a fence may be indented, under a list item; its indent comes off each line
  const parts = String(text).split(/^([ \t]*)```(\S*)[^\n]*\n([\s\S]*?)^[ \t]*```[ \t]*$/m);
  parts.forEach((part, i) => {
    if (i % 4 === 1 || i % 4 === 2) return;
    if (i % 4 === 3) {
      const pad = parts[i - 2], body = part.replace(/\n$/, "").split("\n").map((l) => l.startsWith(pad) ? l.slice(pad.length) : l.trimStart()).join("\n");
      out.push(`<div class="code"><pre><code>${hl(body, parts[i - 1])}</code></pre><button type="button" class="cp" title="copy the block">Copy</button></div>`); return;
    }
    let list = null, para = [];
    const endPara = () => { if (para.length) out.push(`<p>${para.join("<br>")}</p>`); para = []; };
    const endList = () => { if (list) out.push(`</${list}>`); list = null; };
    const lines = part.split("\n");
    for (let n = 0; n < lines.length; n++) {
      const line = lines[n];
      let m;
      if (!line.trim()) { endPara(); endList(); }
      else if (line.trim().startsWith("|")) {              // a table: keep its columns
        endPara(); endList();
        const rows = [line];
        while (n + 1 < lines.length && lines[n + 1].trim().startsWith("|")) rows.push(lines[++n]);
        const cells = (r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => inline(c.trim()));
        const body = rows.filter((r) => !/^[\s|:-]+$/.test(r)).map(cells);
        const head = rows.length > 1 && /^[\s|:-]+$/.test(rows[1]) ? body.shift() : null;
        out.push(`<div class="tbl"><table>${head ? `<tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr>` : ""}` +
          body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("") + "</table></div>");
      }
      else if ((m = line.match(/^(#{1,6})\s+(.*)/))) { endPara(); endList(); out.push(`<h3 class="h${m[1].length}">${inline(m[2])}</h3>`); }
      else if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
        endPara();
        const kind = /\d/.test(m[1]) ? "ol" : "ul";
        // a numbered list cut by bullets goes on from its own number, not from 1
        if (list !== kind) { endList(); out.push(kind === "ol" ? `<ol start="${parseInt(m[1], 10)}">` : "<ul>"); list = kind; }
        out.push(`<li>${inline(m[2])}</li>`);
      }
      else if ((m = line.match(/^>\s?(.*)/))) { endPara(); endList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
      else { endList(); para.push(inline(line)); }
    }
    endPara(); endList();
  });
  return out.join("");
}

// the live part sits at the end of the list; new things go before it

      (me.bg || []).map((x) => `<br><span class="bgt">${esc(x)}</span>`).join("") + '</div>';

// a message of the user, Claude or a member can be replied to: it carries its seq, who and a short quote
const REPLYABLE = new Set(["user", "text", "say"]);
function clock(ts) {                     // 14:05 today; "11/01 14:05" on another day
  const d = new Date(ts * 1000), t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  return d.toDateString() === new Date().toDateString() ? t : `${d.getMonth() + 1}/${d.getDate()} ${t}`;
}
function draw(me, ev) {
  if (ev.t === "relay" && joinRelay(me, ev)) return null;
  const el = drawOne(me, ev);
  // the message a relay that follows belongs to; null when something else came between
  if (el) me.lastB = ev.t === "say" || ev.t === "text" ? { el, from: ev.t === "say" ? ev.name : "", to: [] } : null;
  if (el && ev.ts && el.classList.contains("b")) el.insertAdjacentHTML("beforeend", `<div class="ts">${clock(ev.ts)}</div>`);
  if (el && REPLYABLE.has(ev.t) && ev.text) {
    el.dataset.seq = ev.seq;
    el.dataset.who = ev.t === "user" ? (fromTab(ev.text) || ["You"])[0] : ev.name || aiName(me.meta);
    el.dataset.snip = ev.text.replace(/\s+/g, " ").trim().slice(0, 140);
    el.insertAdjacentHTML("beforeend", '<button type="button" class="rp">↩ Reply</button>');
  }

}
// "a → b" shows on the message that was passed on, not on a line of its own

  const m = me.lastB;
  if (!m || (m.from && m.from !== ev.from)) return false;
  if (!m.to.includes(ev.to)) m.to.push(ev.to);
  let who = m.el.querySelector(":scope > .who");
  if (!who) { who = document.createElement("div"); who.className = "who"; m.el.prepend(who); }
  const name = (n) => `<span style="color:${colorOf(n)}">${esc(n)}</span>`;

}
// "[from @name]: text" is what another AI tab sends: [name, text], or null

function drawOne(me, ev) {

      }

    case "text":

    case "say":

    case "tool": {

// whether an option was picked in a question's answers (string or multi-select array)
function optPicked(q, answers, label) {

}

// an AskUserQuestion option's preview, with its description above it
function pvBox(o) {

// under a question whose options have previews: the picked one's (open: the first, as in the tab)
function pvOf(q, open, answers) {
  const os = q.options || [], o = open ? os[0] : os.find((x) => x.label === (answers || {})[q.question]);
  return os.some((x) => x.preview) && o ? pvBox(o) : "";

// permission cards: buttons only while the question is open on the server
function paintAsks(me) {
  document.querySelectorAll("#msgs .ask").forEach((card) => {
    const rid = card.dataset.rid, ev = me.asks.get(rid);

    if (card.dataset.sig === sig) return;

    card.className = "ask" + (open ? "" : " closed");

    } else {
      body = (ev.plan ? `<div class="what">${md(ev.plan)}</div>` : `<div class="what">${esc(ev.summary || "")}</div>`) +
        (ev.detail && !ev.plan ? `<details><summary>details</summary><pre>${esc(ev.detail)}</pre></details>` : "");
      if (open) body += `<div class="row"><button class="primary" data-act="allow">${ev.plan ? "Approve" : "Allow"}</button>` +

$("msgs").addEventListener("click", async (e) => {

  if (quote) { jumpTo(+quote.dataset.go); return; }
  const unq = e.target.closest(".unq");
  if (unq) {
    unq.disabled = true; unq.textContent = "Taking back…";
    try {
      const out = await api(`${base(cur.kind)}/${cur.id}/unqueue`, { key: unq.dataset.key });
      const t = $("text");                     // back in the box, to change or delete
      if (!t.value.trim()) { t.value = out.text; t.dispatchEvent(new Event("input")); }
      const i = (cur.queued || []).findIndex((q) => q.key === unq.dataset.key);
      if (i >= 0) cur.queued.splice(i, 1);    // a repaint before the next look keeps it gone
      unq.closest(".b").remove();

  }

  }

    document.querySelectorAll("#msgs .b.sel").forEach((x) => { if (x !== bubble) x.classList.remove("sel"); });
    bubble.classList.toggle("sel");

    if (opt.parentElement.dataset.multi) opt.classList.toggle("on");

    const card = opt.closest(".ask"), pv = opt.parentElement.nextElementSibling;

    return;
  }
  const b = e.target.closest(".ask button[data-act]");
  if (!b || !cur) return;
  const card = b.closest(".ask"), rid = card.dataset.rid, act = b.dataset.act;
  const body = { rid, chat: card.dataset.chat, allow: act !== "deny", always: act === "always" };
  if (act === "answerq") {
    const ev = cur.asks.get(rid), answers = {};
    card.querySelectorAll(".opts").forEach((o) => {

        ? [...o.querySelectorAll(".on")].map((x) => x.dataset.l)

  }
  b.disabled = true;

});

// replying: the bar over the box says what to, and send() passes its seq
let replyTo = null;

// back to the message a reply points at; older ones are loaded until it shows
// a code block's Copy: the clipboard API, or the old way where a page may not use it
async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;opacity:0";
    document.body.append(t); t.select();
    try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
    t.remove();
  }

  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.textContent = "Copy"; }, 1500);
}
async function jumpTo(seq) {
  const find = () => document.querySelector(`#msgs [data-seq="${seq}"]`);
  for (let tries = 0; !find() && $("older") && tries < 40; tries++) await loadOlder();
  const el = find();
  if (!el) { status("That message is too old to show.", true); return; }
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
}

async function loadOlder() {
  const me = cur; if (!me) return;
  try {
    const { events } = await api(`${base(me.kind)}/${me.id}/history?before=${me.firstSeq}`);
    if (!events.length) { $("older")?.remove(); return; }
    const box = $("msgs"), h = box.scrollHeight, anchor = $("older");
    const holder = document.createElement("div"); holder.style.display = "contents";
    const last = me.lastB;           // older messages: a relay still to come joins the newest one
    for (const ev of events) { const el = draw(me, ev); if (el) holder.append(el); }
    me.lastB = last;
    anchor.after(holder);
    me.firstSeq = events[0].seq;
    box.scrollTop += box.scrollHeight - h;
    paintAsks(me);
    if (events[0].seq <= 1) anchor.remove();
  } catch (e) { status(e.message, true); }
}

// scrolled up, with your own message above the view: it shows top right, so the
// replies at the top say what they answer. Gone when that message is in view.
let pinFrame = 0;
function paintPin() {
  pinFrame = 0;
  const me = cur, box = $("msgs"), pin = $("pin"), r = box.getBoundingClientRect();
  const mine = [...box.querySelectorAll(".b.me[data-seq]")];
  let at = null, above = false;
  for (let i = mine.length - 1; i >= 0; i--) {
    const b = mine[i].getBoundingClientRect();
    if (b.top < r.top) { above = true; at = b.bottom <= r.top + 4 ? { seq: mine[i].dataset.seq, snip: mine[i].dataset.snip } : null; break; }
  }

  if (!above && me && $("older")) {

  pin.dataset.go = at.seq;

  pin.style.top = r.top + 8 + "px";

// your last message before the loaded part, read from up to 10 pages of the
// history without drawing them; tapping the pin loads them, as a quote does
async function findOlderMine(me) {
  const upTo = me.firstSeq;
  me.pinOld = { upTo, seq: 0 };
  let before = upTo, hit = null;
  try {
    for (let page = 0; page < 10 && before > 1 && !hit; page++) {
      const { events } = await api(`${base(me.kind)}/${me.id}/history?before=${before}`);
      if (!events.length) break;
      hit = events.findLast((ev) => ev.t === "user" && ev.text && !fromTab(ev.text));
      before = events[0].seq;
    }
  } catch (e) { /* no pin: the page goes on */ }
  if (me.pinOld.upTo !== upTo) return;          // older ones were loaded meanwhile
  if (hit) me.pinOld = { upTo, seq: hit.seq, snip: hit.text.replace(/\s+/g, " ").trim().slice(0, 140) };
  if (cur === me) paintPin();

const PHOTO_MAX_SIDE = 1600;
const PHOTO_MIN_SHRINK = 600 * 1024;
async function shrinkPhoto(file, name) {
  const raster = /^image\/(jpeg|webp|heic|heif)$/i.test(file?.type || "") ||
    /\.(jpe?g|webp|heic|heif)$/i.test(name || "");
  if (!raster || !file || file.size <= PHOTO_MIN_SHRINK) return { blob: file, name };
  let src = null, url = null;
  try {
    let w = 0, h = 0;
    if (typeof createImageBitmap === "function") {
      src = await createImageBitmap(file);
      w = src.width; h = src.height;
    } else {
      url = URL.createObjectURL(file);
      src = await new Promise((ok, bad) => {
        const img = new Image();
        img.onload = () => ok(img); img.onerror = bad; img.src = url;
      });
      w = src.naturalWidth; h = src.naturalHeight;
    }
    const scale = Math.min(1, PHOTO_MAX_SIDE / Math.max(w, h, 1));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * scale));
    c.height = Math.max(1, Math.round(h * scale));
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.84));
    if (!blob || !blob.size || blob.size >= file.size) return { blob: file, name };
    const stem = (name || "photo").replace(/\.[^.]+$/, "") || "photo";
    return { blob, name: `${stem}.jpg` };
  } catch (_e) {
    return { blob: file, name };
  } finally {
    if (src && typeof src.close === "function") src.close();
    if (url) URL.revokeObjectURL(url);
  }
}

async function postUpload(name, blob, onRetry) {
  // buffer up to 10 MB once so iOS Safari does not lose the File handle across retries
  const payload = blob && blob.size <= 10 * 1024 * 1024 && typeof blob.arrayBuffer === "function"
    ? await blob.arrayBuffer() : blob;
  const url = `api/upload?name=${encodeURIComponent(name)}`;
  let last;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const res = await fetch(url, { method: "POST", body: payload,
        headers: { "Content-Type": "application/octet-stream", "X-Tabit": "1" } });
      const body = await res.json().catch(() => ({}));
      if (res.ok) return body;
      const msg = body.error || `HTTP ${res.status}`;
      const retryable = res.status >= 502 || (res.status === 400 && msg === "upload cut short");
      const err = new Error(msg);
      if (!retryable || attempt === 3) { err.fatal = true; throw err; }
      last = err;
    } catch (e) {
      if ((e && e.fatal) || attempt === 3) throw e;
      last = e;
    }
    if (onRetry) onRetry(attempt);
    await new Promise((r) => setTimeout(r, 1200 * attempt));
  }
  throw last;
}

  status(`uploading ${rawName}…`);

    status(`uploading ${name} (${Math.max(1, Math.round(blob.size / 1024))} KB)…`);
    const body = await postUpload(name, blob, (n) =>

async function browse(start, done) {
  const top = $("sheet2"), box = $("sheet2in");
  const close = () => { top.classList.remove("on"); box.innerHTML = ""; };
  top.classList.add("on");
  async function show(path) {
    try {
      const d = await api("api/dirs?path=" + encodeURIComponent(path || "~"));
      box.innerHTML = `<h2>Pick a folder</h2><div class="hint">${esc(d.show)}</div>
        <div class="chips"><button type="button" id="d-new">＋ New folder</button></div>
        <div class="chips" id="d-form" hidden><input id="d-name" placeholder="Folder name" maxlength="200" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1"><button type="button" class="primary" id="d-make">Create</button></div>
        <div class="hint" id="d-err" style="color:var(--red)"></div>
        <div class="dirs">${d.parent ? '<div data-p="' + esc(d.parent) + '">‹ ..</div>' : ""}${d.dirs.map((x) => `<div data-p="${esc(x.path)}">📁 ${esc(x.name)}</div>`).join("")}${d.more ? '<div class="hint">more folders than shown</div>' : ""}</div>
        <div class="acts"><button type="button" id="d-cancel">Back</button><button type="button" class="primary" id="d-use">Use this folder</button></div>`;
      box.querySelectorAll(".dirs [data-p]").forEach((el) => { el.onclick = () => show(el.dataset.p); });
      $("d-use").onclick = () => { close(); done(d.path); };
      $("d-new").onclick = () => { $("d-form").hidden = false; $("d-new").hidden = true; $("d-name").focus(); };
      $("d-make").onclick = async () => {
        try { const out = await api("api/dirs/new", { parent: d.path, name: $("d-name").value }); show(out.path); }
        catch (e) { $("d-err").textContent = e.message; }
      };
    } catch (e) {
      box.innerHTML = `<h2>Pick a folder</h2><div class="hint warn">${esc(e.message)}</div><div class="acts"><button id="d-cancel" type="button">Back</button></div>`;
    }
    $("d-cancel").onclick = close;
  }
  show(start);
}

async function newGroup() {
  if (!cfg) await loadList();
  const chats = cfg?.chats || [];
  if (chats.length < 2) { sheet(`<h2>New group</h2><div class="hint">A group needs two chats or more. Start the chats first.</div><div class="acts"><button type="button" id="g-cancel">OK</button></div>`); $("g-cancel").onclick = closeSheet; return; }
  sheet(`<h2>New group</h2>
    <div class="hint">You talk to everyone at once, or to one with @name. A chat can pass a message on by starting a line with @name. After ${8} passes it stops and waits for you.</div>
    <label>Name</label><input id="g-title" maxlength="80" placeholder="Team">
    <label>Chats in it</label>
    ${chats.map((c) => `<label class="pick"><input type="checkbox" value="${esc(c.id)}"><span>${esc(c.title)} <span class="badge">${esc(tilde(c.cwd))}</span></span></label>`).join("")}
    <div class="hint" id="g-err" style="color:var(--red)"></div>
    <div class="acts"><button type="button" id="g-cancel">Cancel</button><button type="button" class="primary" id="g-go">Create</button></div>`);
  $("g-cancel").onclick = closeSheet;
  $("g-go").onclick = async () => {
    const members = [...$("sheetin").querySelectorAll("input[type=checkbox]:checked")].map((x) => x.value);
    try {
      const { group } = await api("api/chat-groups", { title: $("g-title").value, members });
      closeSheet(); kind = "groups"; location.hash = "#g/" + group.id;
    } catch (e) { $("g-err").textContent = e.message; }
  };
}

// the profile: who this is, what it made (the library), and the way to settings
const ago = (t) => { const d = Math.floor((Date.now() / 1000 - t) / 86400); return d < 1 ? "Today" : d < 7 ? "This week" : "Older"; };
async function profile() {
  if (!cur || !cur.meta) return;
  const m = cur.meta;
  const hv = avOf(m), av = `<div class="av big ${hv.cls}" style="${hv.style}">${hv.html}</div>`;
  if (cur.kind === "groups") {
    sheet(`<div class="prof">${av}<h2>${esc(m.title)}</h2><div class="hint">${m.members.length} chats in this room</div></div>
      <div class="plist">${m.members.map((x) => `<div class="prow" data-go="${esc(x.id)}"><span class="dot ${esc(x.state)}"></span><b style="color:${colorOf(x.alias)}">@${esc(x.alias)}</b><span class="hint">${esc(x.title)}</span></div>`).join("")}</div>
      <div class="acts"><button type="button" id="p-set">Settings</button><button type="button" class="primary" id="p-close">Close</button></div>`);
    document.querySelectorAll(".prow").forEach((r) => { r.onclick = () => { closeSheet(); kind = "chats"; location.hash = "#c/" + r.dataset.go; }; });
  } else {
    sheet(`<div class="prof">${av}<h2>${esc(m.title)}</h2><div class="hint">${esc(tilde(m.cwd))}</div>
      <div class="meta">${m.tab ? groupBadge(m.tab) : `<span class="badge m-${esc(m.mode)}">${esc(MODE_NAME[m.mode] || m.mode)}</span><span class="badge">${esc(m.model || "default model")}</span>`}</div></div>
      <div id="p-lib" class="hint">Loading…</div>
      <div class="acts"><button type="button" id="p-set">Settings</button><button type="button" class="primary" id="p-close">Close</button></div>`);
    try {
      const lib = await (await fetch(`api/chats/${cur.id}/library`)).json();
      const groups = {};
      for (const f of lib.files || []) (groups[ago(f.ts)] ||= []).push(f);
      const rows = ["Today", "This week", "Older"].filter((k) => groups[k]).map((k) => `<div class="lh">${k}</div>` +
        groups[k].map((f) => `<a class="file" target="_blank" rel="noopener" href="api/file?path=${encodeURIComponent(f.path)}&amp;render=1"><span>${f.action === "Write" ? "📝" : "✏️"}</span><div><b>${esc(f.name)}</b><div class="hint">${esc(tilde(f.path))}</div></div></a>`).join("")).join("");
      const el = $("p-lib");
      if (el) el.outerHTML = `<div class="stats"><div><b>${lib.turns}</b>replies</div><div><b>${(lib.files || []).length}</b>files</div></div>
        <div class="lib"><h3>Library</h3>${rows || '<div class="hint">Nothing made yet. Files Claude writes show up here.</div>'}</div>`;
    } catch (_e) { const el = $("p-lib"); if (el) el.textContent = "Could not load the library."; }
  }
  $("p-close").onclick = closeSheet;
  $("p-set").onclick = () => { closeSheet(); settings(); };
}
$("hav").onclick = $("ttl").onclick = profile;

// t is the open conversation, or a row of the list ({kind, id}); its meta is fetched when missing
const settings = async (t = cur) => {
  if (!t) return;
  if (!t.meta) {
    try { t = { kind: t.kind, id: t.id, planner: t.planner, meta: (await api(`${base(t.kind)}/${t.id}`)).meta }; } catch (e) { return; }
  }
  const m = t.meta;
  if (!cfg) { try { cfg = await api("api/chats"); } catch (e) { return; } }   // a chat opened straight from a link
  const done = () => { closeSheet(); if (!cur || cur.id !== t.id) loadList(); };
  const gone = () => { closeSheet(); if (cur && cur.id === t.id) location.hash = ""; else loadList(); };
  if (t.kind === "groups") {
    sheet(`<h2>Group</h2><label>Name</label><input id="e-title" value="${esc(m.title)}" maxlength="80">
      <label>Members</label><div id="e-members"></div>
      <div class="hint" id="e-err" style="color:var(--red)"></div>
      <div class="acts"><button type="button" class="danger" id="e-del">Delete group</button><button type="button" id="e-cancel">Cancel</button><button type="button" class="primary" id="e-save">Save</button></div>
      <div class="hint">Deleting a group keeps its chats.</div>`);
    const members = (g) => {
      const inside = new Set(g.members.map((x) => x.id));
      const others = (cfg.chats || []).filter((c) => !inside.has(c.id));
      $("e-members").innerHTML = g.members.map((x) => `<div class="prow"><b style="color:${colorOf(x.alias)}">@${esc(x.alias)}</b><span class="hint" style="flex:1">${esc(x.title)}</span><button type="button" data-rm="${esc(x.id)}" title="take out">✕</button></div>`).join("") +
        (others.length ? `<div class="hint">Add a chat</div><div class="chips">${others.map((c) => `<button type="button" data-add="${esc(c.id)}">＋ ${esc(c.title)}</button>`).join("")}</div>` : "");
    };
    const change = async (body) => {
      try { const out = await api(`api/chat-groups/${t.id}/members`, body); t.meta = out.group; members(out.group); $("e-err").textContent = ""; }
      catch (e) { $("e-err").textContent = e.message; }
    };
    cfg = await api("api/chats");                       // the chats a group can take in
    members(m);
    $("e-members").onclick = (e) => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.rm) change({ remove: [b.dataset.rm] });
      if (b.dataset.add) change({ add: [b.dataset.add] });
    };
    $("e-save").onclick = async () => { try { await api(`api/chat-groups/${t.id}/edit`, { title: $("e-title").value }); done(); } catch (e) { $("e-err").textContent = e.message; } };
    $("e-del").onclick = async () => { if (!confirm("Delete this group? Its chats stay.")) return; await api(`api/chat-groups/${t.id}/delete`, {}); gone(); };
  } else {
    const codex = m.tab && m.tab.cli === "codex";     // Codex's own logins and models
    const grok = m.tab && m.tab.cli === "grok";       // Grok's are set in its tab
    const agy = m.tab && m.tab.cli === "agy";         // Antigravity: its login is set in its tab, its models are its own
    const accts = (codex ? cfg.codex_accounts : cfg.accounts) || [];
    const cmodels = ((codex ? cfg.codex_models : agy ? cfg.agy_models : null) || []).slice();
    // agy names a model and its effort as one id (gemini-4-neon-high), and takes them as two
    const [agyModel, agyEffort] = agy ? (/^(.+)-(low|medium|high|xhigh|max)$/.exec(m.tab.model || "") || [0, m.tab.model || "", ""]).slice(1) : ["", ""];
    const modelNow = codex ? m.tab.model || "" : agyModel;
    if ((codex || agy) && modelNow && !cmodels.some((x) => x.name === modelNow)) cmodels.push({ name: modelNow, label: modelNow, efforts: ["", ...(agyEffort ? [agyEffort] : [])] });
    sheet(`<h2>${t.planner ? "Planner" : "Chat"}</h2><div id="e-look"></div><div class="hint">${m.tab ? "Its tab in tabit: the name is the tab’s name" : esc(tilde(m.cwd))}</div>
      <label>Name</label><input id="e-title" value="${esc(m.title)}" maxlength="80">
      <div ${grok ? "hidden" : ""}><div ${agy ? "hidden" : ""}><label>Account</label><select id="e-account">${accts.map((a) => `<option value="${esc(a.name)}"${a.name === (m.account || "") ? " selected" : ""}>${esc(a.label)}</option>`).join("")}</select></div>
      <div ${m.tab ? "hidden" : ""}><label>When Claude wants to do something</label><select id="e-mode">${opts(cfg.modes, m.mode, (x) => MODE_NAME[x])}</select>
      <div class="hint warn" id="e-warn" ${m.mode === "bypass" ? "" : "hidden"}>Bypass: no questions asked.</div></div>
      <label>Model</label><select id="e-model">${codex || agy
        ? cmodels.map((x) => `<option value="${esc(x.name)}"${x.name === modelNow ? " selected" : ""}>${esc(x.label)}</option>`).join("")
        : opts(cfg.models, m.tab ? aliasOf(m.tab.model) : m.model, (x) => x || "default")}</select>
      <label>Thinking effort</label><select id="e-effort"></select></div>
      <div class="hint" ${m.tab && m.tab.model ? "" : "hidden"}>${m.tab ? "Answering as " + esc(m.tab.model) + (grok ? ". Its login and model are set in its tab." : (agy ? ". Its login is set in its tab." : "") + " A new model starts with the next message, and only when the tab is not busy.") : ""}</div>
      <div ${m.tab ? "hidden" : ""}><label>Connectors</label><button type="button" id="e-reload">↻ Reload Claude</button>
      <div class="hint" id="e-reloaded">Changed a connector (Gmail, Strava…)? Tap this. The chat keeps its history.</div></div>
      ${t.planner ? `<label>Your name on comments</label><input id="pp-name" maxlength="40" value="${esc(plan.name)}">
      <label>Done shows the last … days</label><input id="pp-days" type="number" min="1" max="365" inputmode="numeric" value="${plan.done_days}">` : ""}
      <div class="hint" id="e-err" style="color:var(--red)"></div>
      <div class="acts">${m.default || t.planner ? "" : '<button type="button" class="danger" id="e-del">Delete</button>'}<button type="button" id="e-cancel">Cancel</button><button type="button" class="primary" id="e-save">Save</button></div>`);
    $("e-reload").onclick = async () => {
      try { await api(`api/chats/${t.id}/reload`, {}); $("e-err").textContent = ""; $("e-reloaded").textContent = "Done. Your next message starts a fresh Claude."; }
      catch (e) { $("e-err").textContent = e.message; }
    };
    const look = picker($("e-look"), m);
    $("e-mode").onchange = () => { $("e-warn").hidden = $("e-mode").value !== "bypass"; };
    // the efforts the model picked takes: Codex and Antigravity say so per model, Claude takes them all
    const effortNow = (m.tab ? m.tab.effort || agyEffort : m.effort) || "";
    const effortsFill = (first) => {
      const list = codex || agy ? ((cmodels.find((x) => x.name === $("e-model").value) || {}).efforts || [""]) : (cfg.efforts || [""]);
      let want = first ? effortNow : $("e-effort").value;
      if (!first && !list.includes(want)) want = "";      // another model: one it takes
      $("e-effort").innerHTML = opts(list.includes(want) ? list : [...list, want], want, (x) => x || "default");
    };
    effortsFill(true);
    $("e-model").onchange = () => effortsFill(false);
    const asked = () => grok ? { title: $("e-title").value, ...look.get() }
      : agy ? { title: $("e-title").value, model: $("e-model").value, effort: $("e-effort").value, ...look.get() }
      : { title: $("e-title").value, mode: $("e-mode").value, model: $("e-model").value, effort: $("e-effort").value, ...($("e-account").value !== (m.account || "") ? { account: $("e-account").value } : {}), ...look.get() };
    $("e-save").onclick = async () => {
      try {
        await api(`api/chats/${t.id}/edit`, asked());
        if (t.planner) planTook(await api("api/planner/settings", { done_days: +$("pp-days").value, name: $("pp-name").value }));
        done();
      } catch (e) { $("e-err").textContent = e.message; }
    };
    if ($("e-del")) $("e-del").onclick = async () => { if (!confirm(m.tab ? "Delete this chat? Its tab in tabit closes too." : "Delete this chat and its history?")) return; try { await api(`api/chats/${t.id}/delete`, {}); gone(); } catch (e) { $("e-err").textContent = e.message; } };
  }
  $("e-cancel").onclick = closeSheet;
};
$("more").onclick = () => settings();

// --- Nearby: send text and files to a tabit on this LAN, like AirDrop -------
// Receiving is off until picked here, and goes off by itself. What comes is
// someone else's: shown as plain text (no links made of it), files only saved.
const nbClock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const sizeOf = (n) => (n < 1024 ? n + " B" : n < 1 << 20 ? Math.round(n / 1024) + " KB" : (n / (1 << 20)).toFixed(1) + " MB");
const NB_TIMES = { "10m": "10 minutes", "1h": "1 hour", "8h": "8 hours" };
let nbTimer = null;
const nbAsked = new Set();         // offers already put in front of you
function nearbyWatch(on) {         // look for offers while receiving is on
  if (on && !nbTimer) nbTimer = setInterval(nearbyCheck, 3000);
  if (!on && nbTimer) { clearInterval(nbTimer); nbTimer = null; }
}
async function nearbyCheck() {
  let st;
  try { st = await api("api/chats/nearby"); } catch (e) { return; }
  nearbyWatch(st.on);
  const o = (st.offers || []).find((x) => !nbAsked.has(x.id));
  if (o && !$("sheet2").classList.contains("on")) nearbyOffer(o);
}
async function nearbyOffer(o) {
  nbAsked.add(o.id);
  if (!cfg) cfg = await api("api/chats").catch(() => null);    // the chats to pick from
  const box = $("sheet2in");
  box.innerHTML = `<h2>📡 ${esc(o.from)}</h2><div class="hint">${esc(o.address)} wants to send you:</div>
    ${o.text ? `<div class="nb-text">${esc(o.text)}</div>` : ""}
    ${o.files.length ? `<div class="hint">${o.files.map((f) => `📎 ${esc(f.name)} (${sizeOf(f.size)})`).join("<br>")}</div>` : ""}
    <label>Put it in</label>
    <select id="nb-into"><option value="">Just keep it (Received in 📡)</option>${(cfg?.chats || []).filter((c) => !c.default).map((c) => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join("")}</select>
    <div class="hint">A chat gets the text and the files' paths, typed to its AI as if you sent them.</div>
    <div class="hint" id="nb-oerr" style="color:var(--red)"></div>
    <div class="acts"><button type="button" id="nb-no">Decline</button><button type="button" class="primary" id="nb-yes">Accept</button></div>`;
  $("sheet2").classList.add("on");
  const close = () => { $("sheet2").classList.remove("on"); box.innerHTML = ""; };
  const done = async (accept) => {
    $("nb-no").disabled = $("nb-yes").disabled = true;         // one answer, not two
    const into = accept ? $("nb-into").value : "";
    try {
      const out = await api("api/chats/nearby/answer", { id: o.id, accept, chat: into });
      if (into && !out.sent) { close(); nearbySay("Saved, but not sent to the chat: " + (out.error || "it failed")); return; }
      if (into) { close(); location.hash = "#c/" + into; return; }
    } catch (e) {
      if (e.status === 404) { close(); nearbySay("That offer is gone: it waited too long."); return; }
      $("nb-oerr").textContent = e.message; $("nb-no").disabled = $("nb-yes").disabled = false; return;
    }
    close();
    if (accept) nearbySheet();
  };
  $("nb-no").onclick = () => done(false);
  $("nb-yes").onclick = () => done(true);
}
// a word about an offer, in the Nearby sheet: the list view has no status line
async function nearbySay(text) {
  await nearbySheet();
  if ($("nb-msg")) $("nb-msg").textContent = text;
}
async function sendFile(file) {    // upload one file; gives its path on this computer
  const body = await postUpload(file.name || "file", file);
  return body.path;
}
async function nearbySheet() {
  let st;
  try { st = await api("api/chats/nearby"); } catch (e) { sheet(`<h2>Nearby</h2><div class="hint warn">${esc(e.message)}</div><div class="acts"><button type="button" id="nb-close">Close</button></div>`); $("nb-close").onclick = closeSheet; return; }
  nearbyWatch(st.on);
  sheet(`<h2>📡 Nearby</h2>
    <div class="hint">Send text and files to a tabit on this LAN, and get them from one. You are <b>${esc(st.name)}</b>.</div>
    <label>Receiving</label>
    <div><span class="nb-st${st.on ? " on" : ""}">${st.on ? "On until " + nbClock(st.until) : "Off"}</span></div>
    <div class="chips">${st.times.map((k) => `<button type="button" data-nbon="${k}">${st.on ? "" : "On for "}${NB_TIMES[k] || k}</button>`).join("")}${st.on ? '<button type="button" id="nb-off">Turn off</button>' : ""}</div>
    <div class="hint">${{
      opened: `tabit opened TCP port ${st.port} in the firewall while receiving, and closes it after.`,
      already: `TCP port ${st.port} is open in the firewall.`,
      manual: `The firewall is on, and tabit may not change it (sudo asks for a password). Run this once: <code>sudo ufw allow ${st.port}/tcp</code>`,
      none: `Others reach you on TCP port ${st.port}.`,
    }[st.firewall] || `While receiving, others reach you on TCP port ${st.port}; tabit opens it in the firewall if needed.`} Each thing sent asks you first.</div>
    <label>Send to</label>
    <div class="chips"><select id="nb-to" style="flex:1"><option value="">Looking…</option></select><button type="button" id="nb-look">↻</button></div>
    <textarea id="nb-text" rows="3" placeholder="Text (optional)"></textarea>
    <input type="file" id="nb-files" multiple>
    <div class="hint" id="nb-msg"></div>
    <div class="acts"><button type="button" id="nb-close">Close</button><button type="button" class="primary" id="nb-send">Send</button></div>
    ${st.got.length ? `<label>Received</label>${st.got.map((g) => `<div class="nb-got"><div class="who">${esc(g.from)} · ${timeAgo(g.ts)}</div>${g.text ? `<div class="nb-text">${esc(g.text)}</div>` : ""}<div class="nb-files">${g.files.map((f) => `<a target="_blank" rel="noopener" href="api/file?path=${encodeURIComponent(f)}&amp;render=1">📎 ${esc(f.split("/").pop())}</a>`).join("")}</div></div>`).join("")}` : ""}`);
  let peers = [];
  const look = async () => {
    const to = $("nb-to");          // the sheet may close before avahi answers
    to.innerHTML = '<option value="">Looking…</option>';
    try { peers = (await api("api/chats/nearby/peers")).peers; } catch (e) { peers = []; }
    to.innerHTML = peers.length ? peers.map((x, i) => `<option value="${i}">${esc(x.name)} · ${esc(x.address)}</option>`).join("")
      : '<option value="">No tabit nearby is receiving</option>';
  };
  look();
  $("nb-look").onclick = look;
  $("nb-close").onclick = closeSheet;
  $("sheetin").querySelectorAll("[data-nbon]").forEach((b) => { b.onclick = async () => {
    try { await api("api/chats/nearby/on", { for: b.dataset.nbon }); nearbySheet(); } catch (e) { $("nb-msg").textContent = e.message; }
  }; });
  if ($("nb-off")) $("nb-off").onclick = async () => { await api("api/chats/nearby/off", {}).catch(() => {}); nearbySheet(); };
  $("nb-send").onclick = async () => {
    // kept, not looked up again: the sheet may be closed when the answer comes
    const to = peers[$("nb-to").value], msg = $("nb-msg"), btn = $("nb-send"), box = $("nb-text"), pick = $("nb-files");
    const text = box.value, files = [...pick.files];
    if (!to) { msg.textContent = "Pick a tabit to send to."; return; }
    if (!text.trim() && !files.length) { msg.textContent = "Write something or pick a file."; return; }
    btn.disabled = true;
    try {
      msg.textContent = files.length ? "Uploading…" : "";
      const paths = [];
      for (const f of files) paths.push(await sendFile(f));
      msg.textContent = `Waiting for ${to.name} to answer…`;
      const out = await api("api/chats/nearby/send", { to, text, files: paths });
      msg.textContent = { accepted: "✓ Accepted", declined: "Declined", expired: "No answer", off: "They turned receiving off",
        failed: "They accepted, but could not save it" }[out.answer] || out.answer;
      if (out.answer === "accepted") { box.value = ""; pick.value = ""; }
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false;
  };
}
$("nearby").onclick = $("sb-nearby").onclick = nearbySheet;
nearbyCheck();

<script>
/* a wide screen: drag the line between the list and the chat; the width is kept */
(() => {
  const grip = document.getElementById("grip"), root = document.documentElement, KEY = "chatListW", MIN = 240;
  const set = (w) => root.style.setProperty("--listw", Math.round(Math.min(Math.max(w, MIN), Math.max(MIN, innerWidth - 360))) + "px");
  const saved = +localStorage.getItem(KEY); if (saved) set(saved);
  grip.onpointerdown = (e) => {
    grip.setPointerCapture(e.pointerId); grip.classList.add("on");
    grip.onpointermove = (m) => set(m.clientX);
    grip.onpointerup = () => { grip.classList.remove("on"); grip.onpointermove = grip.onpointerup = null;
      localStorage.setItem(KEY, parseInt(root.style.getPropertyValue("--listw")) || ""); };
  };
  grip.ondblclick = () => { root.style.removeProperty("--listw"); localStorage.removeItem(KEY); };
  addEventListener("resize", () => { const w = parseInt(root.style.getPropertyValue("--listw")); if (w) set(w); });
})();
</script>
</body>
</html>
