<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="chat">
<meta name="theme-color" content="#0f111a">
<base href="/">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="chat.webmanifest">
<title>tabit chat</title>
<!--
  Tabit Chat, served by tabit itself (Settings > Remote) through Tailscale
  Serve. Each chat is one headless Claude on this computer: /api/chats.
  Chats can be joined in a group: /api/chat-groups. Same origin, no cloud.
-->
<style>
  :root {
    --bg: #0f111a; --panel: #1a1d2b; --line: #262a3d; --fg: #e3e7fb; --dim: #8088aa; --glass: #0f111acc;
    --red: #f7768e; --orange: #ff9e64; --yellow: #e0af68; --green: #9ece6a;
    --teal: #73daca; --cyan: #7dcfff; --blue: #7aa2f7; --purple: #bb9af7; --pink: #ff79c6;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }
  body { color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
         display: flex; flex-direction: column; overflow: hidden; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
           padding: 8px 14px; cursor: pointer; transition: transform .12s, filter .12s; }
  button:active { filter: brightness(1.25); transform: scale(.96); }
  button.primary { background: linear-gradient(135deg, #7aa2f7, #9d7cf7); color: #0b0d17; border: 0; font-weight: 600; }
  button.danger { background: var(--red); color: #111; border: 0; font-weight: 600; }
  button:disabled { opacity: .45; }
  input, select, textarea { background: var(--panel); border: 1px solid var(--line);
                            border-radius: 12px; padding: 10px 13px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: #7aa2f7aa; box-shadow: 0 0 0 3px #7aa2f722; }
  a { color: var(--cyan); }
  header { display: flex; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
           background: var(--bg);
           position: sticky; top: 0; isolation: isolate; transform: translateZ(0);   /* iOS home-screen apps draw a plain header's title blurry */
           border-bottom: 1px solid var(--line); flex: none; z-index: 2; }
  header h1 { text-rendering: geometricPrecision; -webkit-font-smoothing: subpixel-antialiased; }
  header button { border-radius: 99px; min-width: 38px; height: 38px; padding: 0 12px; }
  header #add { background: #7aa2f7; }                 /* one plain colour: no gradient up here */
  #hav[hidden] { display: none; }                      /* .av sets display, which would show it on the list */
  #ttl { flex: 1; min-width: 0; }
  #ttl h1 { flex: none; }
  #ttl .pill { background: none; padding: 0; font-size: 12.5px; margin-top: -1px; overflow: hidden; text-overflow: ellipsis; }
  .av.sm { width: 40px; height: 40px; font-size: 32px; }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--panel); color: var(--dim); white-space: nowrap; }
  .pill.waiting { color: var(--orange); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.working { background: var(--purple); } .dot.waiting { background: var(--orange); }
  .dot.ready { background: var(--green); } .dot.background { background: var(--purple); }
  .dot.exited { background: transparent; box-shadow: inset 0 0 0 2px var(--dim); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.on { display: flex; }

  /* the list */
  #tabs { display: flex; gap: 4px; margin: 12px 14px 2px; padding: 4px; background: var(--panel); border-radius: 14px; flex: none; }
  #tabs button { flex: 1; border: 0; background: none; color: var(--dim); border-radius: 10px; font-weight: 600; }
  #tabs button.on { background: #2a2f47; color: var(--fg); box-shadow: 0 1px 4px #0006; }
  #cards { flex: 1; overflow-y: auto; padding: 10px 14px calc(20px + env(safe-area-inset-bottom)); }
  /* a phone: the owl and Chats/Groups scroll with the list, getting smaller
     and fainter until they are gone (--fold, 0 to 1, set while scrolling) */
  #scroller { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
  #scroller #cards { flex: none; overflow: visible; }
  #top { display: flex; flex-direction: column; flex: none; transform-origin: 50% 100%;
         opacity: calc(1 - var(--fold, 0)); transform: scale(calc(1 - .45 * var(--fold, 0))); }
  .card { display: flex; gap: 14px; align-items: center; border-radius: 16px; padding: 11px 8px; cursor: pointer; transition: background .12s; }
  .card:active { background: #ffffff0f; }
  .av { position: relative; flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
        font-size: 40px; line-height: 1; }
  .av .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; margin: 0; border: 2px solid var(--bg); background: var(--dim); }
  .av .dot.working { background: var(--purple); } .av .dot.waiting { background: var(--orange); }
  .av .dot.ready { background: var(--green); } .av .dot.background { background: var(--purple); }
  .av .dot.exited { background: var(--bg); box-shadow: inset 0 0 0 2px var(--dim); }
  .card .body { flex: 1; min-width: 0; }
  .card .top { display: flex; align-items: baseline; gap: 6px; }
  .card .t { font-weight: 650; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ago { color: var(--dim); font-size: 12px; flex: none; }
  .card .more { flex: none; width: 30px; height: 30px; margin: -4px -4px -4px 0; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--dim); font-size: 20px; line-height: 1; }
  .card .more:active { background: #ffffff1a; color: #fff; }
  .card .meta { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
  .card .sub { color: var(--dim); font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .sub.last { color: #aab1d6; margin-top: 1px; }
  .card .sub.last.st-work { color: var(--purple); }
  .card .sub.last.st-wait { color: var(--orange); font-weight: 600; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: #ffffff0d; color: var(--dim); }
  .badge .gdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  .badge.m-bypass { color: var(--red); background: #f7768e1f; } .badge.m-ask, .badge.need { color: var(--orange); background: #ff9e641f; }
  .empty { color: var(--dim); text-align: center; padding: 56px 28px; line-height: 1.6; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  /* the conversation */
  #msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px;
          overscroll-behavior: contain; }
  .b { max-width: 88%; padding: 10px 14px; border-radius: 20px; overflow-wrap: anywhere; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .b.me { align-self: flex-end; background: linear-gradient(135deg, #6f97f2, #8f78f0); color: #fff; border-bottom-right-radius: 6px;
          white-space: pre-wrap; box-shadow: 0 2px 10px #6f97f233; }
  .b.ai { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 6px; max-width: 94%; }
  .who { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  #grip { display: none; }
  .b .ts { margin-top: 4px; font-size: 11px; opacity: .55; text-align: right; }
  .b .rp { display: none; margin-top: 6px; padding: 3px 12px; font-size: 12px; border-radius: 12px; border: 0; background: #ffffff22; color: inherit; }
  .b.queued { opacity: .6; border: 1px dashed #ffffff88; }
  .b.queued .qn { margin-top: 6px; font-size: 12px; opacity: .9; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; white-space: normal; }
  .b.queued .unq { padding: 3px 12px; font-size: 12px; border-radius: 12px; border: 0; background: #ffffff33; color: inherit; }
  .b.sel .rp { display: block; } .b:hover .rp { display: block; }
  .quote { border-left: 3px solid #ffffffb0; background: #00000026; border-radius: 8px; padding: 4px 8px; margin-bottom: 6px; font-size: 13px;
           overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; opacity: .92; }
  .quote[data-go] { cursor: pointer; }
  .quote b { margin-right: 4px; }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px #7aa2f7cc; } 100% { box-shadow: 0 0 0 3px transparent; } }
  #scr { margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  #scr[hidden] { display: none; }
  #scr .sh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  #scr .sh b { font-family: ui-monospace, Menlo, monospace; color: var(--cyan); }
  #scr .keys { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
  #scr .sz { display: flex; gap: 4px; }
  #scr button { padding: 3px 9px; font-size: 12px; border-radius: 8px; }
  #scr pre:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  #scr-grip { height: 14px; margin: -6px -10px 2px; cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center; }
  #scr-grip::before { content: ""; width: 44px; height: 4px; border-radius: 2px; background: #ffffff40; }
  #scr-grip:hover::before, #scr-grip.on::before { background: var(--blue); }
  #scr pre { margin: 6px 0 0; height: 45vh; min-height: 80px; max-height: 85vh; overflow: auto; font: 12px/1.35 ui-monospace, Menlo, monospace; background: #0a0c14; border-radius: 8px; padding: 8px; }
  #replybar { display: none; align-items: center; gap: 8px; margin-bottom: 6px; padding: 6px 6px 6px 10px; border-left: 3px solid #7aa2f7; background: var(--panel); border-radius: 10px; font-size: 13px; }
  #replybar .rq { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  #replybar .rq b { color: #cfd6f6; margin-right: 4px; }
  #replybar button { padding: 2px 10px; border-radius: 99px; }
  .to { font-size: 11px; opacity: .65; margin-top: 3px; }
  .b p { margin: 0 0 .55em; } .b p:last-child { margin-bottom: 0; }
  .b ul, .b ol { margin: 0 0 .55em; padding-left: 1.3em; }
  .b h1, .b h2, .b h3 { font-size: 1.05em; margin: .5em 0 .3em; }
  .b blockquote { margin: 0 0 .55em; padding-left: 10px; border-left: 3px solid var(--line); color: var(--dim); }
  .b code { font: 13.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace; background: #ffffff12; padding: 1px 6px; border-radius: 6px; }
  .b pre { margin: 0 0 .55em; background: #0a0c14; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
           overflow-x: auto; font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  .b pre code { background: none; padding: 0; }
  .b a.path code { color: var(--cyan); }
  /* the colors Claude's terminal gives `code` and **bold** */
  .b.ai code { color: #b1b9f9; } .b.ai pre code { color: inherit; }
  .b.ai b { color: #fff; }
  /* Codex's terminal: pink bold, green code */
  /* (its default theme, catppuccin-mocha) */
  .b.ai.cx b, .b.ai.cx i { color: #f38ba8; } .b.ai.cx code { color: #a6e3a1; } .b.ai.cx pre code { color: inherit; }
  .b.ai.cx .h1 { color: #f38ba8; text-decoration: underline; } .b.ai.cx .h2 { color: #fab387; }
  .b.ai.cx .h3 { color: #f9e2af; font-style: italic; } .b.ai.cx .h4 { color: #a6e3a1; font-style: italic; }
  .b.ai.cx .h5 { color: #74c7ec; font-style: italic; } .b.ai.cx .h6 { color: #b4befe; font-style: italic; }
  .b.ai.cx ul li::marker { color: #94e2d5; } .b.ai.cx ol li::marker { color: #89dceb; }
  .b.ai.cx blockquote { color: #f5c2e7; } .b.ai.cx a:not(.path) { color: #89b4fa; text-decoration: underline; }
  .da { color: var(--green); } .dd { color: var(--red); } .dh { color: var(--cyan); }
  .b .tbl { overflow-x: auto; margin: 0 0 .55em; }
  .b table { border-collapse: collapse; font-size: .95em; }
  .b th, .b td { border: 1px solid #3a3f5a; padding: 6px 14px; text-align: left; vertical-align: top; }
  .b th { text-align: center; background: #ffffff08; }
  .hk { color: var(--cyan); } .hs { color: var(--red); } .hn { color: var(--purple); }
  .hw { color: var(--pink); } .hc { color: var(--dim); font-style: italic; }
  .tool { align-self: flex-start; max-width: 94%; font-size: 13.5px; color: var(--dim); }
  .tool summary { cursor: pointer; list-style: none; padding: 5px 12px; background: #ffffff0a; border: 1px solid var(--line); border-radius: 99px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool[open] summary { white-space: normal; border-radius: 12px; }
  .tool pre { margin: 6px 0 0; padding: 8px 10px; background: #101420; border: 1px solid var(--line); border-radius: 10px;
              font: 12.5px/1.4 ui-monospace, Menlo, monospace; overflow-x: auto; max-height: 40vh; white-space: pre-wrap; color: var(--fg); }
  .tool pre.err { border-color: var(--red); }
  .ask { align-self: stretch; border: 1px solid #ff9e6466; border-radius: 18px; padding: 13px 14px; background: linear-gradient(160deg, #ff9e6419, #ff9e6406); }
  .ask h3 { margin: 0 0 4px; font-size: 15px; color: var(--orange); }
  .ask .what { font: 13px/1.4 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; margin-bottom: 8px; }
  .ask details { margin-bottom: 8px; color: var(--dim); font-size: 13px; }
  .ask details pre { margin: 4px 0 0; max-height: 30vh; overflow: auto; white-space: pre-wrap; font: 12.5px/1.4 ui-monospace, Menlo, monospace; }
  .ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask .row button { flex: 1; min-width: 90px; }
  .ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
  .ask .opts button.on { background: var(--blue); color: #111; border: 0; }
  .ask .q { font-weight: 600; margin-top: 6px; white-space: pre-line; }
  .ask.closed { border-color: var(--line); background: none; opacity: .7; }
  .ask.closed h3 { color: var(--dim); }
  .ask.closed .opts button:not(.on) { opacity: .5; }
  .ask .verdict { color: var(--dim); font-size: 13px; }
  .note { align-self: center; font-size: 12.5px; color: var(--dim); text-align: center; max-width: 90%; }
  .note.err { color: var(--red); }
  .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%; background: var(--dim); animation: bl 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bl { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
  #older { align-self: center; }
  #jump { position: absolute; right: 18px; bottom: 90px; width: 40px; height: 40px; padding: 0; border-radius: 50%; display: none; box-shadow: 0 4px 14px #0008; }
  #conn { font-size: 12px; text-align: center; color: var(--yellow); padding: 2px; display: none; flex: none; }

  /* typing */
  #composer { flex: none; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 70%, #0f111a00); }
  #chips { display: none; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  #chips button.on { background: #7aa2f733; border-color: #7aa2f7; }
  #chips button { padding: 3px 10px; font-size: 13px; border-radius: 99px; }
  #atlist { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; max-height: 40vh; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
  #atlist[hidden] { display: none; }
  #atlist button { display: flex; align-items: center; gap: 8px; border: 0; background: none; border-radius: 10px; padding: 6px 10px; text-align: left; min-width: 0; }
  #atlist button.on { background: #7aa2f733; }
  #atlist .cmd b { font: 600 13.5px ui-monospace, Menlo, monospace; color: var(--cyan); flex: none; }
  #atlist .ctag { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #ffffff14; color: var(--dim); }
  #atlist .hint { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #row { display: flex; gap: 6px; align-items: flex-end; }
  #text { scrollbar-width: none; flex: 1; min-height: 44px; max-height: 40vh; resize: none; font-size: 16px; border-radius: 22px; padding: 11px 16px; }
  #text::-webkit-scrollbar { display: none; }
  #row button { height: 44px; flex: none; border-radius: 22px; }
  #attach { width: 44px; padding: 0; font-size: 18px; }
  #send { width: 44px; padding: 0; font-size: 20px; }
  #status { font-size: 12px; color: var(--dim); min-height: 16px; padding: 0 4px 3px; }
  #status.err { color: var(--red); }

  /* sheets */
  /* a file opens over the chat, not in a new window; Esc, ✕ or a tap outside closes it */
  #viewer { width: min(96vw, 1100px); height: 90dvh; max-width: none; max-height: none; padding: 0;
            border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--fg); overflow: hidden; }
  #viewer[open] { display: flex; flex-direction: column; }
  #viewer::backdrop { background: #000a; backdrop-filter: blur(4px); }
  #viewer .vbar { display: flex; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); }
  #vname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px ui-monospace, Menlo, monospace; color: var(--dim); }
  #viewer .vbar a, #viewer .vbar button { font-size: 18px; line-height: 1; padding: 6px 10px; color: var(--fg); text-decoration: none; background: none; border: 0; cursor: pointer; }
  #vframe { flex: 1; width: 100%; border: 0; background: #1a1b26; }
  #vimg { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #0a0c14; }
  #viewer [hidden] { display: none; }
  #sheet { position: fixed; inset: 0; background: #0009; backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 5; }
  #sheet.on, #sheet2.on { display: flex; }
  .nb-st { font-weight: 600; } .nb-st.on { color: var(--green); }
  .nb-got { border-top: 1px solid var(--line); padding: 8px 0; font-size: 13px; }
  .nb-got .who { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .nb-text { white-space: pre-wrap; word-break: break-word; max-height: 30vh; overflow-y: auto; background: var(--panel);
    border-radius: 10px; padding: 8px 10px; margin: 4px 0; font-size: 13px; }
  .nb-files a { display: block; font-size: 13px; }
  #sheet2 { position: fixed; inset: 0; background: #000a; display: none; align-items: flex-end; justify-content: center; z-index: 6; }
  #sheet .in, #sheet2 .in { background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px;
               max-height: 92vh; overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet .in { background: var(--bg); border: 1px solid var(--line); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px;
               max-height: 92vh; overflow-y: auto; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet h2, #sheet2 h2 { margin: 0 0 10px; font-size: 18px; }
  #sheet label, #sheet2 label { display: block; margin: 10px 0 4px; color: var(--dim); font-size: 13px; }
  #sheet .acts, #sheet2 .acts { display: flex; gap: 8px; margin-top: 14px; }
  #sheet .acts button, #sheet2 .acts button { flex: 1; }
  /* the Settings sheet (settings.js, shared with the terminal view) */
  #sheet h3 { margin: 0 0 10px; font-size: 18px; }
  #sheet label.check { display: flex; align-items: center; gap: 8px; color: var(--fg); font-size: 14px; }
  #sheet label.check input { width: auto; margin: 0; }
  #sheet .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #sheet .row button { flex: 1; padding: 10px; }
  #sheet .go { background: var(--blue); color: #111; border: 0; font-weight: 600; }
  #sheet .pathline { display: flex; gap: 8px; align-items: center; }
  #sheet .pathline input { flex: 1; min-width: 0; }
  #sheet .pathline select { flex: none; width: auto; }
  #sheet .pathline button { flex: none; padding: 9px 12px; }
  #sheet .acct { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; }
  #sheet .acct span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #sheet .acct button { flex: none; padding: 7px 12px; }
  #sheet .scodeshow { font: 600 22px/1.4 ui-monospace, Menlo, monospace; letter-spacing: 2px; margin: 4px 0 8px; user-select: all; }

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const COLORS = ["--cyan", "--green", "--purple", "--pink", "--yellow", "--teal", "--orange", "--blue"];
const colorOf = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `var(${COLORS[h % COLORS.length]})`; };

// every chat gets an animal and a colour from its id; the main chat is the owl
const ANIMALS = ["🦊", "🐼", "🐯", "🐸", "🐙", "🦄", "🐧", "🦁", "🐨", "🐰", "🐻", "🐵", "🐳", "🦋", "🐢", "🦔", "🐝", "🦦", "🐶", "🐱", "🐮", "🐷", "🦖"];
const WORK = ["📷", "🎥", "📡", "📶", "🌐", "🔌", "🔧", "🛠️", "💻", "🖥️", "🤖", "🧠", "✨", "🔒", "🔑", "🧱", "☁️", "💾", "🗄️", "📦", "🧪", "🔬", "🛰️", "💡", "📊", "🐛", "⚙️", "🕹️"];
const RIDES = ["🚗", "🚕", "🚌", "🚓", "🚑", "🚒", "🚚", "🚜", "🏎️", "🏍️", "🚲", "🛴", "✈️", "🚁", "🚀", "🛸", "🚂", "🚄", "🚇", "⛵", "🚤", "🚢", "🛶", "🚡", "🛺", "🛻", "🚐", "🛵"];
const SPORT = ["🏃", "🏃‍♀️", "🏃‍♂️", "👟", "🎽", "🥾", "⏱️", "🏅", "🥇", "🏆", "🚴", "🏊", "⛰️", "🧗"];
// the animals also choose a chat's own picture (by its id) and are what the dice rolls: keep that list as it is
const PICK = [["Animals", ANIMALS], ["Work", WORK], ["Rides", RIDES], ["Sport", SPORT]];
const HUES = [0, 40, 90, 150, 200, 250, 300];     // how far the emoji's own colour is turned
const emo = (f) => `<span class="em" style="filter:${f.f}">${esc(f.e)}</span>`;
function face(r) {
  let h = 0; for (const c of String(r.id || "")) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const own = r.default ? { e: "🦉", hue: 0 } : { e: ANIMALS[(h >>> 8) % ANIMALS.length], hue: h % 360 };
  return { e: r.emoji || own.e, f: `hue-rotate(${Number.isInteger(r.hue) ? r.hue : own.hue}deg)` };
}
// the picture of a chat or a group: a group shows its members together, like Grok
function avOf(r) {
  if (!r.members) { const f = face(r); return { cls: "", style: "", html: emo(f) }; }
  const shown = r.members.length > 4 ? 3 : r.members.length;
  const dots = r.members.slice(0, shown).map((m) => { const f = face(m); return `<i>${emo(f)}</i>`; });
  if (r.members.length > 4) dots.push(`<i class="more">+${r.members.length - 3}</i>`);
  return { cls: "gav n" + dots.length, style: "", html: dots.join("") };
}
// the animal and colour chooser; get() says what is shown on top. The dice rolls a
// new animal and colour: a new chat starts with one rolled, and Start keeps it.
function picker(host, r) {
  const pick = { emoji: r.emoji || "", hue: Number.isInteger(r.hue) ? r.hue : null };
  const roll = () => { pick.emoji = ANIMALS[Math.floor(Math.random() * ANIMALS.length)]; pick.hue = HUES[Math.floor(Math.random() * HUES.length)]; };
  if (r.roll) roll();
  host.innerHTML = `<div class="pk"><div class="av big" id="pk-prev"></div>
    <div class="pk-tabs">${PICK.map(([name]) => `<button type="button" data-c="${name}">${name}</button>`).join("")}</div>
    <div class="pk-animals"></div>
    <div class="pk-hues"></div></div>`;
  let cat = (PICK.find(([, list]) => list.includes(pick.emoji)) || PICK[0])[0];      // the shelf of the picture it has now
  const paint = () => {
    host.querySelectorAll("[data-c]").forEach((b) => b.classList.toggle("on", b.dataset.c === cat));
    host.querySelector(".pk-animals").innerHTML = PICK.find(([name]) => name === cat)[1].map((a) => `<button type="button" data-e="${a}">${a}</button>`).join("");
    const f = face(Object.assign({}, r, pick));
    const prev = host.querySelector("#pk-prev"); prev.innerHTML = emo(f);
    host.querySelector(".pk-hues").innerHTML = `<button type="button" data-roll title="roll a new one">🎲</button>` +
      HUES.map((h) => `<button type="button" data-h="${h}">${emo({ e: f.e, f: `hue-rotate(${h}deg)` })}</button>`).join("");
    host.querySelectorAll("[data-e]").forEach((b) => b.classList.toggle("on", b.dataset.e === pick.emoji));
    host.querySelectorAll("[data-h]").forEach((b) => b.classList.toggle("on", +b.dataset.h === pick.hue));
  };
  host.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.roll !== undefined) roll();
    if (b.dataset.c !== undefined) cat = b.dataset.c;
    if (b.dataset.e !== undefined) pick.emoji = b.dataset.e;
    if (b.dataset.h !== undefined) pick.hue = +b.dataset.h;
    paint();
  };
  paint();
  return { get: () => ({ emoji: pick.emoji, hue: pick.hue }) };
}
// "Mirror a tab" chooser: the Claude tabs open in tabit; get() is null or {id, title}
// opus, sonnet, haiku or fable for a model id such as claude-opus-4-5; "" (default) otherwise
// who answers in a chat: a Codex or Grok tab's chat is Codex or Grok, every other chat is Claude
const AI_NAMES = { codex: "Codex", grok: "Grok" };
const aiName = (meta) => (meta && meta.tab && AI_NAMES[meta.tab.cli]) || "Claude";
const aliasOf = (id) => (cfg?.models || []).find((a) => a && String(id || "").includes(a)) || "";
// the colours tabit gives its tab groups
const GROUP_CSS = { red: "#f7768e", orange: "#ff9e64", yellow: "#e0af68", green: "#9ece6a", teal: "#73daca", cyan: "#7dcfff", blue: "#7aa2f7",
  indigo: "#8c8cff", purple: "#bb9af7", pink: "#ff79c6", gray: "#a9b1d6", white: "#e6e6e6", brown: "#c49a6c" };
// which tabit group a mirrored chat's tab sits in; "" when it sits in none
// "claude-sonnet-5-5" -> "sonnet 5.5"; an alias or an unknown id stays as it is
const modelShort = (id) => { const m = /^claude-([a-z]+)-(\d+)(?:-(\d+))?/.exec(id || ""); return m ? `${m[1]} ${m[2]}${m[3] ? "." + m[3] : ""}` : (id || ""); };
// the login and the model a chat uses, as one small badge
const usingBadge = (r) => {
  const model = (r.tab ? modelShort(r.tab.model) : (r.model || "default")) + ((r.tab ? r.tab.effort : r.effort) ? " " + (r.tab ? r.tab.effort : r.effort) : "");
  const who = r.tab && AI_NAMES[r.tab.cli] ? [AI_NAMES[r.tab.cli], r.account].filter(Boolean).join(" · ") : r.account || "Default";
  return `<span class="badge">${esc([who, model].filter(Boolean).join(" · "))}</span>`;
};

const HL_WORDS = new Set(("if else elif for while do return function const let var def class import from export as " +

  "unsigned long bool true false null None True False nil fn pub use mut local then fi esac done in echo sizeof typedef enum").split(" "));

    else if (m[2]) out += m[3] ? `<span class="hk">${esc(m[2])}</span>${esc(m[3])}` : `<span class="hs">${esc(m[2])}</span>`;

function md(text) {

  parts.forEach((part, i) => {
    if (i % 4 === 1 || i % 4 === 2) return;
    if (i % 4 === 3) {

    const endList = () => { if (list) out.push(`</${list}>`); list = null; };

  if (focus && !matchMedia("(pointer: coarse)").matches) $("scr-p").focus();     // type straight into it
}
function screenClose() { $("scr").hidden = true; clearInterval(scrTimer); scrTimer = scrTab = null; }
async function screenLoad() {
  if (!scrTab || Date.now() > scrUntil) return screenClose();
  try {
    const res = await fetch(`api/tabs/${encodeURIComponent(scrTab)}/screen`, { cache: "no-store" });
    const b = await res.json();
    if (!res.ok) throw new Error(b.error || `HTTP ${res.status}`);
    const lines = screenLines(b);
    if (dialogOpen(lines, scrCli)) { scrSeen = true; scrGone = 0; scrUntil = Date.now() + SCR_FOR; }   // open: keep showing it
    else if (scrSeen && ++scrGone >= 2) return screenClose();      // closed in the tab
    const pre = $("scr-p"), end = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 20;
    pre.textContent = lines.slice(-40).join("\n");
    if (end) pre.scrollTop = pre.scrollHeight;
  } catch (e) { $("scr-p").textContent = e.message; }
}
async function screenUp(tab) {               // the tab's screen is open this moment
  const res = await fetch(`api/tabs/${encodeURIComponent(tab)}/screen`, { cache: "no-store" });
  const b = await res.json();
  return res.ok && dialogOpen(screenLines(b), scrCli);
}

// with the screen focused, the keyboard works the tab's screen: named keys

const SCR_KEYS = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", Enter: "enter",
  Tab: "tab", Backspace: "backspace", PageUp: "pgup", PageDown: "pgdn", Home: "home", End: "end", " ": "space" };
let scrChain = Promise.resolve();
$("scr-p").addEventListener("keydown", (e) => {
  if (!scrTab || e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
  const tab = scrTab, key = e.key === "Escape" ? "esc" : SCR_KEYS[e.key];
  const text = !key && e.key.length === 1 ? e.key : null;
  if (!key && !text) return;
  e.preventDefault();
  scrChain = scrChain.then(async () => {
    // Esc in a Claude that works stops it: only while its screen still shows
    if (key === "esc" && !(await screenUp(tab))) return;
    await api(`api/tabs/${encodeURIComponent(tab)}/${key ? "key" : "type"}`, key ? { key } : { text });
  }).catch((err) => status(err.message, true)).then(() => setTimeout(screenLoad, 250));

async function upload(file) {
  const name = file.name || "paste." + (file.type.split("/")[1] || "bin");
  status(`uploading ${name}…`);
  try {
    const res = await fetch(`api/upload?name=${encodeURIComponent(name)}`, { method: "POST", body: file,
      headers: { "Content-Type": "application/octet-stream", "X-Tabit": "1" } });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    const t = $("text");
    t.value = (t.value && !/\s$/.test(t.value) ? t.value + " " : t.value) + body.path + " ";
    t.dispatchEvent(new Event("input")); t.focus(); status("");
  } catch (e) { status("upload: " + e.message, true); }
}

    sheet(`<h2>Chat</h2><div id="e-look"></div><div class="hint">${m.tab ? "Its tab in tabit: the name is the tab’s name" : esc(tilde(m.cwd))}</div>
      <label>Name</label><input id="e-title" value="${esc(m.title)}" maxlength="80">
      <div ${grok ? "hidden" : ""}><label>Account</label><select id="e-account">${accts.map((a) => `<option value="${esc(a.name)}"${a.name === (m.account || "") ? " selected" : ""}>${esc(a.label)}</option>`).join("")}</select>
      <div ${m.tab ? "hidden" : ""}><label>When Claude wants to do something</label><select id="e-mode">${opts(cfg.modes, m.mode, (x) => MODE_NAME[x])}</select>
      <div class="hint warn" id="e-warn" ${m.mode === "bypass" ? "" : "hidden"}>Bypass: no questions asked.</div></div>
      <label>Model</label><select id="e-model">${codex
        ? cmodels.map((x) => `<option value="${esc(x.name)}"${x.name === (m.tab.model || "") ? " selected" : ""}>${esc(x.label)}</option>`).join("")
        : opts(cfg.models, m.tab ? aliasOf(m.tab.model) : m.model, (x) => x || "default")}</select>
      <label>Thinking effort</label><select id="e-effort"></select></div>
      <div class="hint" ${m.tab && m.tab.model ? "" : "hidden"}>${m.tab ? "Answering as " + esc(m.tab.model) + (grok ? ". Its login and model are set in its tab." : ". A new model starts with the next message, and only when the tab is not busy.") : ""}</div>
      <div ${m.tab ? "hidden" : ""}><label>Connectors</label><button type="button" id="e-reload">↻ Reload Claude</button>
      <div class="hint" id="e-reloaded">Changed a connector (Gmail, Strava…)? Tap this. The chat keeps its history.</div></div>
      <div class="hint" id="e-err" style="color:var(--red)"></div>
      <div class="acts">${m.default ? "" : '<button type="button" class="danger" id="e-del">Delete</button>'}<button type="button" id="e-cancel">Cancel</button><button type="button" class="primary" id="e-save">Save</button></div>`);
    $("e-reload").onclick = async () => {
      try { await api(`api/chats/${t.id}/reload`, {}); $("e-err").textContent = ""; $("e-reloaded").textContent = "Done. Your next message starts a fresh Claude."; }
      catch (e) { $("e-err").textContent = e.message; }
    };
    const look = picker($("e-look"), m);
    $("e-mode").onchange = () => { $("e-warn").hidden = $("e-mode").value !== "bypass"; };
    // the efforts the model picked takes: Codex says so per model, Claude takes them all
    const effortNow = (m.tab ? m.tab.effort : m.effort) || "";
    const effortsFill = (first) => {
      const list = codex ? ((cmodels.find((x) => x.name === $("e-model").value) || {}).efforts || [""]) : (cfg.efforts || [""]);
      let want = first ? effortNow : $("e-effort").value;
      if (!first && !list.includes(want)) want = "";      // another model: one it takes
      $("e-effort").innerHTML = opts(list.includes(want) ? list : [...list, want], want, (x) => x || "default");
    };
    effortsFill(true);
    $("e-model").onchange = () => effortsFill(false);
    const asked = () => grok ? { title: $("e-title").value, ...look.get() }
      : { title: $("e-title").value, mode: $("e-mode").value, model: $("e-model").value, effort: $("e-effort").value, ...($("e-account").value !== (m.account || "") ? { account: $("e-account").value } : {}), ...look.get() };
    $("e-save").onclick = async () => { try { await api(`api/chats/${t.id}/edit`, asked()); done(); } catch (e) { $("e-err").textContent = e.message; } };
    if ($("e-del")) $("e-del").onclick = async () => { if (!confirm(m.tab ? "Delete this chat? Its tab in tabit closes too." : "Delete this chat and its history?")) return; try { await api(`api/chats/${t.id}/delete`, {}); gone(); } catch (e) { $("e-err").textContent = e.message; } };
  }
  $("e-cancel").onclick = closeSheet;
};
$("more").onclick = () => settings();

// --- Nearby: send text and files to a tabit on this LAN, like AirDrop -------
// Receiving is off until picked here, and goes off by itself. What comes is
// someone else's: shown as plain text (no links made of it), files only saved.
const nbClock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const sizeOf = (n) => (n < 1024 ? n + " B" : n < 1 << 20 ? Math.round(n / 1024) + " KB" : (n / (1 << 20)).toFixed(1) + " MB");
const NB_TIMES = { "10m": "10 minutes", "1h": "1 hour", "8h": "8 hours" };
let nbTimer = null;
const nbAsked = new Set();         // offers already put in front of you
function nearbyWatch(on) {         // look for offers while receiving is on
  if (on && !nbTimer) nbTimer = setInterval(nearbyCheck, 3000);
  if (!on && nbTimer) { clearInterval(nbTimer); nbTimer = null; }
}
async function nearbyCheck() {
  let st;
  try { st = await api("api/chats/nearby"); } catch (e) { return; }
  nearbyWatch(st.on);
  const o = (st.offers || []).find((x) => !nbAsked.has(x.id));
  if (o && !$("sheet2").classList.contains("on")) nearbyOffer(o);
}
async function nearbyOffer(o) {
  nbAsked.add(o.id);
  if (!cfg) cfg = await api("api/chats").catch(() => null);    // the chats to pick from
  const box = $("sheet2in");
  box.innerHTML = `<h2>📡 ${esc(o.from)}</h2><div class="hint">${esc(o.address)} wants to send you:</div>
    ${o.text ? `<div class="nb-text">${esc(o.text)}</div>` : ""}
    ${o.files.length ? `<div class="hint">${o.files.map((f) => `📎 ${esc(f.name)} (${sizeOf(f.size)})`).join("<br>")}</div>` : ""}
    <label>Put it in</label>
    <select id="nb-into"><option value="">Just keep it (Received in 📡)</option>${(cfg?.chats || []).filter((c) => !c.default).map((c) => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join("")}</select>
    <div class="hint">A chat gets the text and the files' paths, typed to its AI as if you sent them.</div>
    <div class="hint" id="nb-oerr" style="color:var(--red)"></div>
    <div class="acts"><button type="button" id="nb-no">Decline</button><button type="button" class="primary" id="nb-yes">Accept</button></div>`;
  $("sheet2").classList.add("on");
  const close = () => { $("sheet2").classList.remove("on"); box.innerHTML = ""; };
  const done = async (accept) => {
    $("nb-no").disabled = $("nb-yes").disabled = true;         // one answer, not two
    const into = accept ? $("nb-into").value : "";
    try {
      const out = await api("api/chats/nearby/answer", { id: o.id, accept, chat: into });
      if (into && !out.sent) { close(); nearbySay("Saved, but not sent to the chat: " + (out.error || "it failed")); return; }
      if (into) { close(); location.hash = "#c/" + into; return; }
    } catch (e) {
      if (e.status === 404) { close(); nearbySay("That offer is gone: it waited too long."); return; }
      $("nb-oerr").textContent = e.message; $("nb-no").disabled = $("nb-yes").disabled = false; return;
    }
    close();
    if (accept) nearbySheet();
  };
  $("nb-no").onclick = () => done(false);
  $("nb-yes").onclick = () => done(true);
}
// a word about an offer, in the Nearby sheet: the list view has no status line
async function nearbySay(text) {
  await nearbySheet();
  if ($("nb-msg")) $("nb-msg").textContent = text;
}
async function sendFile(file) {    // upload one file; gives its path on this computer
  const res = await fetch(`api/upload?name=${encodeURIComponent(file.name || "file")}`, { method: "POST", body: file,
    headers: { "Content-Type": "application/octet-stream", "X-Tabit": "1" } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body.path;
}
async function nearbySheet() {
  let st;
  try { st = await api("api/chats/nearby"); } catch (e) { sheet(`<h2>Nearby</h2><div class="hint warn">${esc(e.message)}</div><div class="acts"><button type="button" id="nb-close">Close</button></div>`); $("nb-close").onclick = closeSheet; return; }
  nearbyWatch(st.on);
  sheet(`<h2>📡 Nearby</h2>
    <div class="hint">Send text and files to a tabit on this LAN, and get them from one. You are <b>${esc(st.name)}</b>.</div>
    <label>Receiving</label>
    <div><span class="nb-st${st.on ? " on" : ""}">${st.on ? "On until " + nbClock(st.until) : "Off"}</span></div>
    <div class="chips">${st.times.map((k) => `<button type="button" data-nbon="${k}">${st.on ? "" : "On for "}${NB_TIMES[k] || k}</button>`).join("")}${st.on ? '<button type="button" id="nb-off">Turn off</button>' : ""}</div>
    <div class="hint">${{
      opened: `tabit opened TCP port ${st.port} in the firewall while receiving, and closes it after.`,
      already: `TCP port ${st.port} is open in the firewall.`,
      manual: `The firewall is on, and tabit may not change it (sudo asks for a password). Run this once: <code>sudo ufw allow ${st.port}/tcp</code>`,
      none: `Others reach you on TCP port ${st.port}.`,
    }[st.firewall] || `While receiving, others reach you on TCP port ${st.port}; tabit opens it in the firewall if needed.`} Each thing sent asks you first.</div>
    <label>Send to</label>
    <div class="chips"><select id="nb-to" style="flex:1"><option value="">Looking…</option></select><button type="button" id="nb-look">↻</button></div>
    <textarea id="nb-text" rows="3" placeholder="Text (optional)"></textarea>
    <input type="file" id="nb-files" multiple>
    <div class="hint" id="nb-msg"></div>
    <div class="acts"><button type="button" id="nb-close">Close</button><button type="button" class="primary" id="nb-send">Send</button></div>
    ${st.got.length ? `<label>Received</label>${st.got.map((g) => `<div class="nb-got"><div class="who">${esc(g.from)} · ${timeAgo(g.ts)}</div>${g.text ? `<div class="nb-text">${esc(g.text)}</div>` : ""}<div class="nb-files">${g.files.map((f) => `<a target="_blank" rel="noopener" href="api/file?path=${encodeURIComponent(f)}&amp;render=1">📎 ${esc(f.split("/").pop())}</a>`).join("")}</div></div>`).join("")}` : ""}`);
  let peers = [];
  const look = async () => {
    const to = $("nb-to");          // the sheet may close before avahi answers
    to.innerHTML = '<option value="">Looking…</option>';
    try { peers = (await api("api/chats/nearby/peers")).peers; } catch (e) { peers = []; }
    to.innerHTML = peers.length ? peers.map((x, i) => `<option value="${i}">${esc(x.name)} · ${esc(x.address)}</option>`).join("")
      : '<option value="">No tabit nearby is receiving</option>';
  };
  look();
  $("nb-look").onclick = look;
  $("nb-close").onclick = closeSheet;
  $("sheetin").querySelectorAll("[data-nbon]").forEach((b) => { b.onclick = async () => {
    try { await api("api/chats/nearby/on", { for: b.dataset.nbon }); nearbySheet(); } catch (e) { $("nb-msg").textContent = e.message; }
  }; });
  if ($("nb-off")) $("nb-off").onclick = async () => { await api("api/chats/nearby/off", {}).catch(() => {}); nearbySheet(); };
  $("nb-send").onclick = async () => {
    // kept, not looked up again: the sheet may be closed when the answer comes
    const to = peers[$("nb-to").value], msg = $("nb-msg"), btn = $("nb-send"), box = $("nb-text"), pick = $("nb-files");
    const text = box.value, files = [...pick.files];
    if (!to) { msg.textContent = "Pick a tabit to send to."; return; }
    if (!text.trim() && !files.length) { msg.textContent = "Write something or pick a file."; return; }
    btn.disabled = true;
    try {
      msg.textContent = files.length ? "Uploading…" : "";
      const paths = [];
      for (const f of files) paths.push(await sendFile(f));
      msg.textContent = `Waiting for ${to.name} to answer…`;
      const out = await api("api/chats/nearby/send", { to, text, files: paths });
      msg.textContent = { accepted: "✓ Accepted", declined: "Declined", expired: "No answer", off: "They turned receiving off",
        failed: "They accepted, but could not save it" }[out.answer] || out.answer;
      if (out.answer === "accepted") { box.value = ""; pick.value = ""; }
    } catch (e) { msg.textContent = e.message; }
    btn.disabled = false;
  };
}
$("nearby").onclick = $("sb-nearby").onclick = nearbySheet;
nearbyCheck();

document.addEventListener("visibilitychange", () => { if (!document.hidden && !cur) loadList(); });
route();
</script>
<script>
/* a wide screen: drag the line between the list and the chat; the width is kept */
(() => {
  const grip = document.getElementById("grip"), root = document.documentElement, KEY = "chatListW", MIN = 240;
  const set = (w) => root.style.setProperty("--listw", Math.round(Math.min(Math.max(w, MIN), Math.max(MIN, innerWidth - 360))) + "px");
  const saved = +localStorage.getItem(KEY); if (saved) set(saved);
  grip.onpointerdown = (e) => {
    grip.setPointerCapture(e.pointerId); grip.classList.add("on");
    grip.onpointermove = (m) => set(m.clientX);
    grip.onpointerup = () => { grip.classList.remove("on"); grip.onpointermove = grip.onpointerup = null;
      localStorage.setItem(KEY, parseInt(root.style.getPropertyValue("--listw")) || ""); };
  };
  grip.ondblclick = () => { root.style.removeProperty("--listw"); localStorage.removeItem(KEY); };
  addEventListener("resize", () => { const w = parseInt(root.style.getPropertyValue("--listw")); if (w) set(w); });
})();
</script>
</body>
